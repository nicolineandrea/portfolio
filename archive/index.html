e();\n\n      const source = audioContext.createMediaStreamSource(microphoneStream);\n      const analyser = audioContext.createAnalyser();\n\n      analyser.fftSize = 2048;\n      analyser.smoothingTimeConstant = 0.88;\n      const samples = new Float32Array(analyser.fftSize);\n      const frequencyData = new Uint8Array(analyser.frequencyBinCount);\n      source.connect(analyser);\n\n      microphoneActive = true;\n      lastVisualUpdate = 0;\n      micToggle.textContent = 'SOUND OFF';\n      microphoneAnimation = requestAnimationFrame(timestamp => {\n        updateMicrophone(analyser, samples, frequencyData, timestamp);\n      });\n    } catch (error) {\n      microphoneStream?.getTracks().forEach(track => track.stop());\n      microphoneStream = undefined;\n      await audioContext?.close().catch(() => {});\n      audioContext = undefined;\n      microphoneActive = false;\n      micToggle.textContent = 'MIC DENIED';\n    } finally {\n      micToggle.disabled = false;\n    }\n  }\n\n  async function stopMicrophone() {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n    await audioContext?.close().catch(() => {});\n\n    microphoneStream = undefined;\n    audioContext = undefined;\n    microphoneActive = false;\n    displayedLevel = 0;\n    micMeter.setAttribute('aria-valuenow', '0');\n    micToggle.textContent = 'SOUND ON';\n    drawRecordingLine();\n  }\n\n  micToggle.addEventListener('click', () => {\n    if (microphoneActive) {\n      stopMicrophone();\n    } else {\n      startMicrophone();\n    }\n  });\n\n  window.addEventListener('keydown', event => {\n    const target = event.target;\n    const isEditable = target instanceof HTMLElement && (\n      target.isContentEditable ||\n      target.tagName === 'INPUT' ||\n      target.tagName === 'TEXTAREA' ||\n      target.tagName === 'SELECT'\n    );\n\n    if (event.code !== 'Space' || event.repeat || isEditable) {\n      return;\n    }\n\n    event.preventDefault();\n    if (!micToggle.disabled) {\n      micToggle.click();\n    }\n  });\n\n  window.addEventListener('resize', drawRecordingLine);\n  window.addEventListener('pagehide', () => {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n  });\n}\n\nconst drawingCanvas = document.querySelector('.about-drawing');\n\nconst musicCopy = document.querySelector('.music-page .subpage-copy');\n\nif (musicCopy) {\n  musicCopy.querySelectorAll('p').forEach(paragraph => {\n    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n    const textNodes = [];\n\n    while (walker.nextNode()) {\n      if (!walker.currentNode.parentElement.closest('.album-title, .band-link')) {\n        textNodes.push(walker.currentNode);\n      }\n    }\n\n    textNodes.forEach(textNode => {\n      const fragment = document.createDocumentFragment();\n      const parts = textNode.textContent.split(/(\\s+)/);\n\n      parts.forEach(part => {\n        if (!part || /^\\s+$/.test(part)) {\n          fragment.appendChild(document.createTextNode(part));\n          return;\n        }\n\n        const word = document.createElement('span');\n        word.className = 'music-word';\n        word.textContent = part;\n        fragment.appendChild(word);\n      });\n\n      textNode.replaceWith(fragment);\n    });\n  });\n\n  const discoverAlbum = event => {\n    if (\n      event.target instanceof Element &&\n      event.target.matches('.album-title, .band-link')\n    ) {\n      event.target.classList.add('is-discovered');\n    }\n  };\n\n  musicCopy.addEventListener('pointerover', discoverAlbum);\n  musicCopy.addEventListener('focusin', discoverAlbum);\n}\n\nif (drawingCanvas) {\n  document.querySelectorAll('.about-copy p').forEach(paragraph => {\n    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n    const textNodes = [];\n\n    while (walker.nextNode()) {\n      if (!walker.currentNode.parentElement.closest('.keyword, .future-link')) {\n        textNodes.push(walker.currentNode);\n      }\n    }\n\n    textNodes.forEach(textNode => {\n      const fragment = document.createDocumentFragment();\n      const parts = textNode.textContent.split(/(\\s+)/);\n\n      parts.forEach(part => {\n        if (!part || /^\\s+$/.test(part)) {\n          fragment.appendChild(document.createTextNode(part));\n          return;\n        }\n\n        const word = document.createElement('span');\n        word.className = 'about-word';\n        word.textContent = part;\n        fragment.appendChild(word);\n      });\n\n      textNode.replaceWith(fragment);\n    });\n  });\n\n  document.querySelector('.about-copy').addEventListener('pointerover', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  document.querySelector('.about-copy').addEventListener('focusin', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  const drawingContext = drawingCanvas.getContext('2d');\n  const drawingToggle = document.querySelector('.drawing-toggle');\n  const drawingClear = document.querySelector('.drawing-clear');\n  const aboutPage = document.querySelector('.about-page');\n  const aboutContent = document.querySelector('.subpage');\n  const strokes = [];\n\n  let drawingEnabled = false;\n  let activePointer = null;\n  let activeStroke = null;\n  let canvasWidth = 0;\n  let canvasHeight = 0;\n  let resizeFrame;\n\n  function configureDrawingContext() {\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    drawingContext.lineWidth = 5;\n    drawingContext.lineCap = 'round';\n    drawingContext.lineJoin = 'round';\n    drawingContext.strokeStyle = getComputedStyle(aboutPage)\n      .getPropertyValue('--about-accent').trim() || '#ff34b3';\n  }\n\n  function renderDrawing() {\n    drawingContext.clearRect(0, 0, canvasWidth, canvasHeight);\n    configureDrawingContext();\n\n    strokes.forEach(stroke => {\n      if (stroke.length === 0) {\n        return;\n      }\n\n      drawingContext.beginPath();\n      drawingContext.moveTo(stroke[0].x, stroke[0].y);\n\n      if (stroke.length === 1) {\n        drawingContext.lineTo(stroke[0].x + 0.01, stroke[0].y + 0.01);\n      } else {\n        stroke.slice(1).forEach(point => {\n          drawingContext.lineTo(point.x, point.y);\n        });\n      }\n\n      drawingContext.stroke();\n    });\n  }\n\n  function resizeDrawingCanvas() {\n    const nextWidth = Math.max(document.documentElement.scrollWidth, window.innerWidth);\n    const nextHeight = Math.max(document.documentElement.scrollHeight, window.innerHeight);\n\n    if (nextWidth === canvasWidth && nextHeight === canvasHeight) {\n      return;\n    }\n\n    if (canvasWidth && canvasHeight) {\n      const scaleX = nextWidth / canvasWidth;\n      const scaleY = nextHeight / canvasHeight;\n\n      strokes.forEach(stroke => {\n        stroke.forEach(point => {\n          point.x *= scaleX;\n          point.y *= scaleY;\n        });\n      });\n    }\n\n    canvasWidth = nextWidth;\n    canvasHeight = nextHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingCanvas.width = Math.round(canvasWidth * pixelRatio);\n    drawingCanvas.height = Math.round(canvasHeight * pixelRatio);\n    drawingCanvas.style.width = `${canvasWidth}px`;\n    drawingCanvas.style.height = `${canvasHeight}px`;\n    renderDrawing();\n  }\n\n  function scheduleCanvasResize() {\n    cancelAnimationFrame(resizeFrame);\n    resizeFrame = requestAnimationFrame(resizeDrawingCanvas);\n  }\n\n  function isControl(target) {\n    return target instanceof Element && Boolean(target.closest(\n      'a, button, input, textarea, select, [contenteditable=\"true\"]'\n    ));\n  }\n\n  function addDrawingPoint(event) {\n    const events = event.getCoalescedEvents?.() || [event];\n\n    events.forEach(pointerEvent => {\n      activeStroke.push({ x: pointerEvent.pageX, y: pointerEvent.pageY });\n    });\n\n    renderDrawing();\n  }\n\n  function finishStroke(event) {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    activePointer = null;\n    activeStroke = null;\n    drawingClear.disabled = strokes.length === 0;\n    drawingClear.hidden = strokes.length === 0;\n  }\n\n  drawingToggle.addEventListener('click', () => {\n    drawingEnabled = !drawingEnabled;\n    activePointer = null;\n    activeStroke = null;\n    aboutPage.classList.toggle('is-drawing', drawingEnabled);\n    drawingToggle.setAttribute('aria-pressed', String(drawingEnabled));\n    drawingToggle.textContent = drawingEnabled ? 'DRAW OFF' : 'DRAW ON';\n    drawingClear.hidden = !drawingEnabled || strokes.length === 0;\n  });\n\n  drawingClear.addEventListener('click', () => {\n    strokes.length = 0;\n    activePointer = null;\n    activeStroke = null;\n    drawingClear.disabled = true;\n    drawingClear.hidden = true;\n    renderDrawing();\n  });\n\n  document.addEventListener('pointerdown', event => {\n    if (!drawingEnabled || activePointer !== null || isControl(event.target)) {\n      return;\n    }\n\n    if (event.pointerType === 'mouse' && event.button !== 0) {\n      return;\n    }\n\n    event.preventDefault();\n    activePointer = event.pointerId;\n    activeStroke = [];\n    strokes.push(activeStroke);\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointermove', event => {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    event.preventDefault();\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointerup', finishStroke, { capture: true });\n  document.addEventListener('pointercancel', finishStroke, { capture: true });\n  window.addEventListener('resize', scheduleCanvasResize);\n\n  if ('ResizeObserver' in window && aboutContent) {\n    new ResizeObserver(scheduleCanvasResize).observe(aboutContent);\n  }\n\n  document.fonts?.ready.then(scheduleCanvasResize);\n  resizeDrawingCanvas();\n}\n","explanation":"I decided to keep the filtering simple and focus on introducing the band members."},{"id":"058","sourceId":"058","focus":"","prompt":"Replace the group photo with aanim_blue from the folder. When hovering over Nils, Nicoline, Lucas or Nuria, show the individual portraits I prepared in the folder, with their name and instrument above the image. Nils is on the left, Nicoline at the top, Nuria below and Lucas on the right. Julia appears in the photo as a stick figure.","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"de\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Bands &amp; Live &mdash; Nicoline Andrea\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody class=\"music-page\">\n  \u003cmain class=\"subpage\">\n    \u003ch1 class=\"interactive-title\">Bands &amp; Live\u003c/h1>\n\n    \u003csection class=\"aanim-section\">\n      \u003cdiv class=\"aanim-side-label\" aria-hidden=\"true\">\n        \u003cspan>AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"band-gallery music-media\">\n        \u003cdiv class=\"band-feature\">\n          \u003cdiv class=\"band-portrait\">\n            \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43e5-813-_K5A0215.jpg.jpg\" alt=\"AANIM band photograph\">\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"band-portrait\">\n          \u003cdiv class=\"member-credit-line\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\n          \u003cdiv class=\"band-photo-frame\">\n            \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f473c-38-AANIMblue.jpg.jpg\" alt=\"AANIM band photograph\">\n            \u003cbutton class=\"member-hotspot nicoline\" type=\"button\" data-credit=\"Nicoline Andrea Janka: vocals &amp; synth\" data-photo=\"../../shared/historical-previews/019f473c-211-nicoline.jpg.jpg\" aria-label=\"Nicoline Andrea Janka: vocals and synth\">\u003c/button>\n            \u003cbutton class=\"member-hotspot nils\" type=\"button\" data-credit=\"Nils Stricker: drums &amp; backing vocals\" data-photo=\"../../shared/historical-previews/019f43e5-1588-nils.jpg.jpg\" aria-label=\"Nils Stricker: drums and backing vocals\">\u003c/button>\n            \u003cbutton class=\"member-hotspot lucas\" type=\"button\" data-credit=\"Lucas Sevilla: guitar\" data-photo=\"../../shared/historical-previews/019f473c-210-lucas.jpg.jpg\" aria-label=\"Lucas Sevilla: guitar\">\u003c/button>\n            \u003cbutton class=\"member-hotspot nuria\" type=\"button\" data-credit=\"Nuria Kr&auml;uchi: bass\" data-photo=\"../../shared/historical-previews/019f473c-208-nuria.jpg.jpg\" aria-label=\"Nuria Kr&auml;uchi: bass\">\u003c/button>\n            \u003cbutton class=\"member-hotspot julia\" type=\"button\" data-credit=\"Julia S&uuml;ess: guitar &amp; backing vocals\" aria-label=\"Julia S&uuml;ess: guitar and backing vocals\">\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"subpage-copy\">\n        \u003cp>\u003ca class=\"band-link\" href=\"https://www.aanim.net/\" target=\"_blank\" rel=\"noopener noreferrer\">AANIM\u003c/a> is a five-piece band mainly active around Bern and Lucerne. We have released two albums, \u003ccite class=\"album-group\">\u003ca class=\"album-title\" href=\"https://www.youtube.com/watch?v=NfXw7TAZ9So&amp;list=PLRzOEHudKts8Yos7VX5m1hdJrkdIYfACM\" target=\"_blank\" rel=\"noopener noreferrer\">Contemplation\u003c/a> / \u003ca class=\"album-title\" href=\"https://www.youtube.com/playlist?list=PLRzOEHudKts9ik3KUaXOOckEsWUtVcOpG\" target=\"_blank\" rel=\"noopener noreferrer\">Remedy\u003c/a>\u003c/cite> and \u003ccite>\u003ca class=\"album-title\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\">Fuormas Neras\u003c/a>\u003c/cite>, and played shows at venues such as Sch&uuml;&uuml;r, Mokka, Gaskessel and many more. I sing and play synths in the band. We love cozy shows, small rooms and being close to the audience.\u003c/p>\n      \u003c/div>\n\n      \u003ca class=\"press-kit-link\" href=\"https://drive.google.com/drive/folders/12CpQy8bRiUTXSCPex7sveMCx31APhtmg\" target=\"_blank\" rel=\"noopener noreferrer\">PRESS KIT AANIM\u003c/a>\n\n      \u003cdiv class=\"video-embed music-media\">\n        \u003ciframe\n          src=\"https://www.youtube-nocookie.com/embed/ehqON-5_tG4?start=8\"\n          title=\"AANIM video\"\n          loading=\"lazy\"\n          referrerpolicy=\"strict-origin-when-cross-origin\"\n          allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\"\n          allowfullscreen>\n        \u003c/iframe>\n      \u003c/div>\n    \u003c/section>\n    \u003ca class=\"subpage-back\" href=\"../../index.html\" target=\"_top\" aria-label=\"Zur&uuml;ck zu den Themen\">&larr;\u003c/a>\n  \u003c/main>\n\n  \u003cscript src=\"script.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","styles":"* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: c r(--about-accent);\n}\n\n.keyword:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-drawing {\n  position: absolute;\n  top: 0;\n  left: 0;\n  z-index: 0;\n  display: block;\n  pointer-events: none;\n}\n\n.about-page .subpage {\n  position: relative;\n  z-index: 1;\n}\n\n.drawing-controls {\n  position: fixed;\n  bottom: 32px;\n  left: 32px;\n  z-index: 2;\n  display: flex;\n  align-items: center;\n  gap: 18px;\n}\n\n.drawing-hint,\n.drawing-clear {\n  display: inline-block;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  font: inherit;\n  font-size: clamp(18px, 2vw, 28px);\n  font-weight: 900;\n  cursor: pointer;\n  transition: color 100ms ease;\n}\n\n.drawing-clear {\n  appearance: none;\n  color: #111111;\n  -webkit-text-fill-color: #111111;\n}\n\n.drawing-hint {\n  cursor: default;\n}\n\n.drawing-controls button[hidden] {\n  display: none;\n}\n\n.drawing-clear:not(:disabled):hover,\n.drawing-clear:not(:disabled):focus-visible {\n  color: #111111;\n  -webkit-text-fill-color: #111111;\n}\n\n.drawing-clear:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.drawing-clear:disabled {\n  cursor: default;\n}\n\n.about-page.is-drawing,\n.about-page.is-drawing * {\n  cursor: crosshair;\n  user-select: none;\n}\n\n.about-page.is-drawing {\n  touch-action: none;\n}\n\n.about-page.is-drawing a,\n.about-page.is-drawing button {\n  cursor: pointer;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 20px;\n  }\n\n  .mic-control {\n    right: 20px;\n    bottom: 20px;\n    left: 20px;\n    gap: 10px;\n  }\n\n  .main-nav {\n    padding: 20px;\n  }\n\n  .subpage {\n    padding: 20px 20px 56px;\n  }\n\n  .drawing-controls {\n    bottom: 20px;\n    left: 20px;\n  }\n\n  .aanim-side-label {\n    display: none;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .letter,\n  .main-nav a,\n  .subpage-back,\n  .about-word,\n  .music-word,\n  .album-title,\n  .band-link,\n  .press-kit-link,\n  .keyword,\n  .future-link,\n  .funfacts-section,\n  .funfacts-slide,\n  .funfacts-next,\n  .drawing-hint,\n  .drawing-controls button {\n    transition: none;\n  }\n\n}\n\nmain > h1 { display:none !important } .music-page .subpage { --music-title-width:1050px !important } .band-gallery { margin-top:0 } main.subpage > :not(.aanim-section), .aanim-section > :not(.band-gallery), .band-gallery > .band-feature, body.music-page .subpage-back { display:none !important }h1 .letter, h2 .letter { pointer-events:none }","script":"document.querySelectorAll('h1 .word').forEach(word => {\n  const text = word.textContent;\n  word.setAttribute('aria-label', text);\n  word.textContent = '';\n\n  [...text].forEach(character => {\n    const letter = document.createElement('span');\n    letter.className = 'letter';\n    letter.setAttribute('aria-hidden', 'true');\n    letter.textContent = character;\n    word.appendChild(letter);\n  });\n});\n\ndocument.querySelectorAll('.interactive-title').forEach(title => {\n  const words = title.textContent.trim().split(/\\s+/);\n  const fullTitle = words.join(' ');\n  const isAboutTitle = Boolean(title.closest('.about-page'));\n\n  title.setAttribute('aria-label', fullTitle);\n  title.textContent = '';\n\n  words.forEach((word, wordIndex) => {\n    const wordElement = isAboutTitle && word.toLowerCase() === 'me'\n      ? document.createElement('button')\n      : document.createElement('span');\n\n    wordElement.className = 'title-word';\n\n    if (wordElement instanceof HTMLButtonElement) {\n      wordElement.type = 'button';\n      wordElement.classList.add('about-me-trigger');\n      wordElement.setAttribute('aria-label', 'Funfacts about me');\n      wordElement.setAttribute('aria-controls', 'funfacts-section');\n      wordElement.setAttribute('aria-expanded', 'false');\n    } else {\n      wordElement.setAttribute('aria-hidden', 'true');\n    }\n\n    [...word].forEach(character => {\n      const letter = document.createElement('span');\n      letter.className = 'letter';\n      letter.textContent = character;\n      wordElement.appendChild(letter);\n    });\n\n    title.appendChild(wordElement);\n    if (wordIndex \u003c words.length - 1) {\n      title.appendChild(document.createTextNode(' '));\n    }\n  });\n});\n\nconst musicPage = document.querySelector('.music-page');\nconst musicTitle = musicPage?.querySelector('.interactive-title');\n\nif (musicPage && musicTitle) {\n  const syncMusicMediaWidth = () => {\n    musicPage.style.setProperty(\n      '--music-title-width',\n      `${Math.ceil(musicTitle.getBoundingClientRect().width)}px`\n    );\n  };\n\n  syncMusicMediaWidth();\n  window.addEventListener('resize', syncMusicMediaWidth);\n  document.fonts?.ready.then(syncMusicMediaWidth);\n}\n\nconst aanimGallery = document.querySelector('.music-page .band-gallery');\n\nif (aanimGallery) {\n  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');\n\n  if (!reducedMotion.matches) {\n    const noiseCanvas = document.createElement('canvas');\n    const noiseContext = noiseCanvas.getContext('2d', { alpha: true });\n    const ripples = [];\n    const grainPoints = [];\n\n    let noiseFrame;\n    let noiseWidth = 0;\n    let noiseHeight = 0;\n    let noisePixelRatio = 1;\n    let lastRippleTime = 0;\n    let lastNoiseTime = 0;\n\n    noiseCanvas.className = 'aanim-noise';\n    noiseCanvas.setAttribute('aria-hidden', 'true');\n    aanimGallery.prepend(noiseCanvas);\n\n    function resizeNoiseCanvas() {\n      const rect = aanimGallery.getBoundingClientRect();\n      const nextWidth = Math.max(1, Math.round(rect.width));\n      const nextHeight = Math.max(1, Math.round(rect.height));\n\n      if (nextWidth === noiseWidth && nextHeight === noiseHeight) {\n        return;\n      }\n\n      noiseWidth = nextWidth;\n      noiseHeight = nextHeight;\n      noisePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);\n      noiseCanvas.width = Math.round(noiseWidth * noisePixelRatio);\n      noiseCanvas.height = Math.round(noiseHeight * noisePixelRatio);\n      noiseContext.setTransform(noisePixelRatio, 0, 0, noisePixelRatio, 0, 0);\n\n      grainPoints.length = 0;\n      const spacing = 7;\n\n      for (let y = 0; y \u003c= noiseHeight; y += spacing) {\n        for (let x = 0; x \u003c= noiseWidth; x += spacing) {\n          grainPoints.push({\n            x: x + (Math.random() - 0.5) * spacing,\n            y: y + (Math.random() - 0.5) * spacing,\n            tone: Math.random() > 0.5 ? 255 : 0,\n            alpha: 0.012 + Math.random() * 0.018,\n            phase: Math.random() * Math.PI * 2\n          });\n        }\n      }\n    }\n\n    function drawNoise(timestamp) {\n      resizeNoiseCanvas();\n\n      const delta = Math.min(48, timestamp - lastNoiseTime || 16);\n      lastNoiseTime = timestamp;\n\n      noiseContext.clearRect(0, 0, noiseWidth, noiseHeight);\n\n      for (let index = ripples.length - 1; index >= 0; index--) {\n        const ripple = ripples[index];\n        ripple.age += delta;\n\n        if (ripple.age > 1200) {\n          ripples.splice(index, 1);\n        }\n      }\n\n      grainPoints.forEach(point => {\n        let offsetX = 0;\n        let offsetY = 0;\n        let rippleAlpha = 0;\n\n        ripples.forEach(ripple => {\n          const dx = point.x - ripple.x;\n          const dy = point.y - ripple.y;\n          const distance = Math.hypot(dx, dy);\n          const radius = ripple.age * 0.11 + 18;\n          const edge = Math.abs(distance - radius);\n          const wave = Math.max(0, 1 - edge / 58) * (1 - ripple.age / 1200);\n\n          if (wave \u003c= 0) {\n            return;\n          }\n\n          const angle = Math.atan2(dy, dx);\n          const pulse = Math.sin(edge * 0.12 - ripple.age * 0.012) * wave;\n\n          offsetX += Math.cos(angle) * pulse * 1.5;\n          offsetY += Math.sin(angle) * pulse * 1.5;\n          rippleAlpha += wave * 0.018;\n        });\n\n        const drift = Math.sin(timestamp * 0.00035 + point.phase) * 0.55;\n        const alpha = Math.min(0.052, point.alpha + rippleAlpha);\n\n        noiseContext.fillStyle = `rgba(${point.tone}, ${point.tone}, ${point.tone}, ${alpha})`;\n        noiseContext.fillRect(point.x + offsetX + drift, point.y + offsetY, 1, 1);\n      });\n\n      if (ripples.length > 0) {\n        noiseFrame = requestAnimationFrame(drawNoise);\n      } else {\n        noiseFrame = undefined;\n        lastNoiseTime = 0;\n      }\n    }\n\n    function disturbNoise(event) {\n      const now = performance.now();\n\n      if (now - lastRippleTime \u003c 85) {\n        return;\n      }\n\n      const rect = aanimGallery.getBoundingClientRect();\n      lastRippleTime = now;\n      ripples.push({\n        x: event.clientX - rect.left,\n        y: event.clientY - rect.top,\n        age: 0\n      });\n\n      if (ripples.length > 7) {\n        ripples.shift();\n      }\n\n      if (!noiseFrame) {\n        noiseFrame = requestAnimationFrame(drawNoise);\n      }\n    }\n\n    resizeNoiseCanvas();\n    noiseFrame = requestAnimationFrame(drawNoise);\n    window.addEventListener('resize', () => {\n      resizeNoiseCanvas();\n\n      if (!noiseFrame) {\n        noiseFrame = requestAnimationFrame(drawNoise);\n      }\n    });\n    aanimGallery.addEventListener('pointermove', disturbNoise);\n  }\n}\n\nconst aboutPage = document.querySelector('.about-page');\nconst aboutTitle = aboutPage?.querySelector('.interactive-title');\n\nif (aboutPage && aboutTitle) {\n  const syncAboutCopyWidth = () => {\n    aboutPage.style.setProperty(\n      '--about-title-width',\n      `${Math.ceil(aboutTitle.getBoundingClientRect().width)}px`\n    );\n  };\n\n  syncAboutCopyWidth();\n  window.addEventListener('resize', syncAboutCopyWidth);\n  document.fonts?.ready.then(syncAboutCopyWidth);\n}\n\ndocument.querySelectorAll('.member-credit-line').forEach(creditLine => {\n  const portrait = creditLine.closest('.band-portrait');\n\n  if (!portrait) {\n    return;\n  }\n\n  const bandImage = portrait.querySelector('.band-photo-frame .band-image');\n  const originalPhoto = bandImage?.getAttribute('src') || '';\n  const originalAlt = bandImage?.getAttribute('alt') || '';\n\n  const resetPhoto = () => {\n    if (!bandImage || !originalPhoto) {\n      return;\n    }\n\n    bandImage.setAttribute('src', originalPhoto);\n    bandImage.setAttribute('alt', originalAlt);\n  };\n\n  const showCredit = event => {\n    const hotspot = event.target instanceof Element\n      ? event.target.closest('.member-hotspot')\n      : null;\n\n    if (hotspot?.dataset.credit) {\n      creditLine.textContent = hotspot.dataset.credit;\n    }\n\n    if (!bandImage) {\n      return;\n    }\n\n    if (hotspot?.dataset.photo) {\n      bandImage.setAttribute('src', hotspot.dataset.photo);\n      bandImage.setAttribute('alt', hotspot.getAttribute('aria-label') || originalAlt);\n    } else {\n      resetPhoto();\n    }\n  };\n\n  const clearCredit = event => {\n    if (!event.relatedTarget || !portrait.contains(event.relatedTarget)) {\n      creditLine.textContent = '';\n      resetPhoto();\n    }\n  };\n\n  portrait.addEventListener('pointerover', showCredit);\n  portrait.addEventListener('focusin', showCredit);\n  portrait.addEventListener('pointerleave', clearCredit);\n  portrait.addEventListener('focusout', clearCredit);\n});\n\nconst mainNav = document.querySelector('.main-nav');\nconst navigationEntry = performance.getEntriesByType?.('navigation')[0];\nconst isPageReload = navigationEntry\n  ? navigationEntry.type === 'reload'\n  : performance.navigation?.type === 1;\n\nif (isPageReload) {\n  if (window.location.hash) {\n    history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);\n  }\n\n  if ('scrollRestoration' in history) {\n    history.scrollRestoration = 'manual';\n  }\n\n  const returnToPageTop = () => {\n    window.scrollTo(0, 0);\n    requestAnimationFrame(() => window.scrollTo(0, 0));\n  };\n\n  returnToPageTop();\n  window.addEventListener('pageshow', returnToPageTop, { once: true });\n}\n\nconst aboutNavLink = document.querySelector('.main-nav a[href=\"about.html\"]');\nconst musicNavLink = document.querySelector('.main-nav a[href=\"music.html\"]');\n\nfunction markAboutReturn() {\n  if (!aboutNavLink) {\n    return;\n  }\n\n  try {\n    if (sessionStorage.getItem('returning-from-about') === 'true') {\n      aboutNavLink.classList.add('about-returned');\n      sessionStorage.removeItem('returning-from-about');\n    }\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n}\n\nif (document.body.classList.contains('about-page')) {\n  try {\n    sessionStorage.setItem('returning-from-about', 'true');\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n} else {\n  markAboutReturn();\n  window.addEventListener('pageshow', markAboutReturn);\n}\n\nfunction markMusicReturn() {\n  if (!musicNavLink) {\n    return;\n  }\n\n  try {\n    if (sessionStorage.getItem('returning-from-music') === 'true') {\n      musicNavLink.classList.add('music-returned');\n      sessionStorage.removeItem('returning-from-music');\n    }\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n}\n\nif (document.body.classList.contains('music-page')) {\n  try {\n    sessionStorage.setItem('returning-from-music', 'true');\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n} else {\n  markMusicReturn();\n  window.addEventListener('pageshow', markMusicReturn);\n}\n\nconst micToggle = document.querySelector('.mic-toggle');\n\nif (micToggle) {\n  const micMeter = document.querySelector('.mic-meter');\n  const micWave = document.querySelector('.mic-wave');\n  const micWaveContext = micWave.getContext('2d');\n  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');\n\n  let audioContext;\n  let microphoneStream;\n  let microphoneAnimation;\n  let microphoneActive = false;\n  let displayedLevel = 0;\n  let displayedBrightness = 0.2;\n  let texturePhase = 0;\n  let lastVisualUpdate = 0;\n  const recordingHistory = [];\n\n  function clamp(value, minimum, maximum) {\n    return Math.min(Math.max(value, minimum), maximum);\n  }\n\n  function calculateBrightness(frequencyData) {\n    let magnitudeTotal = 0;\n    let weightedFrequency = 0;\n    const nyquist = audioContext.sampleRate / 2;\n\n    for (let index = 1; index \u003c frequencyData.length; index++) {\n      const magnitude = frequencyData[index];\n      const frequency = index / frequencyData.length * nyquist;\n      magnitudeTotal += magnitude;\n      weightedFrequency += frequency * magnitude;\n    }\n\n    if (magnitudeTotal === 0) {\n      return 0.15;\n    }\n\n    const centroid = weightedFrequency / magnitudeTotal;\n    return clamp((centroid - 250) / 3200, 0, 1);\n  }\n\n  function calculateSampleTexture(samples) {\n    const quarter = Math.floor(samples.length / 4);\n    const texture = (\n      samples[quarter] -\n      samples[quarter * 2] +\n      samples[quarter * 3]\n    ) * 1.5;\n\n    return clamp(texture, -1, 1);\n  }\n\n  function drawWaveSide(direction, center, height, spacing) {\n    if (recordingHistory.length === 0) {\n      return;\n    }\n\n    const points = recordingHistory.map((entry, index) => ({\n      x: index * spacing,\n      y: center + direction * entry.level * height * 0.43\n    }));\n\n    micWaveContext.beginPath();\n    micWaveContext.moveTo(points[0].x, points[0].y);\n\n    for (let index = 1; index \u003c points.length; index++) {\n      const previous = points[index - 1];\n      const current = points[index];\n      const midpointX = (previous.x + current.x) / 2;\n      const midpointY = (previous.y + current.y) / 2;\n      micWaveContext.quadraticCurveTo(previous.x, previous.y, midpointX, midpointY);\n    }\n\n    const finalPoint = points[points.length - 1];\n    micWaveContext.lineTo(finalPoint.x, finalPoint.y);\n    micWaveContext.stroke();\n  }\n\n  function drawRecordingLine() {\n    const width = micWave.clientWidth;\n    const height = micWave.clientHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    const canvasWidth = Math.round(width * pixelRatio);\n    const canvasHeight = Math.round(height * pixelRatio);\n\n    if (width === 0 || height === 0) {\n      return;\n    }\n\n    if (micWave.width !== canvasWidth || micWave.height !== canvasHeight) {\n      micWave.width = canvasWidth;\n      micWave.height = canvasHeight;\n    }\n\n    const spacing = reducedMotion.matches ? 8 : 4;\n    const maximumPoints = Math.ceil(width / spacing) + 1;\n\n    while (recordingHistory.length > maximumPoints) {\n      recordingHistory.shift();\n    }\n\n    micWaveContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    micWaveContext.clearRect(0, 0, width, height);\n    micWaveContext.lineWidth = 1.35;\n    micWaveContext.lineCap = 'round';\n    micWaveContext.lineJoin = 'round';\n    micWaveContext.strokeStyle = '#111111';\n\n    const center = height / 2;\n    drawWaveSide(-1, center, height, spacing);\n    drawWaveSide(1, center, height, spacing);\n\n    if (microphoneActive && recordingHistory.length > 0) {\n      const newestIndex = recordingHistory.length - 1;\n      const newestLevel = recordingHistory[newestIndex].level;\n      const newestX = newestIndex * spacing;\n      const upperY = center - newestLevel * height * 0.43;\n      const lowerY = center + newestLevel * height * 0.43;\n\n      micWaveContext.beginPath();\n      micWaveContext.moveTo(newestX, upperY);\n      micWaveContext.lineTo(newestX, lowerY);\n      micWaveContext.stroke();\n    }\n  }\n\n  function updateMicrophone(analyser, samples, frequencyData, timestamp) {\n    analyser.getFloatTimeDomainData(samples);\n    analyser.getByteFrequencyData(frequencyData);\n\n    let sum = 0;\n    for (const sample of samples) {\n      sum += sample * sample;\n    }\n\n    const rms = Math.sqrt(sum / samples.length);\n    const targetLevel = Math.min(1, Math.max(0, rms - 0.005) * 17);\n    const targetBrightness = rms > 0.01\n      ? calculateBrightness(frequencyData)\n      : 0.15;\n    const levelResponse = targetLevel > displayedLevel ? 0.13 : 0.04;\n\n    displayedLevel += (targetLevel - displayedLevel) * levelResponse;\n    displayedBrightness += (targetBrightness - displayedBrightness) * 0.04;\n    micMeter.setAttribute('aria-valuenow', String(Math.round(displayedLevel * 100)));\n\n    const visualInterval = reducedMotion.matches ? 180 : 40;\n    if (timestamp - lastVisualUpdate >= visualInterval) {\n      const sampleTexture = calculateSampleTexture(samples);\n      texturePhase += reducedMotion.matches\n        ? 0.06\n        : 0.12 + displayedBrightness * 0.16;\n      const frequencyTexture = Math.sin(texturePhase) * (\n        0.01 + displayedBrightness * 0.02\n      );\n      const organicTexture = sampleTexture * 0.02;\n      const texturedLevel = clamp(\n        displayedLevel * (1 + frequencyTexture + organicTexture),\n        0,\n        1\n      );\n\n      recordingHistory.push({ level: texturedLevel });\n      drawRecordingLine();\n      lastVisualUpdate = timestamp;\n    }\n\n    microphoneAnimation = requestAnimationFrame(nextTimestamp => {\n      updateMicrophone(analyser, samples, frequencyData, nextTimestamp);\n    });\n  }\n\n  async function startMicrophone() {\n    if (!navigator.mediaDevices?.getUserMedia) {\n      micToggle.textContent = 'MIC UNAVAILABLE';\n      return;\n    }\n\n    micToggle.disabled = true;\n\n    try {\n      microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n\n      if (!AudioContextClass) {\n        throw new Error('Web Audio is unavailable');\n      }\n\n      audioContext = new AudioContextClass();\n      await audioContext.resume();\n\n      const source = audioContext.createMediaStreamSource(microphoneStream);\n      const analyser = audioContext.createAnalyser();\n\n      analyser.fftSize = 2048;\n      analyser.smoothingTimeConstant = 0.88;\n      const samples = new Float32Array(analyser.fftSize);\n      const frequencyData = new Uint8Array(analyser.frequencyBinCount);\n      source.connect(analyser);\n\n      microphoneActive = true;\n      lastVisualUpdate = 0;\n      micToggle.textContent = 'SOUND OFF';\n      microphoneAnimation = requestAnimationFrame(timestamp => {\n        updateMicrophone(analyser, samples, frequencyData, timestamp);\n      });\n    } catch (error) {\n      microphoneStream?.getTracks().forEach(track => track.stop());\n      microphoneStream = undefined;\n      await audioContext?.close().catch(() => {});\n      audioContext = undefined;\n      microphoneActive = false;\n      micToggle.textContent = 'MIC DENIED';\n    } finally {\n      micToggle.disabled = false;\n    }\n  }\n\n  async function stopMicrophone() {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n    await audioContext?.close().catch(() => {});\n\n    microphoneStream = undefined;\n    audioContext = undefined;\n    microphoneActive = false;\n    displayedLevel = 0;\n    micMeter.setAttribute('aria-valuenow', '0');\n    micToggle.textContent = 'SOUND ON';\n    drawRecordingLine();\n  }\n\n  micToggle.addEventListener('click', () => {\n    if (microphoneActive) {\n      stopMicrophone();\n    } else {\n      startMicrophone();\n    }\n  });\n\n  window.addEventListener('keydown', event => {\n    const target = event.target;\n    const isEditable = target instanceof HTMLElement && (\n      target.isContentEditable ||\n      target.tagName === 'INPUT' ||\n      target.tagName === 'TEXTAREA' ||\n      target.tagName === 'SELECT'\n    );\n\n    if (event.code !== 'Space' || event.repeat || isEditable) {\n      return;\n    }\n\n    event.preventDefault();\n    if (!micToggle.disabled) {\n      micToggle.click();\n    }\n  });\n\n  window.addEventListener('resize', drawRecordingLine);\n  window.addEventListener('pagehide', () => {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n  });\n}\n\nconst drawingCanvas = document.querySelector('.about-drawing');\n\nconst musicCopy = document.querySelector('.music-page .subpage-copy');\n\nif (musicCopy) {\n  musicCopy.querySelectorAll('p').forEach(paragraph => {\n    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n    const textNodes = [];\n\n    while (walker.nextNode()) {\n      if (!walker.currentNode.parentElement.closest('.album-title, .band-link')) {\n        textNodes.push(walker.currentNode);\n      }\n    }\n\n    textNodes.forEach(textNode => {\n      const fragment = document.createDocumentFragment();\n      const parts = textNode.textContent.split(/(\\s+)/);\n\n      parts.forEach(part => {\n        if (!part || /^\\s+$/.test(part)) {\n          fragment.appendChild(document.createTextNode(part));\n          return;\n        }\n\n        const word = document.createElement('span');\n        word.className = 'music-word';\n        word.textContent = part;\n        fragment.appendChild(word);\n      });\n\n      textNode.replaceWith(fragment);\n    });\n  });\n\n  const discoverAlbum = event => {\n    if (\n      event.target instanceof Element &&\n      event.target.matches('.album-title, .band-link')\n    ) {\n      event.target.classList.add('is-discovered');\n    }\n  };\n\n  musicCopy.addEventListener('pointerover', discoverAlbum);\n  musicCopy.addEventListener('focusin', discoverAlbum);\n}\n\nif (drawingCanvas) {\n  const aboutCopyElement = document.querySelector('.about-copy');\n\n  function wrapAboutCopyWords() {\n    aboutCopyElement.querySelectorAll('p').forEach(paragraph => {\n      const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n      const textNodes = [];\n\n      while (walker.nextNode()) {\n        if (!walker.currentNode.parentElement.closest('.keyword, .future-link, .about-word')) {\n          textNodes.push(walker.currentNode);\n        }\n      }\n\n      textNodes.forEach(textNode => {\n        const fragment = document.createDocumentFragment();\n        const parts = textNode.textContent.split(/(\\s+)/);\n\n        parts.forEach(part => {\n          if (!part || /^\\s+$/.test(part)) {\n            fragment.appendChild(document.createTextNode(part));\n            return;\n          }\n\n          const word = document.createElement('span');\n          word.className = 'about-word';\n          word.textContent = part;\n          fragment.appendChild(word);\n        });\n\n        textNode.replaceWith(fragment);\n      });\n    });\n  }\n\n  wrapAboutCopyWords();\n\n  document.querySelector('.about-copy').addEventListener('pointerover', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  document.querySelector('.about-copy').addEventListener('focusin', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  const aboutMeTrigger = document.querySelector('.about-me-trigger');\n  const funfactsSection = document.querySelector('.funfacts-section');\n  const funfactsSlide = document.querySelector('.funfacts-slide');\n  const funfactsCounter = document.querySelector('.funfacts-counter');\n  const funfactsNext = document.querySelector('.funfacts-next');\n  const funfacts = [\n    'I see very badly without glasses.',\n    'I have ADHD.',\n    'I hate caramel.',\n    'I love Lakritze.',\n    'My favourite animal is a frog.',\n    'I have a cat.',\n    'I am obsessed with insects.',\n    'I like horror movies and games.',\n    'I can spell fast backwards.',\n    'I am only 152 cm tall.',\n    'I love mathematics and numbers.',\n    'I do not like loud noises and too many people.'\n  ];\n  let funfactIndex = 0;\n\n  if (aboutMeTrigger && funfactsSection) {\n    const renderFunfact = () => {\n      funfactsSlide.textContent = funfacts[funfactIndex];\n      funfactsCounter.textContent = `${funfactIndex + 1}/${funfacts.length}`;\n    };\n\n    renderFunfact();\n\n    aboutMeTrigger.addEventListener('click', () => {\n      const shouldReveal = funfactsSection.hidden;\n\n      if (shouldReveal) {\n        funfactsSection.hidden = false;\n        requestAnimationFrame(() => {\n          funfactsSection.classList.add('is-visible');\n          window.dispatchEvent(new CustomEvent('aboutcopychange'));\n        });\n      }\n\n      aboutMeTrigger.classList.add('is-discovered');\n      aboutMeTrigger.setAttribute('aria-expanded', 'true');\n    });\n\n    funfactsNext?.addEventListener('click', () => {\n      if (funfactIndex === funfacts.length - 1) {\n        funfactsSection.classList.remove('is-visible');\n        aboutMeTrigger.classList.remove('is-discovered');\n        aboutMeTrigger.setAttribute('aria-expanded', 'false');\n\n        window.setTimeout(() => {\n          funfactsSection.hidden = true;\n          funfactIndex = 0;\n          renderFunfact();\n          window.dispatchEvent(new CustomEvent('aboutcopychange'));\n          window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });\n        }, 220);\n        return;\n      }\n\n      funfactIndex += 1;\n      funfactsSlide.classList.add('is-changing');\n\n      window.setTimeout(() => {\n        renderFunfact();\n        funfactsSlide.classList.remove('is-changing');\n      }, 100);\n    });\n  }\n\n  const drawingContext = drawingCanvas.getContext('2d');\n  const drawingClear = document.querySelector('.drawing-clear');\n  const aboutPage = document.querySelector('.about-page');\n  const aboutContent = document.querySelector('.subpage');\n  const aboutCopy = document.querySelector('.about-copy');\n  const strokes = [];\n\n  let activePointer = null;\n  let activeStroke = null;\n  let pendingStartPoint = null;\n  let strokeStarted = false;\n  let canvasWidth = 0;\n  let canvasHeight = 0;\n  let resizeFrame;\n\n  function syncDrawingClear() {\n    const hasDrawing = strokes.some(stroke => stroke.length > 1);\n    drawingClear.disabled = !hasDrawing;\n    drawingClear.hidden = !hasDrawing;\n  }\n\n  function configureDrawingContext() {\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    drawingContext.lineWidth = 5;\n    drawingContext.lineCap = 'round';\n    drawingContext.lineJoin = 'round';\n    drawingContext.strokeStyle = getComputedStyle(aboutPage)\n      .getPropertyValue('--about-accent').trim() || '#ff34b3';\n  }\n\n  function renderDrawing() {\n    drawingContext.setTransform(1, 0, 0, 1, 0, 0);\n    drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);\n    configureDrawingContext();\n\n    strokes.forEach(stroke => {\n      if (stroke.length === 0) {\n        return;\n      }\n\n      drawingContext.beginPath();\n      drawingContext.moveTo(stroke[0].x, stroke[0].y);\n\n      if (stroke.length === 1) {\n        drawingContext.lineTo(stroke[0].x + 0.01, stroke[0].y + 0.01);\n      } else {\n        stroke.slice(1).forEach(point => {\n          drawingContext.lineTo(point.x, point.y);\n        });\n      }\n\n      drawingContext.stroke();\n    });\n  }\n\n  function resetDrawing() {\n    strokes.length = 0;\n    activePointer = null;\n    activeStroke = null;\n    pendingStartPoint = null;\n    strokeStarted = false;\n    aboutPage.classList.remove('is-drawing');\n    drawingContext.setTransform(1, 0, 0, 1, 0, 0);\n    drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);\n    syncDrawingClear();\n  }\n\n  function createIntroDrawing() {\n    resetDrawing();\n\n    const stroke = [];\n    const segmentCount = 6 + Math.floor(Math.random() * 4);\n    const margin = Math.min(canvasWidth, canvasHeight) * 0.08;\n    const copyRect = aboutCopy?.getBoundingClientRect();\n    const funfactsRect = funfactsSection && !funfactsSection.hidden\n      ? funfactsSection.getBoundingClientRect()\n      : null;\n    const forbiddenAreas = [copyRect, funfactsRect].filter(Boolean).map(rect => ({\n      left: rect.left + window.scrollX - 34,\n      top: rect.top + window.scrollY - 30,\n      right: rect.right + window.scrollX + 34,\n      bottom: rect.bottom + window.scrollY + 30\n    }));\n\n    function clampPoint(point) {\n      return {\n        x: Math.min(canvasWidth - margin, Math.max(margin, point.x)),\n        y: Math.min(canvasHeight - margin, Math.max(margin, point.y))\n      };\n    }\n\n    function avoidsText(point) {\n      return !forbiddenAreas.some(area => (\n        point.x >= area.left &&\n        point.x \u003c= area.right &&\n        point.y >= area.top &&\n        point.y \u003c= area.bottom\n      ));\n    }\n\n    function moveAwayFromText(point) {\n      const nextPoint = clampPoint(point);\n\n      if (avoidsText(nextPoint)) {\n        return nextPoint;\n      }\n\n      const activeArea = forbiddenAreas.find(area => (\n        nextPoint.x >= area.left &&\n        nextPoint.x \u003c= area.right &&\n        nextPoint.y >= area.top &&\n        nextPoint.y \u003c= area.bottom\n      ));\n\n      if (!activeArea) {\n        return nextPoint;\n      }\n\n      const exits = [\n        { x: activeArea.left - margin * 0.45, y: nextPoint.y },\n        { x: activeArea.right + margin * 0.45, y: nextPoint.y },\n        { x: nextPoint.x, y: activeArea.top - margin * 0.45 },\n        { x: nextPoint.x, y: activeArea.bottom + margin * 0.45 }\n      ].map(clampPoint).filter(avoidsText);\n\n      return exits.reduce((closest, candidate) => {\n        const closestDistance = Math.hypot(closest.x - nextPoint.x, closest.y - nextPoint.y);\n        const candidateDistance = Math.hypot(candidate.x - nextPoint.x, candidate.y - nextPoint.y);\n        return candidateDistance \u003c closestDistance ? candidate : closest;\n      }, exits[0] || nextPoint);\n    }\n\n    function randomPoint() {\n      let point = { x: margin, y: margin };\n\n      for (let attempt = 0; attempt \u003c 16; attempt++) {\n        point = {\n          x: margin + Math.random() * Math.max(1, canvasWidth - margin * 2),\n          y: margin + Math.random() * Math.max(1, canvasHeight - margin * 2)\n        };\n\n        if (avoidsText(point)) {\n          return clampPoint(point);\n        }\n      }\n\n      return moveAwayFromText(point);\n    }\n\n    function sideOfText(point) {\n      if (forbiddenAreas.length === 0) {\n        return 'free';\n      }\n\n      const nearestArea = forbiddenAreas.reduce((nearest, area) => {\n        const nearestDx = Math.max(nearest.left - point.x, 0, point.x - nearest.right);\n        const nearestDy = Math.max(nearest.top - point.y, 0, point.y - nearest.bottom);\n        const areaDx = Math.max(area.left - point.x, 0, point.x - area.right);\n        const areaDy = Math.max(area.top - point.y, 0, point.y - area.bottom);\n        return Math.hypot(areaDx, areaDy) \u003c Math.hypot(nearestDx, nearestDy)\n          ? area\n          : nearest;\n      }, forbiddenAreas[0]);\n\n      const distances = [\n        { side: 'left', value: Math.abs(point.x - nearestArea.left) },\n        { side: 'right', value: Math.abs(point.x - nearestArea.right) },\n        { side: 'top', value: Math.abs(point.y - nearestArea.top) },\n        { side: 'bottom', value: Math.abs(point.y - nearestArea.bottom) }\n      ];\n\n      if (point.x \u003c nearestArea.left) {\n        return 'left';\n      }\n\n      if (point.x > nearestArea.right) {\n        return 'right';\n      }\n\n      if (point.y \u003c nearestArea.top) {\n        return 'top';\n      }\n\n      if (point.y > nearestArea.bottom) {\n        return 'bottom';\n      }\n\n      return distances.sort((a, b) => a.value - b.value)[0].side;\n    }\n\n    function randomPointNear(point) {\n      const side = sideOfText(point);\n\n      for (let attempt = 0; attempt \u003c 14; attempt++) {\n        const candidate = randomPoint();\n\n        if (sideOfText(candidate) === side || Math.random() > 0.48) {\n          return candidate;\n        }\n      }\n\n      return randomPoint();\n    }\n\n    let { x, y } = randomPoint();\n\n    stroke.push({ x, y });\n\n    for (let segment = 0; segment \u003c segmentCount; segment++) {\n      const segmentType = Math.random();\n      const pointsInSegment = 7 + Math.floor(Math.random() * 8);\n      const target = randomPointNear({ x, y });\n      const targetX = target.x;\n      const targetY = target.y;\n      const loopRadius = 24 + Math.random() * 58;\n      const zigzagSize = 18 + Math.random() * 44;\n      const loopTurns = 1 + Math.random() * 1.5;\n\n      for (let index = 1; index \u003c= pointsInSegment; index++) {\n        const progress = index / pointsInSegment;\n        const baseX = x + (targetX - x) * progress;\n        const baseY = y + (targetY - y) * progress;\n        let offsetX = 0;\n        let offsetY = 0;\n\n        if (segmentType \u003c 0.38) {\n          const angle = progress * Math.PI * 2 * loopTurns;\n          offsetX = Math.cos(angle) * loopRadius * Math.sin(progress * Math.PI);\n          offsetY = Math.sin(angle) * loopRadius * Math.sin(progress * Math.PI);\n        } else if (segmentType \u003c 0.72) {\n          const zigzag = index % 2 === 0 ? 1 : -1;\n          const angle = Math.atan2(targetY - y, targetX - x) + Math.PI / 2;\n          offsetX = Math.cos(angle) * zigzagSize * zigzag;\n          offsetY = Math.sin(angle) * zigzagSize * zigzag;\n        } else {\n          offsetX = Math.sin(progress * Math.PI * 3) * zigzagSize;\n          offsetY = Math.cos(progress * Math.PI * 2.4) * loopRadius * 0.5;\n        }\n\n        stroke.push(moveAwayFromText({\n          x: baseX + offsetX,\n          y: baseY + offsetY\n        }));\n      }\n\n      x = targetX;\n      y = targetY;\n    }\n\n    strokes.push(stroke);\n    renderDrawing();\n    syncDrawingClear();\n  }\n\n  function resizeDrawingCanvas() {\n    const nextWidth = Math.max(document.documentElement.scrollWidth, window.innerWidth);\n    const nextHeight = Math.max(document.documentElement.scrollHeight, window.innerHeight);\n\n    if (nextWidth === canvasWidth && nextHeight === canvasHeight) {\n      return;\n    }\n\n    if (canvasWidth && canvasHeight) {\n      const scaleX = nextWidth / canvasWidth;\n      const scaleY = nextHeight / canvasHeight;\n\n      strokes.forEach(stroke => {\n        stroke.forEach(point => {\n          point.x *= scaleX;\n          point.y *= scaleY;\n        });\n      });\n    }\n\n    canvasWidth = nextWidth;\n    canvasHeight = nextHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingCanvas.width = Math.round(canvasWidth * pixelRatio);\n    drawingCanvas.height = Math.round(canvasHeight * pixelRatio);\n    drawingCanvas.style.width = `${canvasWidth}px`;\n    drawingCanvas.style.height = `${canvasHeight}px`;\n    renderDrawing();\n  }\n\n  function scheduleCanvasResize() {\n    cancelAnimationFrame(resizeFrame);\n    resizeFrame = requestAnimationFrame(resizeDrawingCanvas);\n  }\n\n  function isControl(target) {\n    return target instanceof Element && Boolean(target.closest(\n      'a, button, input, textarea, select, [contenteditable=\"true\"]'\n    ));\n  }\n\n  function addDrawingPoint(event) {\n    const events = event.getCoalescedEvents?.() || [event];\n\n    events.forEach(pointerEvent => {\n      activeStroke.push({ x: pointerEvent.pageX, y: pointerEvent.pageY });\n    });\n\n    renderDrawing();\n    syncDrawingClear();\n  }\n\n  function finishStroke(event) {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    if (activeStroke && activeStroke.length \u003c 2) {\n      strokes.pop();\n    }\n\n    activePointer = null;\n    activeStroke = null;\n    pendingStartPoint = null;\n    strokeStarted = false;\n    aboutPage.classList.remove('is-drawing');\n    syncDrawingClear();\n    renderDrawing();\n  }\n\n  drawingClear.addEventListener('click', () => {\n    resetDrawing();\n  });\n\n  document.addEventListener('pointerdown', event => {\n    if (activePointer !== null || isControl(event.target)) {\n      return;\n    }\n\n    if (event.pointerType === 'mouse' && event.button !== 0) {\n      return;\n    }\n\n    event.preventDefault();\n    activePointer = event.pointerId;\n    activeStroke = [];\n    pendingStartPoint = { x: event.pageX, y: event.pageY };\n    strokeStarted = false;\n    strokes.push(activeStroke);\n  }, { capture: true });\n\n  document.addEventListener('pointermove', event => {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    if (event.pointerType === 'mouse' && (event.buttons & 1) !== 1) {\n      finishStroke(event);\n      return;\n    }\n\n    event.preventDefault();\n    aboutPage.classList.add('is-drawing');\n\n    if (!strokeStarted) {\n      activeStroke.push(pendingStartPoint);\n      strokeStarted = true;\n    }\n\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointerup', finishStroke, { capture: true });\n  document.addEventListener('pointercancel', finishStroke, { capture: true });\n  window.addEventListener('resize', scheduleCanvasResize);\n  window.addEventListener('aboutcopychange', () => {\n    resizeDrawingCanvas();\n    createIntroDrawing();\n  });\n  window.addEventListener('pageshow', event => {\n    if (event.persisted) {\n      createIntroDrawing();\n    }\n  });\n\n  if ('ResizeObserver' in window && aboutContent) {\n    new ResizeObserver(scheduleCanvasResize).observe(aboutContent);\n  }\n\n  document.fonts?.ready.then(scheduleCanvasResize);\n  resizeDrawingCanvas();\n  createIntroDrawing();\n}\n","explanation":"I realised I did not like the previous photos that much, or the circular effect. I wanted the band members to stand out more clearly, so I prepared individual portraits and chose a different group photo. Codex also ignored Julia’s stick figure, so I added it myself."},{"id":"059","sourceId":"106","focus":"","prompt":null,"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"de\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Bands &amp; Live &mdash; Nicoline Andrea\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody class=\"music-page\">\n  \u003cmain class=\"subpage\">\n    \u003ch1 class=\"interactive-title\">AANIM\u003c/h1>\n\n    \u003csection class=\"aanim-section\">\n      \u003cdiv class=\"aanim-side-label\" aria-hidden=\"true\">\n        \u003cspan>AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"band-gallery music-media\">\n        \u003cdiv class=\"band-feature\">\n          \u003cdiv class=\"band-portrait\">\n            \u003cdiv class=\"band-photo-frame\">\n              \u003cimg class=\"band-image\" src=\"../../shared/assets/images/music/aanim-band-live.jpg\" alt=\"AANIM band photograph\">\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"band-portrait\">\n          \u003cdiv class=\"member-credit-line\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\n          \u003cdiv class=\"band-photo-frame\">\n            \u003cimg class=\"band-image\" src=\"../../shared/assets/images/music/aanim-band-blue.jpg\" alt=\"AANIM band photograph\">\n            \u003cbutton class=\"member-hotspot nicoline\" type=\"button\" data-credit=\"Nicoline Andrea Janka: vocals &amp; synth\" data-photo=\"../../shared/assets/images/music/aanim-member-nicoline.jpg\" aria-label=\"Nicoline Andrea Janka: vocals and synth\">\u003c/button>\n            \u003cbutton class=\"member-hotspot nils\" type=\"button\" data-credit=\"Nils Stricker: drums &amp; backing vocals\" data-photo=\"../../shared/assets/images/music/aanim-member-nils.jpg\" aria-label=\"Nils Stricker: drums and backing vocals\">\u003c/button>\n            \u003cbutton class=\"member-hotspot lucas\" type=\"button\" data-credit=\"Lucas Sevilla: guitar\" data-photo=\"../../shared/assets/images/music/aanim-member-lucas.jpg\" aria-label=\"Lucas Sevilla: guitar\">\u003c/button>\n            \u003cbutton class=\"member-hotspot nuria\" type=\"button\" data-credit=\"Nuria Kr&auml;uchi: bass\" data-photo=\"../../shared/assets/images/music/aanim-member-nuria.jpg\" aria-label=\"Nuria Kr&auml;uchi: bass\">\u003c/button>\n            \u003cbutton class=\"member-hotspot julia\" type=\"button\" data-credit=\"Julia S&uuml;ess: guitar &amp; backing vocals\" data-photo=\"../../shared/assets/images/music/aanim-member-julia.jpg\" aria-label=\"Julia S&uuml;ess: guitar and backing vocals\">\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"subpage-copy\">\n        \u003cp>\u003ca class=\"band-link\" href=\"https://www.aanim.net/\" target=\"_blank\" rel=\"noopener noreferrer\">AANIM\u003c/a> is a five-piece band mainly active around Bern and Lucerne. We have released two albums, \u003ccite class=\"album-group\">\u003ca class=\"album-title\" href=\"https://www.youtube.com/watch?v=NfXw7TAZ9So&amp;list=PLRzOEHudKts8Yos7VX5m1hdJrkdIYfACM\" target=\"_blank\" rel=\"noopener noreferrer\">Contemplation\u003c/a> / \u003ca class=\"album-title\" href=\"https://www.youtube.com/playlist?list=PLRzOEHudKts9ik3KUaXOOckEsWUtVcOpG\" target=\"_blank\" rel=\"noopener noreferrer\">Remedy\u003c/a>\u003c/cite> and \u003ccite>\u003ca class=\"album-title\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\">Fuormas Neras\u003c/a>\u003c/cite>, and played shows at venues such as Sch&uuml;&uuml;r, Mokka, Gaskessel and many more. I sing and play synths in the band. We love cozy shows, small rooms and being close to the audience.\u003c/p>\n      \u003c/div>\n\n      \u003ca class=\"video-link music-media\" href=\"https://www.youtube.com/watch?v=ehqON-5_tG4&amp;t=8s\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Watch AANIM live at Gaskessel on YouTube\">\n        \u003cimg class=\"video-image\" src=\"../../shared/assets/images/music/aanim-live-gaskessel.jpg\" alt=\"AANIM live at Gaskessel\">\n        \u003cspan class=\"video-play\" aria-hidden=\"true\">\u003c/span>\n      \u003c/a>\n\n      \u003cdiv class=\"artwork-gallery music-media\" aria-label=\"Artwork for the AANIM albums\">\n        \u003cdiv class=\"artwork-credit-line artwork-credit-fuormas\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\n        \u003cdiv class=\"artwork-credit-line artwork-credit-remedy\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/ csection class=\"kima-section\">\n      \u003ch2 class=\"interactive-title band-section-title\">Kim.a\u003c/h2>\n\n      \u003cdiv class=\"subpage-copy\">\n        \u003cp>Like the depths of the ocean, the calm before a storm, waking after a nightmare or a butterfly in the rain, Kim.a is cold, direct, beautiful and tearing. Every part of the music is created by Nicoline Andrea Janka: she writes and composes all songs and produces them in REAPER and Ableton Live. On stage, she performs with a live drummer.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"kima-video-grid music-media\" aria-label=\"Kim.a live sessions at Neubad\">\n        \u003ca class=\"video-link\" href=\"https://www.youtube.com/watch?v=racv1u98r34\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Watch Kim.a - Emblidar, live at Neubad on YouTube\">\n          \u003cimg class=\"video-image\" src=\"https://i.ytimg.com/vi/racv1u98r34/maxresdefault.jpg\" alt=\"Kim.a performing Emblidar live at Neubad\" width=\"1280\" height=\"720\" loading=\"lazy\" decoding=\"async\">\n          \u003cspan class=\"video-play\" aria-hidden=\"true\">\u003c/span>\n        \u003c/a>\n        \u003ca class=\"video-link\" href=\"https://www.youtube.com/watch?v=oGeETkS3Yj0\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Watch Kim.a - Ocean, live at Neubad on YouTube\">\n          \u003cimg class=\"video-image\" src=\"https://i.ytimg.com/vi/oGeETkS3Yj0/maxresdefault.jpg\" alt=\"Kim.a performing Ocean live at Neubad\" width=\"1280\" height=\"720\" loading=\"lazy\" decoding=\"async\">\n          \u003cspan class=\"video-play\" aria-hidden=\"true\">\u003c/span>\n        \u003c/a>\n      \u003c/div>\n\n      \u003ca class=\"press-kit-link\" href=\"https://drive.google.com/drive/folders/11QbIluKnuD9ohsLbi-QIGyuxssIXFV9X\" target=\"_blank\" rel=\"noopener noreferrer\">PRESS KIT KIM.A\u003c/a>\n    \u003c/section>\n    \u003ca class=\"subpage-back\" href=\"../../index.html\" target=\"_top\" aria-label=\"Zur&uuml;ck zu den Themen\">&larr;\u003c/a>\n  \u003c/main>\n\n  \n\n  \u003cscript src=\"script.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","styles":"* {\n  box-sizing: border-box;\n}\n\n:root {\n  --site-content-width: min(100%, calc(clamp(46px, 7.1vw, 112px) * 7.38));\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  background: #ffffff;\n  color: #111111;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\n.site-footer {\n  padding: clamp(44px, 6vw, 84px) 28px 28px;\n}\n\n.site-footer-content {\n  width: var(--site-content-width);\n  padding-top: clamp(16px, 2vw, 26px);\n  border-top: 5px solid #111111;\n}\n\n.site-footer p {\n  max-width: 900px;\n  margin: 0;\n  font-size: clamp(11px, 0.9vw, 14px);\n  font-weight: 400;\n  line-height: 1.25;\n}\n\nheader {\n  position: relative;\n  padding: clamp(20px, 2.2vw, 28px);\n}\n\nh1 {\n  width: fit-content;\n  max-width: 100%;\n  margin: 0;\n  font-size: clamp(56px, 10.8vw, 150px);\n  font-weight: 900;\n  line-height: 0.74;\n  letter-spacing: -0.06em;\n}\n\nh1 > .word {\n  display: block;\n  white-space: nowrap;\n}\n\n.letter {\n  display: inline-block;\n  transition: opacity 100ms ease;\n}\n\n.letter:hover {\n  opacity: 0;\n}\n\n.title-word {\n  display: inline-block;\n  white-space: nowrap;\n}\n\n.about-me-trigger {\n  appearance: none;\n  display: inline-block;\n  margin: 0;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: inherit;\n  font: inherit;\n  line-height: inherit;\n  letter-spacing: inherit;\n  text-align: inherit;\n  vertical-align: baseline;\n  cursor: pointer;\n  transition: color 100ms ease;\n}\n\n.about-me-trigger:hover,\n.about-me-trigger:focus-visible,\n.about-me-trigger.is-discovered {\n  color: var(--about-accent);\n}\n\n.about-me-trigger .letter:hover {\n  opacity: 1;\n}\n\n.about-me-trigger:focus-visible {\n  outline: 0;\n}\n\n.mic-control {\n  width: 100%;\n  margin-top: clamp(22px, 2.5vw, 36px);\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n  gap: 10px;\n}\n\n.mic-toggle {\n  align-self: flex-start;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 1.7vw, 24px);\n  font-weight: 900;\n  cursor: pointer;\n}\n\n.mic-toggle:disabled {\n  cursor: wait;\n  opacity: 0.45;\n}\n\n.mic-meter {\n  position: relative;\n  height: clamp(68px, 7.5vw, 102px);\n  overflow: hidden;\n}\n\n.mic-wave {\n  position: absolute;\n  inset: 0;\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n\n.landing-strip {\n  display: flex;\n  margin-top: clamp(16px, 2vw, 30px);\n  width: var(--site-content-width);\n  background: transparent;\n}\n\n.landing-strip-image {\n  display: block;\n  width: 25%;\n  min-width: 0;\n  aspect-ratio: 2 / 3;\n  height: auto;\n  object-fit: cover;\n  object-position: center;\n}\n\n.landing-strip-image-a:hover {\n  object-position: 64% center;\n  filter: contrast(1.03);\n}\n\n.landing-strip-image-b:hover {\n  filter: contrast(1.03);\n}\n\n.landing-strip-image-c:hover {\n  transform: scaleX(-1);\n}\n\n.main-nav {\n  padding: 28px 28px 40px;\n  display: flex;\n  flex-direction: column;\n  justify-content: flex-start;\n  gap: clamp(12px, 1.65vw, 23px);\n}\n\n.main-nav a {\n  display: block;\n  color: #111111;\n  font-size: clamp(34px, 5vw, 76px);\n  font-weight: 900;\n  line-height: 0.88;\n  letter-spacing: -0.055em;\n  text-decoration: none;\n  transition: opacity 120ms ease;\n}\n\n.main-nav a:hover {\n  opacity: 0;\n}\n\n.main-nav a.about-returned {\n  color: #c38de3;\n}\n\n.main-nav a.music-returned {\n  color: #0000ff;\n}\n\n.main-nav a.audiovisual-returned {\n  color: #e45de3;\n}\n\n.main-nav a.sound-code-returned {\n  color: #ace8e7;\n}\n\n.main-nav a.contact-returned {\n  color: #b8d4d3;\n}\n\n.subpage {\n  flex: 1 0 auto;\n  min-height: 0;\n  padding: 28px 28px clamp(44px, 5vw, 68px);\n}\n\n.subpage-back {\n  position: static;\n  display: block;\n  width: clamp(36px, 3.8vw, 55px);\n  height: clamp(22px, 2.3vw, 34px);\n  margin-top: clamp(18px, 1.7vw, 27px);\n  color: #111111;\n  font-size: 0;\n  text-decoration: none;\n  transition: color 100ms ease;\n}\n\n.subpage-back:hover,\n.subpage-back:focus-visible {\n  color: var(--page-accent, #0000ff);\n}\n\n.subpage-back:focus-visible {\n  outline: 2px solid currentColor;\n  outline-offset: 4px;\n}\n\n.subpage-back::before {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 100%;\n  background: currentColor;\n  clip-path: polygon(\n    0 50%,\n    36% 0,\n    36% 33%,\n    100% 33%,\n    100% 67%,\n    36% 67%,\n    36% 100%\n  );\n}\n\n.subpage h1 {\n  max-width: 1400px;\n  font-size: clamp(46px, 7.1vw, 112px);\n  line-height: 0.82;\n  text-transform: uppercase;\n}\n\n.band-section-title {\n  width: fit-content;\n  max-width: 100%;\n  margin: clamp(44px, 5vw, 68px) 0 0;\n  font-size: clamp(46px, 7.1vw, 112px);\n  font-weight: 900;\n  line-height: 0.82;\n  letter-spacing: -0.06em;\n}\n\n.about-copy,\n.subpage-copy {\n  max-width: 1050px;\n  margin-top: clamp(20px, 2.5vw, 34px);\n  padding-bottom: clamp(150px, 16vw, 220px);\n  font-size: clamp(18px, 1.55vw, 24px);\n  line-height: 1.24;\n}\n\n.about-copy p,\n.subpage-copy p {\n  margin: 0 0 1em;\n  text-align: justify;\n  text-align-last: left;\n  text-justify: inter-word;\n}\n\n.band-gallery {\n  position: relative;\n  display: grid;\n  gap: clamp(16px, 2.1vw, 30px);\n  margin-top: clamp(20px, 2.5vw, 34px);\n  margin-bottom: clamp(24px, 2.5vw, 37px);\n}\n\n.aanim-section {\n  position: relative;\n  isolation: isolate;\n}\n\n.aanim-side-label {\n  position: absolute;\n  top: 0;\n  left: calc(min(100%, 1050px) - clamp(32px, 4.5vw, 74px));\n  z-index: 3;\n  width: clamp(52px, 7.5vw, 118px);\n  height: 100%;\n  overflow: hidden;\n  color: #ffffff;\n  font-size: clamp(52px, 6.5vw, 105px);\n  font-weight: 900;\n  line-height: 0.78;\n  letter-spacing: 0;\n  mix-blend-mode: difference;\n  opacity: 0.78;\n  pointer-events: none;\n  user-select: none;\n}\n\n.aanim-side-label span {\n  positio age .cv-hero h1 {\n    font-size: 52pt;\n  }\n\n  .cv-contact-strip {\n    margin-top: 20px;\n  }\n\n  .cv-section {\n    margin-top: 38px;\n  }\n\n  .cv-section .work-group-title {\n    font-size: 30pt;\n  }\n\n  .cv-current-card,\n  .cv-entry,\n  .cv-final-grid > div {\n    break-inside: avoid;\n  }\n\n  .cv-current-card {\n    min-height: 0;\n    padding: 16px;\n    border-width: 3px;\n  }\n\n  .cv-entry,\n  .cv-entry-list,\n  .cv-contact-strip,\n  .cv-final-grid {\n    border-width: 3px;\n  }\n\n  .cv-current-card h3,\n  .cv-entry-copy h3 {\n    font-size: 14pt;\n  }\n\n  .cv-current-card > p:last-child,\n  .cv-entry-copy p,\n  .cv-contact,\n  .cv-language-list li,\n  .cv-personal-data dl > div {\n    font-size: 9.5pt;\n  }\n\n  .cv-role {\n    font-size: 16pt;\n  }\n}\n\nmain > h1 { display:none !important } .music-page .subpage { --music-title-width:1050px !important } .band-gallery { margin-top:0 } main.subpage > :not(.aanim-section), .aanim-section > :not(.band-gallery), .band-gallery > .band-feature, body.music-page .subpage-back { display:none !important }h1 .letter, h2 .letter { pointer-events:none }","script":"document.querySelectorAll('h1 .word').forEach(word => {\n  const text = word.textContent;\n  word.setAttribute('aria-label', text);\n  word.textContent = '';\n\n  [...text].forEach(character => {\n    const letter = document.createElement('span');\n    letter.className = 'letter';\n    letter.setAttribute('aria-hidden', 'true');\n    letter.textContent = character;\n    word.appendChild(letter);\n  });\n});\n\nconst swappedImagePairs = new Set();\nconst preloadedHoverSources = new Set();\n\ndocument.querySelectorAll('img[data-hover-src], img[data-hover-group], img[data-hover-options], img[data-swap-pair]').forEach(image => {\n  const originalSource = image.getAttribute('src');\n  const fixedHoverSource = image.dataset.hoverSrc;\n  const hoverGroup = image.dataset.hoverGroup;\n  const swapPair = image.dataset.swapPair;\n  const swapPairImages = swap      microphoneStream = undefined;\n      await audioContext?.close().catch(() => {});\n      audioContext = undefined;\n      microphoneActive = false;\n      micToggle.textContent = 'MIC DENIED';\n    } finally {\n      micToggle.disabled = false;\n    }\n  }\n\n  async function stopMicrophone() {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n    await audioContext?.close().catch(() => {});\n\n    microphoneStream = undefined;\n    audioContext = undefined;\n    microphoneActive = false;\n    displayedLevel = 0;\n    micMeter.setAttribute('aria-valuenow', '0');\n    micToggle.textContent = 'SOUND ON';\n    drawRecordingLine();\n  }\n\n  micToggle.addEventListener('click', () => {\n    if (microphoneActive) {\n      stopMicrophone();\n    } else {\n      startMicrophone();\n    }\n  });\n\n  window.addEventListener('keydown', event => {\n    const target = event.target;\n    const isEditable = target instanceof HTMLElement && (\n      target.isContentEditable ||\n      target.tagName === 'INPUT' ||\n      target.tagName === 'TEXTAREA' ||\n      target.tagName === 'SELECT'\n    );\n\n    if (event.code !== 'Space' || event.repeat || isEditable) {\n      return;\n    }\n\n    event.preventDefault();\n    if (!micToggle.disabled) {\n      micToggle.click();\n    }\n  });\n\n  drawRecordingLine();\n  window.addEventListener('resize', drawRecordingLine);\n  window.addEventListener('pagehide', () => {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n  });\n}\n\nconst drawingCanvas = document.querySelector('.drawing-canvas, .about-drawing');\n\nfunction wrapCopyWords(copy, excludedSelector, wordClass) {\n  if (!copy) {\n    return;\n  }\n\n  copy.querySelectorAll('p').forEach(paragraph => {\n    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n    const textNodes = [];\n\n    while (walker.nextNode()) {\n
