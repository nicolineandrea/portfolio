t: 1.05;\n}\n\n.about-cv .cv-current-card h4 {\n  margin-top: clamp(18px, 2.6vw, 34px);\n}\n\n.about-cv .cv-current-card > p:last-child {\n  margin-top: 8px;\n  font-size: clamp(14px, 1.15vw, 17px);\n  line-height: 1.25;\n}\n\n.about-cv .cv-current-card-study {\n  grid-column: 1 / -1;\n  min-height: 0;\n}\n\n.about-cv-download {\n  margin-top: clamp(20px, 2.8vw, 34px);\n}\n\n.about-cv .cv-entry-copy h4 + p {\n  margin-top: 8px;\n}\n\n.about-cv .cv-entry-copy h4:not(:first-child) {\n  margin-top: 24px;\n}\n\n.about-cv .cv-entry-list {\n  border-bottom-width: 2px;\n}\n\n.about-cv .cv-entry {\n  grid-template-columns: minmax(112px, 0.22fr) minmax(0, 1fr);\n  gap: clamp(18px, 3vw, 42px);\n  padding: clamp(14px, 1.6vw, 22px) 0;\n  border-top-width: 2px;\n}\n\n.about-cv .cv-entry-date {\n  font-size: clamp(13px, 1.05vw, 16px);\n}\n\n.about-cv .cv-entry-copy h4 {\n  font-size: clamp(16px, 1.4vw, 20px);\n  line-height: 1.08;\n}\n\n.about-cv .cv-entry-copy p {\n  margin-top: 4px;\n  font-size: clamp(14px, 1.1vw, 16px);\n}\n\n.about-cv .cv-entry-copy h4:not(:first-child) {\n  margin-top: 14px;\n}\n\n.about-cv-reference {\n  margin: 0;\n  font-size: clamp(14px, 1.1vw, 16px);\n  font-weight: 900;\n}\n\n.about-cv .cv-final-grid {\n  gap: clamp(28px, 5vw, 72px);\n  padding-top: clamp(16px, 2vw, 24px);\n  padding-bottom: clamp(16px, 2vw, 24px);\n  border-top-width: 2px;\n  border-bottom-width: 2px;\n}\n\n.about-cv .cv-language-list li,\n.about-cv .cv-personal-data dl > div {\n  font-size: clamp(13px, 1.05vw, 15px);\n  border-bottom-width: 1px;\n}\n\n.about-cv-infos {\n  margin-top: clamp(52px, 7vw, 90px);\n  padding-top: 14px;\n  border-top: 2px solid #111111;\n}\n\n.about-cv-infos h3 {\n  margin: 0 0 18px;\n  color: var(--page-accent);\n  font-size: clamp(14px, 1.25vw, 18px);\n  font-weight: 900;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n}\n\n.about-cv-infos dl {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  column-gap: clamp(24px, 5vw, 72px);\n  row-gap: 0;\n  margin: 0;\n}\n\n.about-cv-infos dl > div {\n  display: grid;\n  grid-template-columns: minmax(92px, 0.35fr) minmax(0, 1fr);\n  gap: 16px;\n  padding: 9px 0;\n  border-bottom: 1px solid #111111;\n  font-size: clamp(13px, 1.1vw, 16px);\n  line-height: 1.25;\n}\n\n.about-cv-infos dt {\n  font-weight: 900;\n}\n\n.about-cv-infos dd {\n  min-width: 0;\n  margin: 0;\n  overflow-wrap: anywhere;\n}\n\n.about-cv-infos a {\n  color: inherit;\n  text-decoration: none;\n}\n\n.about-cv-infos a:hover,\n.about-cv-infos a:focus-visible {\n  color: var(--page-accent);\n  outline: 0;\n}\n\n@media (max-width: 760px) {\n  .cv-contact-strip,\n  .cv-current-grid,\n  .cv-final-grid,\n  .about-cv-infos dl {\n    grid-template-columns: 1fr;\n  }\n\n  .cv-contact {\n    text-align: left;\n  }\n\n  .cv-current-card {\n    min-height: 0;\n  }\n\n  .about-cv .cv-current-card {\n    min-height: 0;\n  }\n\n  .cv-current-card h3 {\n    margin-top: 28px;\n  }\n\n  .cv-entry {\n    grid-template-columns: 1fr;\n    gap: 16px;\n  }\n\n  .about-cv .cv-current-card-study {\n    grid-column: auto;\n  }\n}\n\n/* Make every visible text link unmistakable on hover and keyboard focus. */\na[href]:not(.main-nav a):not(.video-link):not(.project-media-link):not(.artwork-item):not(.press-photo-download):not(.subpage-back):hover,\na[href]:not(.main-nav a):not(.video-link):not(.project-media-link):not(.artwork-item):not(.press-photo-download):not(.subpage-back):focus-visible,\n.press-photo-download:hover .press-photo-caption,\n.press-photo-download:focus-visible .press-photo-caption {\n  text-decoration-line: underline;\n  text-decoration-color: transparent;\n  text-decoration-thickness: 0.08em;\n  text-underline-offset: 0.14em;\n}\n\n@media print {\n  @page {\n    size: A4;\n    margin: 12mm;\n  }\n\n  .cv-toolbar,\n  .cv-page .subpage-back {\n    display: none;\n  }\n\n  .cv-editable-page .cv-pdf-only {\n    display: grid;\n  }\n\n  .cv-editable-page .cv-contact-strip,\n  .cv-editable-page .cv-final-grid {\n    grid-template-columns: minmax(0, 1fr) auto;\n  }\n\n  .cv-editable-page .cv-final-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n\n  .cv-page .cv-subpage,\n  .cv-contact-strip,\n  .cv-section {\n    width: 100%;\n  }\n\n  .cv-page .cv-subpage {\n    padding: 0;\n  }\n\n  .cv-page .cv-hero h1 {\n    font-size: 52pt;\n  }\n\n  .cv-contact-strip {\n    margin-top: 20px;\n  }\n\n  .cv-section {\n    margin-top: 38px;\n  }\n\n  .cv-section .work-group-title {\n    font-size: 30pt;\n  }\n\n  .cv-current-card,\n  .cv-entry,\n  .cv-final-grid > div {\n    break-inside: avoid;\n  }\n\n  .cv-current-card {\n    min-height: 0;\n    padding: 16px;\n    border-width: 3px;\n  }\n\n  .cv-entry,\n  .cv-entry-list,\n  .cv-contact-strip,\n  .cv-final-grid {\n    border-width: 3px;\n  }\n\n  .cv-current-card h3,\n  .cv-entry-copy h3 {\n    font-size: 14pt;\n  }\n\n  .cv-current-card > p:last-child,\n  .cv-entry-copy p,\n  .cv-contact,\n  .cv-language-list li,\n  .cv-personal-data dl > div {\n    font-size: 9.5pt;\n  }\n\n  .cv-role {\n    font-size: 16pt;\n  }\n}\n\nmain > h1 { display:none !important } .music-page .subpage { --music-title-width:1050px !important } .band-gallery { margin-top:0 } main.subpage > :not(.aanim-section), .aanim-section > :not(.band-gallery), .band-gallery > .band-feature, body.music-page .subpage-back { display:none !important } .aanim-section > .subpage-copy { display:block !important; font-size:clamp(16px, min(2.1vw, 4.7vh), 40px); padding-bottom:0 } .band-gallery > .band-portrait { container-type:inline-size } .slide-photo-crop { display:flex; justify-content:flex-end; flex-direction:column; height:min(33.33cqw, 63vh); overflow:hidden } .slide-photo-crop > .band-photo-frame { flex:none; width:100% } .band-gallery { margin-bottom:clamp(18px, 6vh, 64px) } .music-page .subpage { padding-block:0 }.subpage-copy a, .subpage-copy .music-word { color:inherit !important } .aanim-section > .subpage-copy:hover { color:#0000ff }h1 .letter, h2 .letter { pointer-events:none }","script":"document.querySelectorAll('h1 .word').forEach(word => {\n  const text = word.textContent;\n  word.setAttribute('aria-label', text);\n  word.textContent = '';\n\n  [...text].forEach(character => {\n    const letter = document.createElement('span');\n    letter.className = 'letter';\n    letter.setAttribute('aria-hidden', 'true');\n    letter.textContent = character;\n    word.appendChild(letter);\n  });\n});\n\nconst swappedImagePairs = new Set();\nconst preloadedHoverSources = new Set();\n\ndocument.querySelectorAll('img[data-hover-src], img[data-hover-group], img[data-hover-options], img[data-swap-pair]').forEach(image => {\n  const originalSource = image.getAttribute('src');\n  const fixedHoverSource = image.dataset.hoverSrc;\n  const hoverGroup = image.dataset.hoverGroup;\n  const swapPair = image.dataset.swapPair;\n  const swapPairImages = swapPair\n    ? [...document.querySelectorAll(`img[data-swap-pair=\"${swapPair}\"]`)]\n    : [];\n  const swapPairSources = swapPairImages.map(pairImage => pairImage.getAttribute('src'));\n  const explicitHoverSources = image.dataset.hoverOptions\n    ? image.dataset.hoverOptions.split(',').map(source => source.trim()).filter(Boolean)\n    : [];\n  const randomHoverSources = explicitHoverSources.length > 0\n    ? explicitHoverSources\n    : hoverGroup\n      ? [...document.querySelectorAll(`img[data-hover-group=\"${hoverGroup}\"]`)]\n        .map(groupImage => groupImage.getAttribute('src'))\n        .filter(source => source && source !== originalSource)\n      : [];\n  const interactionTarget = image.closest('.artwork-item') || image;\n\n  [fixedHoverSource, ...randomHoverSources].filter(Boolean).forEach(source => {\n    if (preloadedHoverSources.has(source)) {\n      return;\n    }\n\n    preloadedHoverSources.add(source);\n    const hoverImage = new Image();\n    hoverImage.src = source;\n  });\n\n  const showHoverImage = () => {\n    if (swapPairImages.length === 2) {\n      if (swappedImagePairs.has(swapPair)) {\n        swapPairImages[0].setAttribute('src', swapPairSources[0]);\n        swapPairImages[1].setAttribute('src', swapPairSources[1]);\n        swappedImagePairs.delete(swapPair);\n        return;\n      }\n\n      swapPairImages[0].setAttribute('src', swapPairSources[1]);\n      swapPairImages[1].setAttribute('src', swapPairSources[0]);\n      swappedImagePairs.add(swapPair);\n      return;\n    }\n\n    const hoverSource = fixedHoverSource || randomHoverSources[\n      Math.floor(Math.random() * randomHoverSources.length)\n    ];\n\n    if (!hoverSource) {\n      return;\n    }\n\n    image.setAttribute('src', hoverSource);\n  };\n\n  const showOriginalImage = () => {\n    if (swapPairImages.length === 2) {\n      return;\n    }\n\n    image.setAttribute('src', originalSource);\n  };\n\n  interactionTarget.addEventListener('mouseenter', showHoverImage);\n  interactionTarget.addEventListener('mouseleave', showOriginalImage);\n  interactionTarget.addEventListener('focusin', showHoverImage);\n  interactionTarget.addEventListener('focusout', showOriginalImage);\n});\n\ndocument.querySelectorAll('a.press-photo-download[download]').forEach(link => {\n  link.addEventListener('click', async event => {\n    event.preventDefault();\n    link.setAttribute('aria-busy', 'true');\n\n    try {\n      const response = await fetch(link.href, { credentials: 'same-origin' });\n\n      if (!response.ok) {\n        throw new Error(`Photo download failed with status ${response.status}`);\n      }\n\n      const photoBlob = await response.blob();\n      const photoUrl = URL.createObjectURL(photoBlob);\n      const downloadLink = document.createElement('a');\n      downloadLink.href = photoUrl;\n      downloadLink.download = link.getAttribute('download') || 'press-photo.jpg';\n      document.body.appendChild(downloadLink);\n      downloadLink.click();\n      downloadLink.remove();\n      window.setTimeout(() => URL.revokeObjectURL(photoUrl), 1000);\n    } catch (error) {\n      const fallbackLink = document.createElement('a');\n      fallbackLink.href = link.href;\n      fallbackLink.download = link.getAttribute('download') || 'press-photo.jpg';\n      document.body.appendChild(fallbackLink);\n      fallbackLink.click();\n      fallbackLink.remove();\n    } finally {\n      link.removeAttribute('aria-busy');\n    }\n  });\n});\n\ndocument.querySelectorAll('[data-audio-player]').forEach(player => {\n  const audio = player.querySelector('audio');\n  const toggle = player.querySelector('[data-audio-toggle]');\n  const progress = player.querySelector('[data-audio-progress]');\n  const seek = player.querySelector('[data-audio-seek]');\n  const stepButtons = player.querySelectorAll('[data-audio-step]');\n\n  if (!audio || !toggle || !progress || !seek) {\n    return;\n  }\n\n  const playLabel = toggle.getAttribute('aria-label') || 'Play audio';\n  const pauseLabel = playLabel.replace(/^Play\\b/, 'Pause');\n\n  const syncAudioProgress = () => {\n    const amount = audio.duration ? audio.currentTime / audio.duration : 0;\n    player.style.setProperty('--audio-progress', amount);\n  };\n\n  toggle.addEventListener('click', () => {\n    if (audio.paused) {\n      audio.play();\n    } else {\n      audio.pause();\n    }\n  });\n\n  stepButtons.forEach(button => {\n    button.addEventListener('click', () => {\n      const seconds = Number(button.dataset.audioStep) || 0;\n      audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + seconds));\n    });\n  });\n\n  seek.addEventListener('click', event => {\n    if (!audio.duration) {\n      return;\n    }\n\n    const bounds = seek.getBoundingClientRect();\n    const amount = Math.min(1, Math.max(0, (event.clientX - bounds.left) / bounds.width));\n    audio.currentTime = amount * audio.duration;\n  });\n\n  audio.addEventListener('play', () => {\n    player.classList.add('is-playing');\n    toggle.setAttribute('aria-label', pauseLabel);\n  });\n\n  audio.addEventListener('pause', () => {\n    player.classList.remove('is-playing');\n    toggle.setAttribute('aria-label', playLabel);\n  });\n\n  audio.addEventListener('timeupdate', syncAudioProgress);\n  audio.addEventListener('loadedmetadata', syncAudioProgress);\n  audio.addEventListener('ended', syncAudioProgress);\n});\n\ndocument.querySelectorAll(\n  '.digital-works-page .weather-sound-project, .digital-works-page .digital-playground-project'\n).forEach(project => {\n  const showAccent = () => project.classList.add('is-accented');\n  const hideMouseAccent = event => {\n    if (event.pointerType === 'mouse') {\n      project.classList.remove('is-accented');\n    }\n  };\n\n  project.addEventListener('pointerenter', showAccent);\n  project.addEventListener('pointerdown', showAccent);\n  project.addEventListener('pointerleave', hideMouseAccent);\n  project.addEventListener('focusin', showAccent);\n  project.addEventListener('focusout', () => project.classList.remove('is-accented'));\n});\n\ndocument.querySelectorAll('.artwork-gallery').forEach(gallery => {\n  const creditLines = [...gallery.querySelectorAll('.artwork-credit-line')];\n\n  const showArtworkCredit = event => {\n    const artwork = event.target instanceof Element\n      ? event.target.closest('.artwork-item')\n      : null;\n\n    if (artwork && gallery.contains(artwork)) {\n      creditLines.forEach(line => {\n        line.textContent = '';\n      });\n\n      const creditLine = gallery.querySelector(\n        `.artwork-credit-${artwork.dataset.creditGroup}`\n      );\n\n      if (creditLine) {\n        creditLine.textContent = artwork.dataset.credit || '';\n      }\n    }\n  };\n\n  const clearArtworkCredit = () => {\n    creditLines.forEach(line => {\n      line.textContent = '';\n    });\n  };\n\n  gallery.addEventListener('pointerover', showArtworkCredit);\n  gallery.addEventListener('pointerleave', clearArtworkCredit);\n  gallery.addEventListener('focusin', showArtworkCredit);\n  gallery.addEventListener('focusout', event => {\n    if (!gallery.contains(event.relatedTarget)) {\n      clearArtworkCredit();\n    }\n  });\n});\n\ndocument.querySelectorAll('.interactive-title').forEach(title => {\n  const words = title.textContent.trim().split(/\\s+/);\n  const fullTitle = words.join(' ');\n  const isAboutTitle = Boolean(title.closest('.about-page'));\n\n  title.setAttribute('aria-label', fullTitle);\n  title.textContent = '';\n\n  words.forEach((word, wordIndex) => {\n    const wordElement = isAboutTitle && word.toLowerCase() === 'me'\n      ? document.createElement('button')\n      : document.createElement('span');\n\n    wordElement.className = 'title-word';\n\n    if (wordElement instanceof HTMLButtonElement) {\n      wordElement.type = 'button';\n      wordElement.classList.add('about-me-trigger');\n      wordElement.setAttribute('aria-label', 'Funfacts about me');\n      wordElement.setAttribute('aria-controls', 'funfacts-section');\n      wordElement.setAttribute('aria-expanded', 'false');\n    } else {\n      wordElement.setAttribute('aria-hidden', 'true');\n    }\n\n    [...word].forEach(character => {\n      const letter = document.createElement('span');\n      letter.className = 'letter';\n      letter.textContent = character;\n      wordElement.appendChild(letter);\n    });\n\n    title.appendChild(wordElement);\n    if (wordIndex \u003c words.length - 1) {\n      title.appendChild(document.createTextNode(' '));\n    }\n  });\n});\n\ndocument.querySelectorAll('.work-group-title').forEach(title => {\n  const text = title.textContent.trim();\n  title.setAttribute('aria-label', text);\n  title.textContent = '';\n\n  [...text].forEach(character => {\n    if (/\\s/.test(character)) {\n      title.appendChild(document.createTextNode(character));\n      return;\n    }\n\n    const letter = document.createElement('span');\n\n    letter.className = 'work-title-letter';\n    letter.setAttribute('aria-hidden', 'true');\n    letter.textContent = character;\n    title.appendChild(letter);\n  });\n});\n\nfunction syncSiteContentWidth() {\n  let meter = document.querySelector('.site-content-width-meter');\n\n  if (!meter) {\n    meter = document.createElement('span');\n    meter.className = 'work-group-title site-content-width-meter';\n    meter.textContent = 'INSTALLATIONS';\n    meter.setAttribute('aria-hidden', 'true');\n    Object.assign(meter.style, {\n      position: 'absolute',\n      left: '-9999px',\n      top: '-9999px',\n      display: 'block',\n      width: 'fit-content',\n      maxWidth: 'none',\n      paddingBottom: '0',\n      visibility: 'hidden',\n      pointerEvents: 'none',\n      transform: 'none'\n    });\n    document.body.appendChild(meter);\n  }\n\n  const wordWidth = Math.ceil(meter.getBoundingClientRect().width);\n\n  if (wordWidth > 0) {\n    document.documentElement.style.setProperty('--site-content-width', `min(100%, ${wordWidth}px)`);\n\n    document.querySelectorAll('.work-group-title:not(.site-content-width-meter)').forEach(title => {\n      const titleWidth = title.scrollWidth;\n      const letters = [...title.querySelectorAll('.work-title-letter')];\n      const letterGaps = Math.max(1, letters.length - 1);\n      const stretchSpacing = titleWidth > 0 && wordWidth > titleWidth\n        ? (wordWidth - titleWidth) / letterGaps\n        : 0;\n\n      title.style.setProperty('--title-stretch-spacing', `${stretchSpacing.toFixed(2)}px`);\n    });\n  }\n}\n\nsyncSiteContentWidth();\nwindow.addEventListener('resize', syncSiteContentWidth);\ndocument.fonts?.ready.then(syncSiteContentWidth);\n\ndocument.querySelectorAll('.member-credit-line').forEach(creditLine => {\n  const portrait = creditLine.closest('.band-portrait');\n\n  if (!portrait) {\n    return;\n  }\n\n  const bandImage = portrait.querySelector('.band-photo-frame .band-image');\n  const originalPhoto = bandImage?.getAttribute('src') || '';\n  const originalAlt = bandImage?.getAttribute('alt') || '';\n\n  const res lFunfacts();\n      aboutMeTrigger.classList.add('is-discovered');\n      aboutMeTrigger.setAttribute('aria-expanded', 'true');\n    });\n\n    funfactsNext?.addEventListener('click', () => {\n      if (selectedFunfacts.length === 0) {\n        return;\n      }\n\n      if (funfactIndex === selectedFunfacts.length - 1) {\n        funfactsSection.classList.remove('is-visible');\n        aboutMeTrigger.classList.remove('is-discovered');\n        aboutMeTrigger.setAttribute('aria-expanded', 'false');\n\n        window.setTimeout(() => {\n          funfactsSection.hidden = true;\n          selectedFunfacts = [];\n          funfactIndex = 0;\n          window.dispatchEvent(new CustomEvent('aboutcopychange'));\n          window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });\n        }, 220);\n        return;\n      }\n\n      funfactIndex += 1;\n      funfactsSlide.classList.add('is-changing');\n\n      window.setTimeout(() => {\n        renderFunfact();\n        funfactsSlide.classList.remove('is-changing');\n      }, 100);\n    });\n  }\n}\n\nif (drawingCanvas) {\n  const drawingContext = drawingCanvas.getContext('2d');\n  const drawingArea = drawingCanvas.closest('.drawing-playground');\n  const isLocalizedDrawing = Boolean(drawingArea);\n  const drawingClear = document.querySelector('.drawing-clear');\n  const drawingPage = document.body;\n  const drawingContent = document.querySelector('.subpage');\n  const protectedDrawingElements = isLocalizedDrawing ? [] : Array.from(document.querySelectorAll(\n    '.interactive-title, .drawing-playground, .about-copy, .funfacts-section, .subpage-back'\n  ));\n  const strokes = [];\n\n  let activePointer = null;\n  let activeStroke = null;\n  let pendingStartPoint = null;\n  let strokeStarted = false;\n  let canvasWidth = 0;\n  let canvasHeight = 0;\n  let resizeFrame;\n\n  function syncDrawingClear() {\n    const hasDrawing = strokes.some(stroke => stroke.length > 1);\n    if (drawingClear) {\n      drawingClear.disabled = !hasDrawing;\n      drawingClear.hidden = !hasDrawing;\n    }\n  }\n\n  function configureDrawingContext() {\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    const pageStyles = getComputedStyle(drawingPage);\n    drawingContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    drawingContext.lineWidth = 5;\n    drawingContext.lineCap = 'round';\n    drawingContext.lineJoin = 'round';\n    drawingContext.strokeStyle = pageStyles.getPropertyValue('--page-accent').trim()\n      || pageStyles.getPropertyValue('--about-accent').trim()\n      || '#ff34b3';\n  }\n\n  function renderDrawing() {\n    drawingContext.setTransform(1, 0, 0, 1, 0, 0);\n    drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);\n    configureDrawingContext();\n\n    strokes.forEach(stroke => {\n      if (stroke.length === 0) {\n        return;\n      }\n\n      drawingContext.beginPath();\n      drawingContext.moveTo(stroke[0].x, stroke[0].y);\n\n      if (stroke.length === 1) {\n        drawingContext.lineTo(stroke[0].x + 0.01, stroke[0].y + 0.01);\n      } else {\n        for (let index = 1; index \u003c stroke.length; index++) {\n          const point = stroke[index];\n          drawingContext.lineTo(point.x, point.y);\n        }\n      }\n\n      drawingContext.stroke();\n    });\n  }\n\n  function resetDrawing() {\n    strokes.length = 0;\n    activePointer = null;\n    activeStroke = null;\n    pendingStartPoint = null;\n    strokeStarted = false;\n    drawingPage.classList.remove('is-drawing');\n    drawingContext.setTransform(1, 0, 0, 1, 0, 0);\n    drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);\n    syncDrawingClear();\n  }\n\n  function measureElementRect(element) {\n    if (!element) {\n      return null;\n    }\n\n    if (!element.hidden) {\n      return element.getBoundingClientRect();\n    }\n\n    const previousVisibility = element.style.visibility;\n    const previousPointerEvents = element.style.pointerEvents;\n\n    element.hidden = false;\n    element.style.visibility = 'hidden';\n    element.style.pointerEvents = 'none';\n\n    const rect = element.getBoundingClientRect();\n\n    element.hidden = true;\n    element.style.visibility = previousVisibility;\n    element.style.pointerEvents = previousPointerEvents;\n\n    return rect.width && rect.height ? rect : null;\n  }\n\n  function createIntroDrawing() {\n    resetDrawing();\n\n    const stroke = [];\n    const segmentCount = 6 + Math.floor(Math.random() * 4);\n    const margin = Math.min(canvasWidth, canvasHeight) * 0.08;\n    const forbiddenAreas = protectedDrawingElements.map(measureElementRect).filter(Boolean).map(rect => ({\n      left: rect.left + window.scrollX - 34,\n      top: rect.top + window.scrollY - 30,\n      right: rect.right + window.scrollX + 34,\n      bottom: rect.bottom + window.scrollY + 30\n    }));\n\n    function clampPoint(point) {\n      return {\n        x: Math.min(canvasWidth - margin, Math.max(margin, point.x)),\n        y: Math.min(canvasHeight - margin, Math.max(margin, point.y))\n      };\n    }\n\n    function avoidsText(point) {\n      return !forbiddenAreas.some(area => (\n        point.x >= area.left &&\n        point.x \u003c= area.right &&\n        point.y >= area.top &&\n        point.y \u003c= area.bottom\n      ));\n    }\n\n    function segmentAvoidsText(startPoint, endPoint) {\n      const sampleCount = 18;\n\n      for (let sample = 1; sample \u003c= sampleCount; sample++) {\n        const progress = sample / sampleCount;\n        const point = {\n          x: startPoint.x + (endPoint.x - startPoint.x) * progress,\n          y: startPoint.y + (endPoint.y - startPoint.y) * progress\n        };\n\n        if (!avoidsText(point)) {\n          return false;\n        }\n      }\n\n      return true;\n    }\n\n    function moveAwayFromText(point) {\n      const nextPoint = clampPoint(point);\n\n      if (avoidsText(nextPoint)) {\n        return nextPoint;\n      }\n\n      const activeArea = forbiddenAreas.find(area => (\n        nextPoint.x >= area.left &&\n        nextPoint.x \u003c= area.right &&\n        nextPoint.y >= area.top &&\n        nextPoint.y \u003c= area.bottom\n      ));\n\n      if (!activeArea) {\n        return nextPoint;\n      }\n\n      const exits = [\n        { x: activeArea.left - margin * 0.45, y: nextPoint.y },\n        { x: activeArea.right + margin * 0.45, y: nextPoint.y },\n        { x: nextPoint.x, y: activeArea.top - margin * 0.45 },\n        { x: nextPoint.x, y: activeArea.bottom + margin * 0.45 }\n      ].map(clampPoint).filter(avoidsText);\n\n      return exits.reduce((closest, candidate) => {\n        const closestDistance = Math.hypot(closest.x - nextPoint.x, closest.y - nextPoint.y);\n        const candidateDistance = Math.hypot(candidate.x - nextPoint.x, candidate.y - nextPoint.y);\n        return candidateDistance \u003c closestDistance ? candidate : closest;\n      }, exits[0] || nextPoint);\n    }\n\n    function randomPoint() {\n      let point = { x: margin, y: margin };\n\n      for (let attempt = 0; attempt \u003c 16; attempt++) {\n        point = {\n          x: margin + Math.random() * Math.max(1, canvasWidth - margin * 2),\n          y: margin + Math.random() * Math.max(1, canvasHeight - margin * 2)\n        };\n\n        if (avoidsText(point)) {\n          return clampPoint(point);\n        }\n      }\n\n      return moveAwayFromText(point);\n    }\n\n    function sideOfText(point) {\n      if (forbiddenAreas.length === 0) {\n        return 'free';\n      }\n\n      const nearestArea = forbiddenAreas.reduce((nearest, area) => {\n        const nearestDx = Math.max(nearest.left - point.x, 0, point.x - nearest.right);\n        const nearestDy = Math.max(nearest.top - point.y, 0, point.y - nearest.bottom);\n        const areaDx = Math.max(area.left - point.x, 0, point.x - area.right);\n        const areaDy = Math.max(area.top - point.y, 0, point.y - area.bottom);\n        return Math.hypot(areaDx, areaDy) \u003c Math.hypot(nearestDx, nearestDy)\n          ? area\n          : nearest;\n      }, forbiddenAreas[0]);\n\n      const distances = [\n        { side: 'left', value: Math.abs(point.x - nearestArea.left) },\n        { side: 'right', value: Math.abs(point.x - nearestArea.right) },\n        { side: 'top', value: Math.abs(point.y - nearestArea.top) },\n        { side: 'bottom', value: Math.abs(point.y - nearestArea.bottom) }\n      ];\n\n      if (point.x \u003c nearestArea.left) {\n        return 'left';\n      }\n\n      if (point.x > nearestArea.right) {\n        return 'right';\n      }\n\n      if (point.y \u003c nearestArea.top) {\n        return 'top';\n      }\n\n      if (point.y > nearestArea.bottom) {\n        return 'bottom';\n      }\n\n      return distances.sort((a, b) => a.value - b.value)[0].side;\n    }\n\n    function randomPointNear(point) {\n      const side = sideOfText(point);\n\n      for (let attempt = 0; attempt \u003c 14; attempt++) {\n        const candidate = randomPoint();\n\n        if (sideOfText(candidate) === side || Math.random() > 0.48) {\n          return candidate;\n        }\n      }\n\n      return randomPoint();\n    }\n\n    let { x, y } = randomPoint();\n\n    stroke.push({ x, y });\n\n    for (let segment = 0; segment \u003c segmentCount; segment++) {\n      const segmentType = Math.random();\n      const pointsInSegment = 7 + Math.floor(Math.random() * 8);\n      const target = randomPointNear({ x, y });\n      const targetX = target.x;\n      const targetY = target.y;\n      const loopRadius = 24 + Math.random() * 58;\n      const zigzagSize = 18 + Math.random() * 44;\n      const loopTurns = 1 + Math.random() * 1.5;\n\n      for (let index = 1; index \u003c= pointsInSegment; index++) {\n        const progress = index / pointsInSegment;\n        const baseX = x + (targetX - x) * progress;\n        const baseY = y + (targetY - y) * progress;\n        let offsetX = 0;\n        let offsetY = 0;\n\n        if (segmentType \u003c 0.38) {\n          const angle = progress * Math.PI * 2 * loopTurns;\n          offsetX = Math.cos(angle) * loopRadius * Math.sin(progress * Math.PI);\n          offsetY = Math.sin(angle) * loopRadius * Math.sin(progress * Math.PI);\n        } else if (segmentType \u003c 0.72) {\n          const zigzag = index % 2 === 0 ? 1 : -1;\n          const angle = Math.atan2(targetY - y, targetX - x) + Math.PI / 2;\n          offsetX = Math.cos(angle) * zigzagSize * zigzag;\n          offsetY = Math.sin(angle) * zigzagSize * zigzag;\n        } else {\n          offsetX = Math.sin(progress * Math.PI * 3) * zigzagSize;\n          offsetY = Math.cos(progress * Math.PI * 2.4) * loopRadius * 0.5;\n        }\n\n        let nextPoint = moveAwayFromText({\n          x: baseX + offsetX,\n          y: baseY + offsetY\n        });\n\n        if (!segmentAvoidsText(stroke[stroke.length - 1], nextPoint)) {\n          for (let attempt = 0; attempt \u003c 10; attempt++) {\n            const alternativePoint = moveAwayFromText(randomPointNear(stroke[stroke.length - 1]));\n\n            if (segmentAvoidsText(stroke[stroke.length - 1], alternativePoint)) {\n              nextPoint = alternativePoint;\n              break;\n            }\n          }\n        }\n\n        stroke.push(nextPoint);\n      }\n\n      ({ x, y } = stroke[stroke.length - 1]);\n    }\n\n    strokes.push(stroke);\n    renderDrawing();\n    syncDrawingClear();\n  }\n\n  function resizeDrawingCanvas(options = {}) {\n    const shouldScaleStrokes = options.scaleStrokes === true;\n    const nextWidth = isLocalizedDrawing\n      ? drawingArea.clientWidth\n      : Math.max(document.documentElement.scrollWidth, window.innerWidth);\n    const nextHeight = isLocalizedDrawing\n      ? drawingArea.clientHeight\n      : Math.max(document.documentElement.scrollHeight, window.innerHeight);\n\n    if (nextWidth === canvasWidth && nextHeight === canvasHeight) {\n      return;\n    }\n\n    if (shouldScaleStrokes && canvasWidth && canvasHeight) {\n      const scaleX = nextWidth / canvasWidth;\n      const scaleY = nextHeight / canvasHeight;\n\n      strokes.forEach(stroke => {\n        stroke.forEach(point => {\n          point.x *= scaleX;\n          point.y *= scaleY;\n        });\n      });\n    }\n\n    canvasWidth = nextWidth;\n    canvasHeight = nextHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingCanvas.width = Math.round(canvasWidth * pixelRatio);\n    drawingCanvas.height = Math.round(canvasHeight * pixelRatio);\n    drawingCanvas.style.width = `${canvasWidth}px`;\n    drawingCanvas.style.height = `${canvasHeight}px`;\n    renderDrawing();\n  }\n\n  function scheduleCanvasResize(options = {}) {\n    const shouldScaleStrokes = options.scaleStrokes === true;\n\n    cancelAnimationFrame(resizeFrame);\n    resizeFrame = requestAnimationFrame(() => {\n      resizeDrawingCanvas({ scaleStrokes: shouldScaleStrokes });\n    });\n  }\n\n  function isControl(target) {\n    return target instanceof Element && Boolean(target.closest(\n      'a, button, input, textarea, select, [contenteditable=\"true\"]'\n    ));\n  }\n\n  function addDrawingPoint(event) {\n    const events = event.getCoalescedEvents?.() || [event];\n    const rect = isLocalizedDrawing ? drawingArea.getBoundingClientRect() : null;\n\n    events.forEach(pointerEvent => {\n      activeStroke.push({\n        x: isLocalizedDrawing ? pointerEvent.clientX - rect.left : pointerEvent.pageX,\n        y: isLocalizedDrawing ? pointerEvent.clientY - rect.top : pointerEvent.pageY\n      });\n    });\n\n    renderDrawing();\n    syncDrawingClear();\n  }\n\n  function finishStroke(event) {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    if (activeStroke && activeStroke.length \u003c 2) {\n      strokes.pop();\n    }\n\n    activePointer = null;\n    activeStroke = null;\n    pendingStartPoint = null;\n    strokeStarted = false;\n    drawingPage.classList.remove('is-drawing');\n    syncDrawingClear();\n    renderDrawing();\n  }\n\n  drawingClear?.addEventListener('click', () => {\n    resetDrawing();\n  });\n\n  document.addEventListener('pointerdown', event => {\n    if (activePointer !== null || isControl(event.target)) {\n      return;\n    }\n\n    if (isLocalizedDrawing && !event.target.closest('.drawing-playground')) {\n      return;\n    }\n\n    if (event.pointerType === 'mouse' && event.button !== 0) {\n      return;\n    }\n\n    event.preventDefault();\n    activePointer = event.pointerId;\n    activeStroke = [];\n    const rect = isLocalizedDrawing ? drawingArea.getBoundingClientRect() : null;\n    pendingStartPoint = {\n      x: isLocalizedDrawing ? event.clientX - rect.left : event.pageX,\n      y: isLocalizedDrawing ? event.clientY - rect.top : event.pageY\n    };\n    strokeStarted = false;\n    strokes.push(activeStroke);\n  }, { capture: true });\n\n  document.addEventListener('pointermove', event => {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    if (event.pointerType === 'mouse' && (event.buttons & 1) !== 1) {\n      finishStroke(event);\n      return;\n    }\n\n    event.preventDefault();\n    drawingPage.classList.add('is-drawing');\n\n    if (!strokeStarted) {\n      activeStroke.push(pendingStartPoint);\n      strokeStarted = true;\n    }\n\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointerup', finishStroke, { capture: true });\n  document.addEventListener('pointercancel', finishStroke, { capture: true });\n  window.addEventListener('resize', () => {\n    scheduleCanvasResize({ scaleStrokes: true });\n  });\n  window.addEventListener('pageshow', event => {\n    if (event.persisted) {\n      createIntroDrawing();\n    }\n  });\n\n  if ('ResizeObserver' in window && drawingContent) {\n    new ResizeObserver(scheduleCanvasResize).observe(drawingContent);\n  }\n\n  document.fonts?.ready.then(scheduleCanvasResize);\n  resizeDrawingCanvas();\n  createIntroDrawing();\n}\n","explanation":"I had already linked the relevant words in the material I gave Codex. I only wanted those words to turn blue, but Codex applied the effect to all the text."},{"id":"018","sourceId":"106","focus":"","prompt":"Apply the blue hover effect to individual linked words only. Keep the rest of the text in its original colour.","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"de\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Bands &amp; Live &mdash; Nicoline Andrea\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody class=\"music-page\">\n  \u003cmain class=\"subpage\">\n    \u003ch1 class=\"interactive-title\">AANIM\u003c/h1>\n\n    \u003csection class=\"aanim-section\">\n      \u003cdiv class=\"aanim-side-label\" aria-hidden=\"true\">\n        \u003cspan>AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM AANIM\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"band-gallery music-media\">\n        \u003cdiv class=\"band-feature\">\n          \u003cdiv class=\"band-portrait\">\n            \u003cdiv class=\"band-photo-frame\">\n              \u003cimg class=\"band-image\" src=\"../../shared/assets/images/music/aanim-band-live.jpg\" alt=\"AANIM band photograph\">\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"band-portrait\">\n          \u003cdiv class=\"member-credit-line\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\n          \u003cdiv class=\"slide-photo-crop\">\u003cdiv class=\"band-photo-frame\">\n            \u003cimg class=\"band-image\" src=\"../../shared/assets/images/music/aanim-band-blue.jpg\" alt=\"AANIM band photograph\">\n            \u003cbutton class=\"member-hotspot nicoline\" type=\"button\" data-credit=\"Nicoline Andrea Janka: vocals &amp; synth\" data-photo=\"../../shared/assets/images/music/aanim-member-nicoline.jpg\" aria-label=\"Nicoline Andrea Janka: vocals and synth\">\u003c/button>\n            \u003cbutton class=\"member-hotspot nils\" type=\"button\" data-credit=\"Nils Stricker: drums &amp; backing vocals\" data-photo=\"../../shared/assets/images/music/aanim-member-nils.jpg\" aria-label=\"Nils Stricker: drums and backing vocals\">\u003c/button>\n            \u003cbutton class=\"member-hotspot lucas\" type=\"button\" data-credit=\"Lucas Sevilla: guitar\" data-photo=\"../../shared/assets/images/music/aanim-member-lucas.jpg\" aria-label=\"Lucas Sevilla: guitar\">\u003c/button>\n            \u003cbutton class=\"member-hotspot nuria\" type=\"button\" data-credit=\"Nuria Kr&auml;uchi: bass\" data-photo=\"../../shared/assets/images/music/aanim-member-nuria.jpg\" aria-label=\"Nuria Kr&auml;uchi: bass\">\u003c/button>\n            \u003cbutton class=\"member-hotspot julia\" type=\"button\" data-credit=\"Julia S&uuml;ess: guitar &amp; backing vocals\" data-photo=\"../../shared/assets/images/music/aanim-member-julia.jpg\" aria-label=\"Julia S&uuml;ess: guitar and backing vocals\">\u003c/button>\n          \u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"subpage-copy\">\n        \u003cp>\u003ca class=\"band-link\" href=\"https://www.aanim.net/\" target=\"_blank\" rel=\"noopener noreferrer\">AANIM\u003c/a> is a five-piece band mainly active around Bern and Lucerne. We have released two albums, \u003ccite class=\"album-group\">\u003ca class=\"album-title\" href=\"https://www.youtube.com/watch?v=NfXw7TAZ9So&amp;list=PLRzOEHudKts8Yos7VX5m1hdJrkdIYfACM\" target=\"_blank\" rel=\"noopener noreferrer\">Contemplation\u003c/a> / \u003ca class=\"album-title\" href=\"https://www.youtube.com/playlist?list=PLRzOEHudKts9ik3KUaXOOckEsWUtVcOpG\" target=\"_blank\" rel=\"noopener noreferrer\">Remedy\u003c/a>\u003c/cite> and \u003ccite>\u003ca class=\"album-title\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\">Fuormas Neras\u003c/a>\u003c/cite>, and played shows at venues such as Sch&uuml;&uuml;r, Mokka, Gaskessel and many more. I sing and play synths in the band. We love cozy shows, small rooms and being close to the audience.\u003c/p>\n      \u003c/div>\n\n      \u003ca class=\"video-link music-media\" href=\"https://www.youtube.com/watch?v=ehqON-5_tG4&amp;t=8s\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Watch AANIM live at Gaskessel on YouTube\">\n        \u003cimg class=\"video-image\" src=\"../../shared/assets/images/music/aanim-live-gaskessel.jpg\" alt=\"AANIM live at Gaskessel\">\n        \u003cspan class=\"video-play\" aria-hidden=\"true\">\u003c/span>\n      \u003c/a>\n\n      \u003cdiv class=\"artwork-gallery music-media\" aria-label=\"Artwork for the AANIM albums\">\n        \u003cdiv class=\"artwork-credit-line artwork-credit-fuormas\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\n        \u003cdiv class=\"artwork-credit-line artwork-credit-remedy\" aria-live=\"polite\" aria-atomic=\"true\">\u003c/div>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=EsY7Ikyw7xY&amp;list=PLRzOEHudKts9mfS0qyB7Ri4r5HT7hXve-\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"fuormas\" data-credit=\"ARTWORK Fuormas Neras by Nicoline and Nuria\">\n          \u003cimg src=\"../../shared/assets/images/music/fuormas-neras-artwork-black-white.jpg\" data-hover-options=\"../../shared/assets/images/music/fuormas-neras-artwork-blue.jpg,../../shared/assets/images/music/fuormas-neras-artwork-lavender.jpg,../../shared/assets/images/music/fuormas-neras-artwork-purple.jpg\" alt=\"Fuormas Neras album artwork in black and white\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=NfXw7TAZ9So&amp;list=PLRzOEHudKts8Yos7VX5m1hdJrkdIYfACM\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"remedy\" data-credit=\"ARTWORK Remedy by Anna Frey\">\n          \u003cimg src=\"../../shared/assets/images/music/remedy-artwork-01.jpg\" data-swap-pair=\"remedy-2\" alt=\"Album artwork variation 2.2\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=NfXw7TAZ9So&amp;list=PLRzOEHudKts8Yos7VX5m1hdJrkdIYfACM\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"remedy\" data-credit=\"ARTWORK Remedy by Anna Frey\">\n          \u003cimg src=\"../../shared/assets/images/music/remedy-artwork-02.jpg\" data-swap-pair=\"remedy-2\" alt=\"Album artwork variation 2.3\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=xbKyMjM24Bc&amp;list=PLRzOEHudKts9ik3KUaXOOckEsWUtVcOpG&amp;index=2\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"remedy\" data-credit=\"ARTWORK Contemplation by Anna Frey\">\n          \u003cimg src=\"../../shared/assets/images/music/contemplation-artwork-01.jpg\" data-swap-pair=\"remedy-1\" alt=\"Album artwork variation 1.3\">\n        \u003c/a>\n        \u003ca class=\"artwork-item\" href=\"https://www.youtube.com/watch?v=xbKyMjM24Bc&amp;list=PLRzOEHudKts9ik3KUaXOOckEsWUtVcOpG&amp;index=2\" target=\"_blank\" rel=\"noopener noreferrer\" data-credit-group=\"remedy\" data-credit=\"ARTWORK Contemplation by Anna Frey\">\n          \u003cimg src=\"../../shared/assets/images/music/contemplation-artwork-02.jpg\" data-swap-pair=\"remedy-1\" alt=\"Album artwork variation 1.4\">\n        \u003c/a>\n      \u003c/div>\n\n      \u003ca class=\"press-kit-link\" href=\"https://drive.google.com/drive/folders/12CpQy8bRiUTXSCPex7sveMCx31APhtmg\" target=\"_blank\" rel=\"noopener noreferrer\">PRESS KIT AANIM\u003c/a>\n    \u003c/section>\n    \u003csection class=\"kima-section\">\n      \u003ch2 class=\"interactive-title band-section-title\">Kim.a\u003c/h2>\n\n      \u003cdiv class=\"subpage-copy\">\n        \u003cp>Like the depths of the ocean, the calm before a storm, waking after a nightmare or a butterfly in the rain, Kim.a is cold, direct, beautiful and tearing. Every part of the music is created by Nicoline Andrea Janka: she writes and composes all songs and produces them in REAPER and Ableton Live. On stage, she performs with a live drummer.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"kima-video-grid music-media\" aria-label=\"Kim.a live sessions at Neubad\">\n        \u003ca class=\"video-link\" href=\"https://www.youtube.com/watch?v=racv1u98r34\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Watch Kim.a - Emblidar, live at Neubad on YouTube\">\n          \u003cimg class=\"video-image\" src=\"https://i.ytimg.com/vi/racv1u98r34/maxresdefault.jpg\" alt=\"Kim.a performing Emblidar live at Neubad\" width=\"1280\" height=\"720\" loading=\"lazy\" decoding=\"async\">\n          \u003cspan class=\"video-play\" aria-hidden=\"true\">\u003c/span>\n        \u003c/a>\n        \u003ca class=\"video-link\" href=\"https://www.youtube.com/watch?v=oGeETkS3Yj0\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Watch Kim.a - Ocean, live at Neubad on YouTube\">\n          \u003cimg class=\"video-image\" src=\"https://i.ytimg.com/vi/oGeETkS3Yj0/maxresdefault.jpg\" alt=\"Kim.a performing Ocean live at Neubad\" width=\"1280\" height=\"720\" loading=\"lazy\" decoding=\"async\">\n          \u003cspan class=\"video-play\" aria-hidden=\"true\">\u003c/span>\n        \u003c/a>\n      \u003c/div>\n\n      \u003ca class=\"press-kit-link\" href=\"https://drive.google.com/drive/folders/11QbIluKnuD9ohsLbi-QIGyuxssIXFV9X\" target=\"_blank\" rel=\"noopener noreferrer\">PRESS KIT KIM.A\u003c/a>\n    \u003c/section>\n    \u003ca class=\"subpage-back\" href=\"../../index.html\" target=\"_top\" aria-label=\"Zur&uuml;ck zu den Themen\">&larr;\u003c/a>\n  \u003c/main>\n\n  \n\n  \u003cscript src=\"script.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","styles":"* {\n  box-sizing: border-box;\n}\n\n:root {\n  --site-content-width: min(100%, calc(clamp(46px, 7.1vw, 112px) * 7.38));\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  background: #ffffff;\n  color: #111111;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\n.site-footer {\n  padding: clamp(44px, 6vw, 84px) 28px 28px;\n}\n\n.site-footer-content {\n  width: var(--site-content-width);\n  padding-top: clamp(16px, 2vw, 26px);\n  border-top: 5px solid #111111;\n}\n\n.site-footer p {\n  max-width: 900px;\n  margin: 0;\n  font-size: clamp(11px, 0.9vw, 14px);\n  font-weight: 400;\n  line-height: 1.25;\n}\n\nheader {\n  position: relative;\n  padding: clamp(20px, 2.2vw, 28px);\n}\n\nh1 {\n  width: fit-content;\n  max-width: 100%;\n  margin: 0;\n  font-size: clamp(56px, 10.8vw, 150px);\n  font-weight: 900;\n  line-height: 0.74;\n  letter-spacing: -0.06em;\n}\n\nh1 > .word {\n  display: block;\n  white-space: nowrap;\n}\n\n.letter {\n  display: inline-block;\n  transition: opacity 100ms ease;\n}\n\n.letter:hover {\n  opacity: 0;\n}\n\n.title-word {\n  display: inline-block;\n  white-space: nowrap;\n}\n\n.about-me-trigger {\n  appearance: none;\n  display: inline-block;\n  margin: 0;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: inherit;\n  font: inherit;\n  line-height: inherit;\n  letter-spacing: inherit;\n  text-align: inherit;\n  vertical-align: baseline;\n  cursor: pointer;\n  transition: color 100ms ease;\n}\n\n.about-me-trigger:hover,\n.about-me-trigger:focus-visible,\n.about-me-trigger.is-discovered {\n  color: var(--about-accent);\n}\n\n.about-me-trigger .letter:hover {\n  opacity: 1;\n}\n\n.about-me-trigger:focus-visible {\n  outline: 0;\n}\n\n.mic-control {\n  width: 100%;\n  margin-top: clamp(22px, 2.5vw, 36px);\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n  gap: 10px;\n}\n\n.mic-toggle {\n  align-self: flex-start;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 1.7vw, 24px);\n  font-weight: 900;\n  cursor: pointer;\n}\n\n.mic-toggle:disabled {\n  cursor: wait;\n  opacity: 0.45;\n}\n\n.mic-meter {\n  position: relative;\n  height: clamp(68px, 7.5vw, 102px);\n  overflow: hidden;\n}\n\n.mic-wave {\n  position: absolute;\n  inset: 0;\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n\n.landing-strip {\n  display: flex;\n  margin-top: clamp(16px, 2vw, 30px);\n  width: var(--site-content-width);\n  background: transparent;\n}\n\n.landing-strip-image {\n  display: block;\n  width: 25%;\n  min-width: 0;\n  aspect-ratio: 2 / 3;\n  height: auto;\n  object-fit: cover;\n  object-position: center;\n}\n\n.landing-strip-image-a:hover {\n  object-position: 64% center;\n  filter: contrast(1.03);\n}\n\n.landing-strip-image-b:hover {\n  filter: contrast(1.03);\n}\n\n.landing-strip-image-c:hover {\n  transform: scaleX(-1);\n}\n\n.main-nav {\n  padding: 28px 28px 40px;\n  display: flex;\n  flex-direction: column;\n  justify-content: flex-start;\n  gap: clamp(12px, 1.65vw, 23px);\n}\n\n.main-nav a {\n  display: block;\n  color: #111111;\n  font-size: clamp(34px, 5vw, 76px);\n  font-weight: 900;\n  line-height: 0.88;\n  letter-spacing: -0.055em;\n  text-decoration: none;\n  transition: opacity 120ms ease;\n}\n\n.main-nav a:hover {\n  opacity: 0;\n}\n\n.main-nav a.about-returned {\n  color: #c38de3;\n}\n\n.main-nav a.music-returned {\n  color: #0000ff;\n}\n\n.main-nav a.audiovisual-returned {\n  color: #e45de3;\n}\n\n.main-nav a.sound-code-returned {\n  color: #ace8e7;\n}\n\n.main-nav a.contact-returned {\n  color: #b8d4d3;\n}\n\n.subpage {\n  flex: 1 0 auto;\n  min-height: 0;\n  padding: 28px 28px clamp(44px, 5vw, 68px);\n}\n\n.subpage-back {\n  position: static;\n  display: block;\n  width: clamp(36px, 3.8vw, 55px);\n  height: clamp(22px, 2.3vw, 34px);\n  margin-top: clamp(18px, 1.7vw, 27px);\n  color: #111111;\n  font-size: 0;\n  text-decoration: none;\n  transition: color 100ms ease;\n}\n\n.subpage-back:hover,\n.subpage-back:focus-visible {\n  color: var(--page-accent, #0000ff);\n}\n\n.subpage-back:focus-visible {\n  outline: 2px solid currentColor;\n  outline-offset: 4px;\n}\n\n.subpage-back::before {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 100%;\n  background: currentColor;\n  clip-path: polygon(\n    0 50%,\n    36% 0,\n    36% 33%,\n    100% 33%,\n    100% 67%,\n    36% 67%,\n    36% 100%\n  );\n}\n\n.subpage h1 {\n  max-width: 1400px;\n  font-size: clamp(46px, 7.1vw, 112px);\n  line-height: 0.82;\n  text-transform: uppercase;\n}\n\n.band-section-title {\n  width: fit-content;\n  max-width: 100%;\n  margin: clamp(44px, 5vw, 68px) 0 0;\n  font-size: clamp(46px, 7.1vw, 112px);\n  font-weight: 900;\n  line-height: 0.82;\n  letter-spacing: -0.06em;\n}\n\n.about-copy,\n.subpage-copy {\n  max-width: 1050px;\n  margin-top: clamp(20px, 2.5vw, 34px);\n  padding-bottom: clamp(150px, 16vw, 220px);\n  font-size: clamp(18px, 1.55vw, 24px);\n  line-height: 1.24;\n}\n\n.about-copy p,\n.subpage-copy p {\n  margin: 0 0 1em;\n  text-align: justify;\n  text-align-last: left;\n  text-justify: inter-word;\n}\n\n.band-gallery {\n  position: relative;\n  display: grid;\n  gap: clamp(16px, 2.1vw, 30px);\n  margin-top: clamp(20px, 2.5vw, 34px);\n  margin-bottom: clamp(24px, 2.5vw, 37px);\n}\n\n.aanim-section {\n  position: relative;\n  isolation: isolate;\n}\n\n.aanim-side-label {\n  position: absolute;\n  top: 0;\n  left: calc(min(100%, 1050px) - clamp(32px, 4.5vw, 74px));\n  z-index: 3;\n  width: clamp(52px, 7.5vw, 118px);\n  height: 100%;\n  overflow: hidden;\n  color: #ffffff;\n  font-size: clamp(52px, 6.5vw, 105px);\n  font-weight: 900;\n  line-height: 0.78;\n  letter-spacing: 0;\n  mix-blend-mode: difference;\n  opacity: 0.78;\n  pointer-events: none;\n  user-select: none;\n}\n\n.aanim-side-label span {\n  position: absolute;\n  top: 0;\n  left: 0;\n  display: block;\n  width: max-content;\n  white-space: nowrap;\n  transform: rotate(90deg);\n  transform-origin: left top;\n}\n\n.band-feature {\n  display: grid;\n  gap: 10px;\n}\n\n.band-portrait {\n  position: relative;\n}\n\n.member-credit-line {\n  position: absolute;\n  left: 0;\n  bottom: calc(100% + clamp(2px, 0.3vw, 4px));\n  z-index: 4;\n  min-height: 0;\n  margin: 0;\n  color: #111111;\n  font-size: clamp(18px, 1.7vw, 24px);\n  font-weight: 900;\n  line-height: 1;\n  pointer-events: none;\n}\n\n.band-photo-frame {\n  position: relative;\n  aspect-ratio: 3 / 2;\n  overflow: hidden;\n}\n\n.band-image {\n  display: block;\n  width: 100%;\n  height: auto;\n}\n\n.band-photo-frame .band-image {\n  position: absolute;\n  inset: 0;\n  height: 100%;\n  object-fit: cover;\n}\n\n.member-hotspot {\n  position: absolute;\n  z-index: 2;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  cursor: help;\n}\n\n.member-hotspot:focus-visible {\n  outline: 1px dotted rgba(255, 255, 255, 0.85);\n  outline-offset: 3px;\n}\n\n.member-hotspot.nuria {\n  left: 13%;\n  top: 62%;\n  width: 46%;\n  height: 34%;\n}\n\n.member-hotspot.lucas {\n  left: 58%;\n  top: 40%;\n  width: 39%;\n  height: 32%;\n}\n\n.member-hotspot.nils {\n  left: 4%;\n  top: 24%;\n  width: 15%;\n  height: 46%;\n}\n\n.member-hotspot.nicoline {\n  left: 25%;\n  top: 0;\n  width: 22%;\n  height: 38%;\n}\n\n.member-hotspot.julia {\n  left: 72%;\n  top: 0;\n  width: 28%;\n  height: 28%;\n}\n\n\n.video-link {\n  width: 100%;\n  margin-top: clamp(26px, 3.4vw, 48px);\n  aspect-ratio: 16 / 9;\n}\n\n.video-link {\n  position: relative;\n  display: block;\n  overflow: hidden;\n  color: #ffffff;\n  text-decoration: none;\n}\n\n.video-image {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.video-play {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  display: block;\n  width: clamp(46px, 5.8vw, 78px);\n  aspect-ratio: 1;\n  border: clamp(3px, 0.45vw, 6px) solid currentColor;\n  border-radius: 50%;\n  transform: translate( hild(letter);\n  });\n});\n\nconst swappedImagePairs = new Set();\nconst preloadedHoverSources = new Set();\n\ndocument.querySelectorAll('img[data-hover-src], img[data-hover-group], img[data-hover-options], img[data-swap-pair]').forEach(image => {\n  const originalSource = image.getAttribute('src');\n  const fixedHoverSource = image.dataset.hoverSrc;\n  const hoverGroup = image.dataset.hoverGroup;\n  const swapPair = image.dataset.swapPair;\n  const swapPairImages = swapPair\n    ? [...document.querySelectorAll(`img[data-swap-pair=\"${swapPair}\"]`)]\n    : [];\n  const swapPairSources = swapPairImages.map(pairImage => pairImage.getAttribute('src'));\n  const explicitHoverSources = image.dataset.hoverOptions\n    ? image.dataset.hoverOptions.split(',').map(source => source.trim()).filter(Boolean)\n    : [];\n  const randomHoverSources = explicitHoverSources.length > 0\n    ? explicitHoverSources\n    : hoverGroup\n      ? [...document.querySelectorAll(`img[data-hover-group=\"${hoverGroup}\"]`)]\n        .map(groupImage => groupImage.getAttribute('src'))\n        .filter(source => source && source !== originalSource)\n      : [];\n  const interactionTarget = image.closest('.artwork-item') || image;\n\n  [fixedHoverSource, ...randomHoverSources].filter(Boolean).forEach(source => {\n    if (preloadedHoverSources.has(source)) {\n      return;\n    }\n\n    preloadedHoverSources.add(source);\n    const hoverImage = new Image();\n    hoverImage.src = source;\n  });\n\n  const showHoverImage = () => {\n    if (swapPairImages.length === 2) {\n      if (swappedImagePairs.has(swapPair)) {\n        swapPairImages[0].setAttribute('src', swapPairSources[0]);\n        swapPairImages[1].setAttribute('src', swapPairSources[1]);\n        swappedImagePairs.delete(swapPair);\n        return;\n      }\n\n      swapPairImages[0].setAttribute('src', swapPairSources[1]);\n      swapPairImages[1].setAttribute('src', swapPairSources[0]);\n      swappedImagePairs.add(swapPair);\n      return er]').forEach(player => {\n  const audio = player.querySelector('audio');\n  const toggle = player.querySelector('[data-audio-toggle]');\n  const progress = player.querySelector('[data-audio-progress]');\n  const seek = player.querySelector('[data-audio-seek]');\n  const stepButtons = player.querySelectorAll('[data-audio-step]');\n\n  if (!audio || !toggle || !progress || !seek) {\n    return;\n  }\n\n  const playLabel = toggle.getAttribute('aria-label') || 'Play audio';\n  const pauseLabel = playLabel.replace(/^Play\\b/, 'Pause');\n\n  const syncAudioProgress = () => {\n    const amount = audio.duration ? audio.currentTime / audio.duration : 0;\n    player.style.setProperty('--audio-progress', amount);\n  };\n\n  toggle.addEventListener('click', () => {\n    if (audio.paused) {\n      audio.play();\n    } else {\n      audio.pause();\n    }\n  });\n\n  stepButtons.forEach(button => {\n    button.addEventListener('click', () => {\n      const seconds = Number(button.dataset.audioStep) || 0;\n      audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + seconds));\n    });\n  });\n\n  seek.addEventListener('click', event => {\n    if (!audio.duration) {\n      return;\n    }\n\n    const bounds = seek.getBoundingClientRect();\n    const amount = Math.min(1, Math.max(0, (event.clientX - bounds.left) / bounds.width));\n    audio.currentTime = amount * audio.duration;\n  });\n\n  audio.addEventListener('play', () => {\n    player.classList.add('is-playing');\n    toggle.setAttribute('aria-label', pauseLabel);\n  });\n\n  audio.addEventListener('pause', () => {\n    player.classList.remove('is-playing');\n    toggle.setAttribute('aria-label', playLabel);\n  });\n\n  audio.addEventListener('timeupdate', syncAudioProgress);\n  audio.addEventListener('loadedmetadata', syncAudioProgress);\n  audio.addEventListener('ended', syncAudioProgress);\n});\n\ndocument.querySelectorAll(\n  '.digital-works-page .weather-sound-project, .digital-works-page .digi
