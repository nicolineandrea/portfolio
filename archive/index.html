  <script type="application/json" id="stage-data">{"stages":[{"id":"intro","sourceId":"intro","focus":"","prompt":null,"explanation":null,"html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>Project archive\u003c/title>\u003clink rel=\"stylesheet\" href=\"style.css\">\u003c/head>\n\u003cbody>\u003cmain>\u003ch1>Project archive\u003c/h1>\n\u003cp>This archive brings together selected stages from building my Bands &amp; Live page with Codex. They show examples of my creative workflow: trying out ideas, responding to unexpected results, changing direction and editing things by hand.\u003c/p>\n\u003cp>I also coded parts of the page myself and made manual adjustments along the way.\u003c/p>\n\u003cp>I used 129 prompts.\u003c/p>\n\u003cp>I have shortened the prompt sequence and left out intermediate steps to keep the process easy to follow. This is a selection of moments from the process, rather than the complete prompt history.\u003c/p>\n\u003cp>Click through the stages using the arrows at the bottom, or the left and right arrow keys. Open \u003cstrong>Explanation &amp; Promt\u003c/strong> to read my explanation and the prompt for each stage.\u003c/p>\n\u003cp>The pages are interactive. Move your pointer over the photos, band members, text and artwork to explore the effects as they develop. The selected stages highlight the main interactions and how they shaped the final page.\u003c/p>\n\u003cbutton type=\"button\" id=\"start\">Explore the stages \u003cspan aria-hidden=\"true\">&#8594;\u003c/span>\u003c/button>\n\u003c/main>\u003cscript src=\"script.js\">\u003c/script>\u003c/body>\u003c/html>","styles":"*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}main{max-width:960px;padding:32px;margin:0;text-align:left}h1{font-size:clamp(44px,8vw,92px);line-height:.95;letter-spacing:-.055em;margin:0 0 36px;font-weight:900}p{font-size:clamp(17px,2vw,22px);line-height:1.5;margin:0 0 22px}button{margin-top:12px;background:#171717;color:#fff;border:2px solid #171717;padding:14px 20px;font:700 18px Arial,sans-serif;cursor:pointer}button:hover{background:#fff;color:#171717}button:focus-visible{outline:3px solid blue;outline-offset:4px}","script":"document.getElementById('start').addEventListener('click', () => { parent.postMessage({ type:'bands-navigation', key:'ArrowRight' }, '*'); });"},{"id":"codex-original","page":"codex-original/index.html","prompt":"Design a standalone Bands & Live page for AANIM and Kim.a using the supplied photographs, artwork and project information. Choose the layout, typography, colours and interactions to suit the style of the photos and artwork. Use the supplied links for all relevant content.","explanation":"This is a shortened version of the prompt I gave Codex, together with a folder containing all the information it needed."},{"id":"015","sourceId":"015","focus":"","prompt":"Create a large, bold black title that reads “Bands & Live” in a neutral sans-serif typeface in the top-left corner. Add three photos from the AANIM folder directly below the title. Make the photos as wide as the title.","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"de\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Bands &amp; Live — Nicoline Andrea\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody class=\"music-page\">\n  \u003cmain class=\"subpage\">\n    \u003ch1 class=\"interactive-title\">Bands &amp; Live\u003c/h1>\n\n    \u003cdiv class=\"band-gallery music-media\">\n      \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-62-_K5A0140-Bearbeitet.jpg.jpg\" alt=\"AANIM band photograph\">\n      \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-520-_K5A0215.jpg.jpg\" alt=\"AANIM band photograph\">\n      \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-290-_K5A0477-Bearbeitet-2.jpg.jpg\" alt=\"AANIM band photograph\">\n    \u003c/div>\n\n    \u003cdiv class=\"subpage-copy\">\n      \u003cp>AANIM is my band. We have already released two albums: \u003ccite>Contemplation / Remedy\u003c/cite> and \u003ccite>Fuormas Neras\u003c/cite>.\u003c/p>\n\n      \u003cp>Orange-red sky on an icy afternoon, trying to escape the darkness of time—like a deep diver surrounded by a glowing blur, like a sunny Sunday driven by a heavy hangover. It’s chaotic but beautiful: a mix of intensity and calm, with a style that brings to mind bands like Radiohead, Kush K, and elements of Parcels.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"video-embed music-media\">\n      \u003ciframe\n        src=\"https://www.youtube-nocookie.com/embed/ehqON-5_tG4?start=8\"\n        title=\"AANIM video\"\n        loading=\"lazy\"\n        referrerpolicy=\"strict-origin-when-cross-origin\"\n        allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\"\n        allowfullscreen>\n      \u003c/iframe>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cdiv class=\"about-frame-actions\">\n    \u003ca class=\"subpage-back\" href=\"../../index.html\" target=\"_top\" aria-label=\"Zurück zu den Themen\">←\u003c/a>\n  \u003c/div>\n  \u003cscript src=\"script.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","styles":"* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  background: #ffffff;\n  color: #111111;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\nheader {\n  position: relative;\n  min-height: 100vh;\n  min-height: 100svh;\n  padding: 32px;\n  overflow: hidden;\n}\n\nh1 {\n  margin: 0;\n  font-size: clamp(56px, 13vw, 180px);\n  font-weight: 900;\n  line-height: 0.74;\n  letter-spacing: -0.06em;\n}\n\nh1 > .word {\n  display: block;\n  white-space: nowrap;\n}\n\n.letter {\n  display: inline-block;\n  transition: opacity 100ms ease;\n}\n\n.letter:hover {\n  opacity: 0;\n}\n\n.title-word {\n  display: inline-block;\n  white-space: nowrap;\n}\n\n.mic-control {\n  position: absolute;\n  right: 32px;\n  bottom: 32px;\n  left: 32px;\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n  gap: 10px;\n}\n\n.mic-toggle {\n  align-self: flex-start;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 2vw, 28px);\n  font-weight: 900;\n  cursor: pointer;\n}\n\n.mic-toggle:disabled {\n  cursor: wait;\n  opacity: 0.45;\n}\n\n.mic-meter {\n  position: relative;\n  height: clamp(72px, 9vw, 120px);\n  overflow: hidden;\n}\n\n.mic-wave {\n  position: absolute;\n  inset: 0;\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n\n.main-nav {\n  min-height: 100vh;\n  min-height: 100svh;\n  padding: 32px 32px 48px;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  gap: clamp(12px, 2vh, 28px);\n}\n\n.main-nav a {\n  display: block;\n  color: #111111;\n  font-size: clamp(34px, 6vw, 92px);\n  font-weight: 900;\n  line-height: 0.88;\n  letter-spacing: -0.055em;\n  text-decoration: none;\n  transition: opacity 120ms ease;\n}\n\n.main-nav a:hover {\n  opacity: 0;\n}\n\n.main-nav a.about-returned {\n  color: transparent;\n}\n\n.subpage {\n  min-height: 100vh;\n  padding: 32px;\n}\n\n.subpage-back {\n  position: fixed;\n  right: 32px;\n  bottom: 24px;\n  z-index: 10;\n  display: block;\n  width: clamp(72px, 9vw, 130px);\n  height: clamp(44px, 5.5vw, 80px);\n  color: #111111;\n  font-size: 0;\n  text-decoration: none;\n  transition: opacity 100ms ease;\n}\n\n.subpage-back:hover {\n  opacity: 0;\n}\n\n.subpage-back::before {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 100%;\n  background: currentColor;\n  clip-path: polygon(\n    0 50%,\n    36% 0,\n    36% 33%,\n    100% 33%,\n    100% 67%,\n    36% 67%,\n    36% 100%\n  );\n}\n\n.subpage h1 {\n  max-width: 1400px;\n  font-size: clamp(46px, 8.5vw, 136px);\n  line-height: 0.82;\n}\n\n.about-copy,\n.subpage-copy {\n  max-width: 1050px;\n  margin-top: clamp(20px, 3vw, 40px);\n  padding-bottom: clamp(180px, 20vw, 260px);\n  font-size: clamp(18px, 1.8vw, 27px);\n  line-height: 1.24;\n}\n\n.about-copy p,\n.subpage-copy p {\n  margin: 0 0 1em;\n}\n\n.band-gallery {\n  display: grid;\n  gap: clamp(16px, 2.5vw, 36px);\n  margin-top: clamp(20px, 3vw, 40px);\n  margin-bottom: clamp(24px, 3vw, 44px);\n}\n\n.band-image {\n  display: block;\n  width: 100%;\n  height: auto;\n}\n\n.video-embed {\n  width: 100%;\n  margin-top: clamp(28px, 4vw, 56px);\n  aspect-ratio: 16 / 9;\n}\n\n.video-embed iframe {\n  display: block;\n  width: 100%;\n  height: 100%;\n  border: 0;\n}\n\n.about-page,\n.music-page {\n  --about-accent: transparent;\n  --about-frame-gutter: clamp(20px, 3.2vw, 48px);\n  --about-frame-max: 1400px;\n}\n\n.about-page .subpage,\n.music-page .subpage,\n.about-frame-actions {\n  width: min(\n    calc(100% - var(--about-frame-gutter) - var(--about-frame-gutter)),\n    var(--about-frame-max)\n  );\n  margin-inline: auto;\n}\n\n.about-page .subpage,\n.music-page .subpage {\n  padding: var(--about-frame-gutter) 0;\n}\n\n.music-page .subpage h1 {\n  width: fit-content;\n  max-width: 100%;\n}\n\n.music-page .subpage-copy {\n  width: min(100%, var(--music-title-width, 1050px));\n  max-width: none;\n  margin-top: 0;\n  padding-bottom: 0;\n}\n\n.music-media {\n  width: min(100%, var(--music-title-width, 1050px));\n}\n\n.music-page .video-embed {\n  margin-bottom: clamp(120px, 14vw, 190px);\n}\n\n.about-frame-actions {\n  position: fixed;\n  right: 0;\n  bottom: clamp(16px, 2vw, 32px);\n  left: 0;\n  z-index: 12;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  justify-content: flex-start;\n  gap: clamp(10px, 1vw, 16px);\n  pointer-events: none;\n}\n\n.about-page .subpage-back,\n.music-page .subpage-back,\n.about-page .drawing-controls {\n  position: static;\n  pointer-events: auto;\n}\n\n.about-page .subpage-back,\n.music-page .subpage-back {\n  width: clamp(36px, 4.5vw, 65px);\n  height: clamp(22px, 2.75vw, 40px);\n  margin-top: 0;\n}\n\n.about-page .drawing-controls {\n  flex: 0 1 auto;\n}\n\n.about-word,\n.keyword {\n  color: #111111;\n  transition: color 100ms ease;\n}\n\n.about-copy .keyword {\n  text-decoration: none;\n}\n\n.future-link {\n  color: #111111;\n  text-decoration-line: none;\n  text-decoration-color: #111111;\n  text-decoration-thickness: 0.08em;\n  text-underline-offset: 0.14em;\n  transition: color 100ms ease;\n}\n\n.future-link.is-visited {\n  text-decoration-line: underline;\n  text-decoration-color: #111111;\n}\n\n.future-link:hover,\n.future-link:focus-visible {\n  color: var(--about-accent);\n  text-decoration-line: underline;\n  text-decoration-color: var(--about-accent);\n}\n\n.future-link:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-word:hover,\n.keyword:hover,\n.keyword.is-discovered,\n.keyword:focus-visible {\n  color: var(--about-accent);\n}\n\n.keyword:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-drawing {\n  position: absolute;\n  top: 0;\n  left: 0;\n  z-index: 0;\n  display: block;\n  pointer-events: none;\n}\n\n.about-page .subpage {\n  position: relative;\n  z-index: 1;\n}\n\n.drawing-controls {\n  position: fixed;\n  bottom: 32px;\n  left: 32px;\n  z-index: 12;\n  display: flex;\n  align-items: center;\n  gap: 18px;\n}\n\n.drawing-controls button {\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 2vw, 28px);\n  font-weight: 900;\n  cursor: pointer;\n  transition: color 100ms ease;\n}\n\n.drawing-controls button[hidden] {\n  display: none;\n}\n\n.drawing-controls button:hover,\n.drawing-controls button:focus-visible,\n.drawing-toggle[aria-pressed=\"true\"] {\n  color: var(--about-accent);\n}\n\n.drawing-controls button:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.drawing-controls button:disabled {\n  color: #aaaaaa;\n  cursor: default;\n}\n\n.about-page.is-drawing,\n.about-page.is-drawing * {\n  cursor: crosshair;\n  user-select: none;\n}\n\n.about-page.is-drawing {\n  touch-action: none;\n}\n\n.about-page.is-drawing a,\n.about-page.is-drawing button {\n  cursor: pointer;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 20px;\n  }\n\n  .mic-control {\n    right: 20px;\n    bottom: 20px;\n    left: 20px;\n    gap: 10px;\n  }\n\n  .main-nav {\n    padding: 20px;\n  }\n\n  .subpage {\n    padding: 20px;\n  }\n\n  .subpage-back {\n    right: 20px;\n    bottom: 16px;\n  }\n\n  .drawing-controls {\n    bottom: 20px;\n    left: 20px;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .letter,\n  .main-nav a,\n  .subpage-back,\n  .about-word,\n  .keyword,\n  .future-link,\n  .drawing-controls button {\n    transition: none;\n  }\n\n}\n\nmain.subpage > :not(h1, .band-gallery), body.music-page .subpage-back { display:none !important } .band-gallery { grid-template-columns:repeat(3,minmax(0,1fr)); align-items:start }h1 .letter, h2 .letter { pointer-events:none }","script":"document.querySelectorAll('h1 .word').forEach(word => {\n  const text = word.textContent;\n  word.setAttribute('aria-label', text);\n  word.textContent = '';\n\n  [...text].forEach(character => {\n    const letter = document.createElement('span');\n    letter.className = 'letter';\n    letter.setAttribute('aria-hidden', 'true');\n    letter.textContent = character;\n    word.appendChild(letter);\n  });\n});\n\ndocument.querySelectorAll('.interactive-title').forEach(title => {\n  const words = title.textContent.trim().split(/\\s+/);\n  const fullTitle = words.join(' ');\n\n  title.setAttribute('aria-label', fullTitle);\n  title.textContent = '';\n\n  words.forEach((word, wordIndex) => {\n    const wordElement = document.createElement('span');\n    wordElement.className = 'title-word';\n    wordElement.setAttribute('aria-hidden', 'true');\n\n    [...word].forEach(character => {\n      const letter = document.createElement('span');\n      letter.className = 'letter';\n      letter.textContent = character;\n      wordElement.appendChild(letter);\n    });\n\n    title.appendChild(wordElement);\n    if (wordIndex \u003c words.length - 1) {\n      title.appendChild(document.createTextNode(' '));\n    }\n  });\n});\n\nconst musicPage = document.querySelector('.music-page');\nconst musicTitle = musicPage?.querySelector('.interactive-title');\n\nif (musicPage && musicTitle) {\n  const syncMusicMediaWidth = () => {\n    musicPage.style.setProperty(\n      '--music-title-width',\n      `${Math.ceil(musicTitle.getBoundingClientRect().width)}px`\n    );\n  };\n\n  syncMusicMediaWidth();\n  window.addEventListener('resize', syncMusicMediaWidth);\n  document.fonts?.ready.then(syncMusicMediaWidth);\n}\n\nconst mainNav = document.querySelector('.main-nav');\nconst navigationEntry = performance.getEntriesByType?.('navigation')[0];\nconst isPageReload = navigationEntry\n  ? navigationEntry.type === 'reload'\n  : performance.navigation?.type === 1;\n\nif (mainNav && isPageReload) {\n  if (window.location.hash) {\n    history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);\n  }\n\n  const returnToPageTop = () => {\n    requestAnimationFrame(() => window.scrollTo(0, 0));\n  };\n\n  returnToPageTop();\n  window.addEventListener('pageshow', returnToPageTop, { once: true });\n}\n\nconst aboutNavLink = document.querySelector('.main-nav a[href=\"about.html\"]');\n\nfunction markAboutReturn() {\n  if (!aboutNavLink) {\n    return;\n  }\n\n  try {\n    if (sessionStorage.getItem('returning-from-about') === 'true') {\n      aboutNavLink.classList.add('about-returned');\n      sessionStorage.removeItem('returning-from-about');\n    }\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n}\n\nif (document.body.classList.contains('about-page')) {\n  try {\n    sessionStorage.setItem('returning-from-about', 'true');\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n} else {\n  markAboutReturn();\n  window.addEventListener('pageshow', markAboutReturn);\n}\n\nconst micToggle = document.querySelector('.mic-toggle');\n\nif (micToggle) {\n  const micMeter = document.querySelector('.mic-meter');\n  const micWave = document.querySelector('.mic-wave');\n  const micWaveContext = micWave.getContext('2d');\n  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');\n\n  let audioContext;\n  let microphoneStream;\n  let microphoneAnimation;\n  let microphoneActive = false;\n  let displayedLevel = 0;\n  let displayedBrightness = 0.2;\n  let texturePhase = 0;\n  let lastVisualUpdate = 0;\n  const recordingHistory = [];\n\n  function clamp(value, minimum, maximum) {\n    return Math.min(Math.max(value, minimum), maximum);\n  }\n\n  function calculateBrightness(frequencyData) {\n    let magnitudeTotal = 0;\n    let weightedFrequency = 0;\n    const nyquist = audioContext.sampleRate / 2;\n\n    for (let index = 1; index \u003c frequencyData.length; index++) {\n      const magnitude = frequencyData[index];\n      const frequency = index / frequencyData.length * nyquist;\n      magnitudeTotal += magnitude;\n      weightedFrequency += frequency * magnitude;\n    }\n\n    if (magnitudeTotal === 0) {\n      return 0.15;\n    }\n\n    const centroid = weightedFrequency / magnitudeTotal;\n    return clamp((centroid - 250) / 3200, 0, 1);\n  }\n\n  function calculateSampleTexture(samples) {\n    const quarter = Math.floor(samples.length / 4);\n    const texture = (\n      samples[quarter] -\n      samples[quarter * 2] +\n      samples[quarter * 3]\n    ) * 1.5;\n\n    return clamp(texture, -1, 1);\n  }\n\n  function drawWaveSide(direction, center, height, spacing) {\n    if (recordingHistory.length === 0) {\n      return;\n    }\n\n    const points = recordingHistory.map((entry, index) => ({\n      x: index * spacing,\n      y: center + direction * entry.level * height * 0.43\n    }));\n\n    micWaveContext.beginPath();\n    micWaveContext.moveTo(points[0].x, points[0].y);\n\n    for (let index = 1; index \u003c points.length; index++) {\n      const previous = points[index - 1];\n      const current = points[index];\n      const midpointX = (previous.x + current.x) / 2;\n      const midpointY = (previous.y + current.y) / 2;\n      micWaveContext.quadraticCurveTo(previous.x, previous.y, midpointX, midpointY);\n    }\n\n    const finalPoint = points[points.length - 1];\n    micWaveContext.lineTo(finalPoint.x, finalPoint.y);\n    micWaveContext.stroke();\n  }\n\n  function drawRecordingLine() {\n    const width = micWave.clientWidth;\n    const height = micWave.clientHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    const canvasWidth = Math.round(width * pixelRatio);\n    const canvasHeight = Math.round(height * pixelRatio);\n\n    if (width === 0 || height === 0) {\n      return;\n    }\n\n    if (micWave.width !== canvasWidth || micWave.height !== canvasHeight) {\n      micWave.width = canvasWidth;\n      micWave.height = canvasHeight;\n    }\n\n    const spacing = reducedMotion.matches ? 8 : 4;\n    const maximumPoints = Math.ceil(width / spacing) + 1;\n\n    while (recordingHistory.length > maximumPoints) {\n      recordingHistory.shift();\n    }\n\n    micWaveContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    micWaveContext.clearRect(0, 0, width, height);\n    micWaveContext.lineWidth = 1.35;\n    micWaveContext.lineCap = 'round';\n    micWaveContext.lineJoin = 'round';\n    micWaveContext.strokeStyle = '#111111';\n\n    const center = height / 2;\n    drawWaveSide(-1, center, height, spacing);\n    drawWaveSide(1, center, height, spacing);\n\n    if (microphoneActive && recordingHistory.length > 0) {\n      const newestIndex = recordingHistory.length - 1;\n      const newestLevel = recordingHistory[newestIndex].level;\n      const newestX = newestIndex * spacing;\n      const upperY = center - newestLevel * height * 0.43;\n      const lowerY = center + newestLevel * height * 0.43;\n\n      micWaveContext.beginPath();\n      micWaveContext.moveTo(newestX, upperY);\n      micWaveContext.lineTo(newestX, lowerY);\n      micWaveContext.stroke();\n    }\n  }\n\n  function updateMicrophone(analyser, samples, frequencyData, timestamp) {\n    analyser.getFloatTimeDomainData(samples);\n    analyser.getByteFrequencyData(frequencyData);\n\n    let sum = 0;\n    for (const sample of samples) {\n      sum += sample * sample;\n    }\n\n    const rms = Math.sqrt(sum / samples.length);\n    const targetLevel = Math.min(1, Math.max(0, rms - 0.005) * 17);\n    const targetBrightness = rms > 0.01\n      ? calculateBrightness(frequencyData)\n      : 0.15;\n    const levelResponse = targetLevel > displayedLevel ? 0.13 : 0.04;\n\n    displayedLevel += (targetLevel - displayedLevel) * levelResponse;\n    displayedBrightness += (targetBrightness - displayedBrightness) * 0.04;\n    micMeter.setAttribute('aria-valuenow', String(Math.round(displayedLevel * 100)));\n\n    const visualInterval = reducedMotion.matches ? 180 : 40;\n    if (timestamp - lastVisualUpdate >= visualInterval) {\n      const sampleTexture = calculateSampleTexture(samples);\n      texturePhase += reducedMotion.matches\n        ? 0.06\n        : 0.12 + displayedBrightness * 0.16;\n      const frequencyTexture = Math.sin(texturePhase) * (\n        0.01 + displayedBrightness * 0.02\n      );\n      const organicTexture = sampleTexture * 0.02;\n      const texturedLevel = clamp(\n        displayedLevel * (1 + frequencyTexture + organicTexture),\n        0,\n        1\n      );\n\n      recordingHistory.push({ level: texturedLevel });\n      drawRecordingLine();\n      lastVisualUpdate = timestamp;\n    }\n\n    microphoneAnimation = requestAnimationFrame(nextTimestamp => {\n      updateMicrophone(analyser, samples, frequencyData, nextTimestamp);\n    });\n  }\n\n  async function startMicrophone() {\n    if (!navigator.mediaDevices?.getUserMedia) {\n      micToggle.textContent = 'MIC UNAVAILABLE';\n      return;\n    }\n\n    micToggle.disabled = true;\n\n    try {\n      microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n\n      if (!AudioContextClass) {\n        throw new Error('Web Audio is unavailable');\n      }\n\n      audioContext = new AudioContextClass();\n      await audioContext.resume();\n\n      const source = audioContext.createMediaStreamSource(microphoneStream);\n      const analyser = audioContext.createAnalyser();\n\n      analyser.fftSize = 2048;\n      analyser.smoothingTimeConstant = 0.88;\n      const samples = new Float32Array(analyser.fftSize);\n      const frequencyData = new Uint8Array(analyser.frequencyBinCount);\n      source.connect(analyser);\n\n      microphoneActive = true;\n      lastVisualUpdate = 0;\n      micToggle.textContent = 'SOUND OFF';\n      microphoneAnimation = requestAnimationFrame(timestamp => {\n        updateMicrophone(analyser, samples, frequencyData, timestamp);\n      });\n    } catch (error) {\n      microphoneStream?.getTracks().forEach(track => track.stop());\n      microphoneStream = undefined;\n      await audioContext?.close().catch(() => {});\n      audioContext = undefined;\n      microphoneActive = false;\n      micToggle.textContent = 'MIC DENIED';\n    } finally {\n      micToggle.disabled = false;\n    }\n  }\n\n  async function stopMicrophone() {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n    await audioContext?.close().catch(() => {});\n\n    microphoneStream = undefined;\n    audioContext = undefined;\n    microphoneActive = false;\n    displayedLevel = 0;\n    micMeter.setAttribute('aria-valuenow', '0');\n    micToggle.textContent = 'SOUND ON';\n    drawRecordingLine();\n  }\n\n  micToggle.addEventListener('click', () => {\n    if (microphoneActive) {\n      stopMicrophone();\n    } else {\n      startMicrophone();\n    }\n  });\n\n  window.addEventListener('keydown', event => {\n    const target = event.target;\n    const isEditable = target instanceof HTMLElement && (\n      target.isContentEditable ||\n      target.tagName === 'INPUT' ||\n      target.tagName === 'TEXTAREA' ||\n      target.tagName === 'SELECT'\n    );\n\n    if (event.code !== 'Space' || event.repeat || isEditable) {\n      return;\n    }\n\n    event.preventDefault();\n    if (!micToggle.disabled) {\n      micToggle.click();\n    }\n  });\n\n  window.addEventListener('resize', drawRecordingLine);\n  window.addEventListener('pagehide', () => {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n  });\n}\n\nconst drawingCanvas = document.querySelector('.about-drawing');\n\nif (drawingCanvas) {\n  document.querySelectorAll('.about-copy p').forEach(paragraph => {\n    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n    const textNodes = [];\n\n    while (walker.nextNode()) {\n      if (!walker.currentNode.parentElement.closest('.keyword, .future-link')) {\n        textNodes.push(walker.currentNode);\n      }\n    }\n\n    textNodes.forEach(textNode => {\n      const fragment = document.createDocumentFragment();\n      const parts = textNode.textContent.split(/(\\s+)/);\n\n      parts.forEach(part => {\n        if (!part || /^\\s+$/.test(part)) {\n          fragment.appendChild(document.createTextNode(part));\n          return;\n        }\n\n        const word = document.createElement('span');\n        word.className = 'about-word';\n        word.textContent = part;\n        fragment.appendChild(word);\n      });\n\n      textNode.replaceWith(fragment);\n    });\n  });\n\n  document.querySelector('.about-copy').addEventListener('pointerover', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  document.querySelector('.about-copy').addEventListener('focusin', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  const drawingContext = drawingCanvas.getContext('2d');\n  const drawingToggle = document.querySelector('.drawing-toggle');\n  const drawingClear = document.querySelector('.drawing-clear');\n  const aboutPage = document.querySelector('.about-page');\n  const aboutContent = document.querySelector('.subpage');\n  const strokes = [];\n\n  let drawingEnabled = false;\n  let activePointer = null;\n  let activeStroke = null;\n  let canvasWidth = 0;\n  let canvasHeight = 0;\n  let resizeFrame;\n\n  function configureDrawingContext() {\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    drawingContext.lineWidth = 5;\n    drawingContext.lineCap = 'round';\n    drawingContext.lineJoin = 'round';\n    drawingContext.strokeStyle = getComputedStyle(aboutPage)\n      .getPropertyValue('--about-accent').trim() || '#ff34b3';\n  }\n\n  function renderDrawing() {\n    drawingContext.clearRect(0, 0, canvasWidth, canvasHeight);\n    configureDrawingContext();\n\n    strokes.forEach(stroke => {\n      if (stroke.length === 0) {\n        return;\n      }\n\n      drawingContext.beginPath();\n      drawingContext.moveTo(stroke[0].x, stroke[0].y);\n\n      if (stroke.length === 1) {\n        drawingContext.lineTo(stroke[0].x + 0.01, stroke[0].y + 0.01);\n      } else {\n        stroke.slice(1).forEach(point => {\n          drawingContext.lineTo(point.x, point.y);\n        });\n      }\n\n      drawingContext.stroke();\n    });\n  }\n\n  function resizeDrawingCanvas() {\n    const nextWidth = Math.max(document.documentElement.scrollWidth, window.innerWidth);\n    const nextHeight = Math.max(document.documentElement.scrollHeight, window.innerHeight);\n\n    if (nextWidth === canvasWidth && nextHeight === canvasHeight) {\n      return;\n    }\n\n    if (canvasWidth && canvasHeight) {\n      const scaleX = nextWidth / canvasWidth;\n      const scaleY = nextHeight / canvasHeight;\n\n      strokes.forEach(stroke => {\n        stroke.forEach(point => {\n          point.x *= scaleX;\n          point.y *= scaleY;\n        });\n      });\n    }\n\n    canvasWidth = nextWidth;\n    canvasHeight = nextHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingCanvas.width = Math.round(canvasWidth * pixelRatio);\n    drawingCanvas.height = Math.round(canvasHeight * pixelRatio);\n    drawingCanvas.style.width = `${canvasWidth}px`;\n    drawingCanvas.style.height = `${canvasHeight}px`;\n    renderDrawing();\n  }\n\n  function scheduleCanvasResize() {\n    cancelAnimationFrame(resizeFrame);\n    resizeFrame = requestAnimationFrame(resizeDrawingCanvas);\n  }\n\n  function isControl(target) {\n    return target instanceof Element && Boolean(target.closest(\n      'a, button, input, textarea, select, [contenteditable=\"true\"]'\n    ));\n  }\n\n  function addDrawingPoint(event) {\n    const events = event.getCoalescedEvents?.() || [event];\n\n    events.forEach(pointerEvent => {\n      activeStroke.push({ x: pointerEvent.pageX, y: pointerEvent.pageY });\n    });\n\n    renderDrawing();\n  }\n\n  function finishStroke(event) {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    activePointer = null;\n    activeStroke = null;\n    drawingClear.disabled = strokes.length === 0;\n    drawingClear.hidden = strokes.length === 0;\n  }\n\n  drawingToggle.addEventListener('click', () => {\n    drawingEnabled = !drawingEnabled;\n    activePointer = null;\n    activeStroke = null;\n    aboutPage.classList.toggle('is-drawing', drawingEnabled);\n    drawingToggle.setAttribute('aria-pressed', String(drawingEnabled));\n    drawingToggle.textContent = drawingEnabled ? 'DRAW OFF' : 'DRAW ON';\n    drawingClear.hidden = !drawingEnabled || strokes.length === 0;\n  });\n\n  drawingClear.addEventListener('click', () => {\n    strokes.length = 0;\n    activePointer = null;\n    activeStroke = null;\n    drawingClear.disabled = true;\n    drawingClear.hidden = true;\n    renderDrawing();\n  });\n\n  document.addEventListener('pointerdown', event => {\n    if (!drawingEnabled || activePointer !== null || isControl(event.target)) {\n      return;\n    }\n\n    if (event.pointerType === 'mouse' && event.button !== 0) {\n      return;\n    }\n\n    event.preventDefault();\n    activePointer = event.pointerId;\n    activeStroke = [];\n    strokes.push(activeStroke);\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointermove', event => {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    event.preventDefault();\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointerup', finishStroke, { capture: true });\n  document.addEventListener('pointercancel', finishStroke, { capture: true });\n  window.addEventListener('resize', scheduleCanvasResize);\n\n  if ('ResizeObserver' in window && aboutContent) {\n    new ResizeObserver(scheduleCanvasResize).observe(aboutContent);\n  }\n\n  document.fonts?.ready.then(scheduleCanvasResize);\n  resizeDrawingCanvas();\n}\n","explanation":"I did not like the first result. It had a generic AI-generated look, some images were flipped, and the arrangement of the photos and artwork felt inconsistent. I decided to describe what I wanted more specifically, starting with a bold title and large photos. I liked the large images and wanted to keep working with them, but I had not clearly said that they should be stacked vertically."},{"id":"020","sourceId":"020","focus":"","prompt":"Make the photos as wide as the title and stack them vertically. Invert the colours of each photo when the pointer hovers over it.","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"de\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Bands &amp; Live — Nicoline Andrea\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody class=\"music-page\">\n  \u003cmain class=\"subpage\">\n    \u003ch1 class=\"interactive-title\">Bands &amp; Live\u003c/h1>\n\n    \u003cdiv class=\"band-gallery music-media\">\n      \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-62-_K5A0140-Bearbeitet.jpg.jpg\" alt=\"AANIM band photograph\">\n      \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-520-_K5A0215.jpg.jpg\" alt=\"AANIM band photograph\">\n      \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-290-_K5A0477-Bearbeitet-2.jpg.jpg\" alt=\"AANIM band photograph\">\n    \u003c/div>\n\n    \u003cdiv class=\"subpage-copy\">\n      \u003cp>\u003ca class=\"band-link\" href=\"https://www.aanim.net/\" target=\"_blank\" rel=\"noopener noreferrer\">AANIM\u003c/a> is my band. We have already released two albums: \u003ccite class=\"album-title\" tabindex=\"0\">Contemplation / Remedy\u003c/cite> and \u003ccite class=\"album-title\" tabindex=\"0\">Fuormas Neras\u003c/cite>.\u003c/p>\n\n      \u003cp>Orange-red sky on an icy afternoon, trying to escape the darkness of time—like a deep diver surrounded by a glowing blur, like a sunny Sunday driven by a heavy hangover. It’s chaotic but beautiful: a mix of intensity and calm, with a style that brings to mind bands like Radiohead, Kush K, and elements of Parcels.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"video-embed music-media\">\n      \u003ciframe\n        src=\"https://www.youtube-nocookie.com/embed/ehqON-5_tG4?start=8\"\n        title=\"AANIM video\"\n        loading=\"lazy\"\n        referrerpolicy=\"strict-origin-when-cross-origin\"\n        allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\"\n        allowfullscreen>\n      \u003c/iframe>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cdiv class=\"about-frame-actions\">\n    \u003ca class=\"subpage-back\" href=\"../../index.html\" target=\"_top\" aria-label=\"Zurück zu den Themen\">←\u003c/a>\n  \u003c/div>\n  \u003cscript src=\"script.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","styles":"* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  background: #ffffff;\n  color: #111111;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\nheader {\n  position: relative;\n  min-height: 100vh;\n  min-height: 100svh;\n  padding: 32px;\n  overflow: hidden;\n}\n\nh1 {\n  margin: 0;\n  font-size: clamp(56px, 13vw, 180px);\n  font-weight: 900;\n  line-height: 0.74;\n  letter-spacing: -0.06em;\n}\n\nh1 > .word {\n  display: block;\n  white-space: nowrap;\n}\n\n.letter {\n  display: inline-block;\n  transition: opacity 100ms ease;\n}\n\n.letter:hover {\n  opacity: 0;\n}\n\n.title-word {\n  display: inline-block;\n  white-space: nowrap;\n}\n\n.mic-control {\n  position: absolute;\n  right: 32px;\n  bottom: 32px;\n  left: 32px;\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n  gap: 10px;\n}\n\n.mic-toggle {\n  align-self: flex-start;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 2vw, 28px);\n  font-weight: 900;\n  cursor: pointer;\n}\n\n.mic-toggle:disabled {\n  cursor: wait;\n  opacity: 0.45;\n}\n\n.mic-meter {\n  position: relative;\n  height: clamp(72px, 9vw, 120px);\n  overflow: hidden;\n}\n\n.mic-wave {\n  position: absolute;\n  inset: 0;\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n\n.main-nav {\n  min-height: 100vh;\n  min-height: 100svh;\n  padding: 32px 32px 48px;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  gap: clamp(12px, 2vh, 28px);\n}\n\n.main-nav a {\n  display: block;\n  color: #111111;\n  font-size: clamp(34px, 6vw, 92px);\n  font-weight: 900;\n  line-height: 0.88;\n  letter-spacing: -0.055em;\n  text-decoration: none;\n  transition: opacity 120ms ease;\n}\n\n.main-nav a:hover {\n  opacity: 0;\n}\n\n.main-nav a.about-returned {\n  color: transparent;\n}\n\n.main-nav a.music-returned {\n  color: #0000ff;\n}\n\n.subpage {\n  min-height: 100vh;\n  padding: 32px;\n}\n\n.subpage-back {\n  position: fixed;\n  right: 32px;\n  bottom: 24px;\n  z-index: 10;\n  display: block;\n  width: clamp(72px, 9vw, 130px);\n  height: clamp(44px, 5.5vw, 80px);\n  color: #111111;\n  font-size: 0;\n  text-decoration: none;\n  transition: opacity 100ms ease;\n}\n\n.subpage-back:hover {\n  opacity: 0;\n}\n\n.subpage-back::before {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 100%;\n  background: currentColor;\n  clip-path: polygon(\n    0 50%,\n    36% 0,\n    36% 33%,\n    100% 33%,\n    100% 67%,\n    36% 67%,\n    36% 100%\n  );\n}\n\n.subpage h1 {\n  max-width: 1400px;\n  font-size: clamp(46px, 8.5vw, 136px);\n  line-height: 0.82;\n}\n\n.about-copy,\n.subpage-copy {\n  max-width: 1050px;\n  margin-top: clamp(20px, 3vw, 40px);\n  padding-bottom: clamp(180px, 20vw, 260px);\n  font-size: clamp(18px, 1.8vw, 27px);\n  line-height: 1.24;\n}\n\n.about-copy p,\n.subpage-copy p {\n  margin: 0 0 1em;\n  text-align: justify;\n  text-align-last: left;\n  text-justify: inter-word;\n}\n\n.band-gallery {\n  display: grid;\n  gap: clamp(16px, 2.5vw, 36px);\n  margin-top: clamp(20px, 3vw, 40px);\n  margin-bottom: clamp(24px, 3vw, 44px);\n}\n\n.band-image {\n  display: block;\n  width: 100%;\n  height: auto;\n  transition: filter 140ms ease;\n}\n\n.band-image:hover {\n  filter: invert(1);\n}\n\n.video-embed {\n  width: 100%;\n  margin-top: clamp(28px, 4vw, 56px);\n  aspect-ratio: 16 / 9;\n}\n\n.video-embed iframe {\n  display: block;\n  width: 100%;\n  height: 100%;\n  border: 0;\n}\n\n.about-page,\n.music-page {\n  --about-accent: transparent;\n  --about-frame-gutter: clamp(20px, 3.2vw, 48px);\n  --about-frame-max: 1400px;\n}\n\n.about-page .subpage,\n.music-page .subpage,\n.about-frame-actions {\n  width: min(\n    calc(100% - var(--about-frame-gutter) - var(--about-frame-gutter)),\n    var(--about-frame-max)\n  );\n  margin-inline: auto;\n}\n\n.about-page .subpage,\n.music-page .subpage {\n  padding: var(--about-frame-gutter) 0;\n}\n\n.about-page .subpage h1,\n.music-page .subpage h1 {\n  width: fit-content;\n  max-width: 100%;\n}\n\n.about-page .about-copy {\n  width: min(100%, var(--about-title-width, 1050px));\n  max-width: none;\n}\n\n.music-page .subpage-copy {\n  width: min(100%, var(--music-title-width, 1050px));\n  max-width: none;\n  margin-top: 0;\n  padding-bottom: 0;\n}\n\n.music-media {\n  width: min(100%, var(--music-title-width, 1050px));\n}\n\n.music-page .video-embed {\n  margin-bottom: clamp(120px, 14vw, 190px);\n}\n\n.about-frame-actions {\n  position: fixed;\n  right: 0;\n  bottom: clamp(16px, 2vw, 32px);\n  left: 0;\n  z-index: 12;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  justify-content: flex-start;\n  gap: clamp(10px, 1vw, 16px);\n  pointer-events: none;\n}\n\n.about-page .subpage-back,\n.music-page .subpage-back,\n.about-page .drawing-controls {\n  position: static;\n  pointer-events: auto;\n}\n\n.about-page .subpage-back,\n.music-page .subpage-back {\n  width: clamp(36px, 4.5vw, 65px);\n  height: clamp(22px, 2.75vw, 40px);\n  margin-top: 0;\n}\n\n.about-page .drawing-controls {\n  flex: 0 1 auto;\n}\n\n.about-word,\n.keyword {\n  color: #111111;\n  transition: color 100ms ease;\n}\n\n.music-word,\n.album-title {\n  color: #111111;\n  transition: color 100ms ease;\n}\n\n.album-title {\n  font-style: normal;\n}\n\n.band-link {\n  color: #111111;\n  text-decoration: none;\n  transition: color 100ms ease;\n}\n\n.music-word:hover,\n.band-link:hover,\n.band-link:focus-visible,\n.album-title:hover,\n.album-title:focus-visible,\n.album-title.is-discovered {\n  color: #0000ff;\n}\n\n.album-title:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.band-link:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-copy .keyword {\n  text-decoration: none;\n}\n\n.future-link {\n  color: #111111;\n  text-decoration-line: none;\n  text-decoration-color: #111111;\n  text-decoration-thickness: 0.08em;\n  text-underline-offset: 0.14em;\n  transition: color 100ms ease;\n}\n\n.future-link.is-visited {\n  text-decoration-line: underline;\n  text-decoration-color: #111111;\n}\n\n.future-link:hover,\n.future-link:focus-visible {\n  color: var(--about-accent);\n  text-decoration-line: underline;\n  text-decoration-color: var(--about-accent);\n}\n\n.future-link:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-word:hover,\n.keyword:hover,\n.keyword.is-discovered,\n.keyword:focus-visible {\n  color: var(--about-accent);\n}\n\n.keyword:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-drawing {\n  position: absolute;\n  top: 0;\n  left: 0;\n  z-index: 0;\n  display: block;\n  pointer-events: none;\n}\n\n.about-page .subpage {\n  position: relative;\n  z-index: 1;\n}\n\n.drawing-controls {\n  position: fixed;\n  bottom: 32px;\n  left: 32px;\n  z-index: 12;\n  display: flex;\n  align-items: center;\n  gap: 18px;\n}\n\n.drawing-controls button {\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 2vw, 28px);\n  font-weight: 900;\n  cursor: pointer;\n  transition: color 100ms ease;\n}\n\n.drawing-controls button[hidden] {\n  display: none;\n}\n\n.drawing-controls button:hover,\n.drawing-controls button:focus-visible,\n.drawing-toggle[aria-pressed=\"true\"] {\n  color: var(--about-accent);\n}\n\n.drawing-controls button:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.drawing-controls button:disabled {\n  color: #aaaaaa;\n  cursor: default;\n}\n\n.about-page.is-drawing,\n.about-page.is-drawing * {\n  cursor: crosshair;\n  user-select: none;\n}\n\n.about-page.is-drawing {\n  touch-action: none;\n}\n\n.about-page.is-drawing a,\n.about-page.is-drawing button {\n  cursor: pointer;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 20px;\n  }\n\n  .mic-control {\n    right: 20px;\n    bottom: 20px;\n    left: 20px;\n    gap: 10px;\n  }\n\n  .main-nav {\n    padding: 20px;\n  }\n\n  .subpage {\n    padding: 20px;\n  }\n\n  .subpage-back {\n    right: 20px;\n    bottom: 16px;\n  }\n\n  .drawing-controls {\n    bottom: 20px;\n    left: 20px;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .letter,\n  .main-nav a,\n  .subpage-back,\n  .about-word,\n  .music-word,\n  .album-title,\n  .band-link,\n  .band-image,\n  .keyword,\n  .future-link,\n  .drawing-controls button {\n    transition: none;\n  }\n\n}\n\nmain > h1 { display:none !important } .music-page .subpage { --music-title-width:1050px !important } .band-gallery { margin-top:0 } main.subpage > :not(.band-gallery), body.music-page .subpage-back { display:none !important }h1 .letter, h2 .letter { pointer-events:none }","script":"document.querySelectorAll('h1 .word').forEach(word => {\n  const text = word.textContent;\n  word.setAttribute('aria-label', text);\n  word.textContent = '';\n\n  [...text].forEach(character => {\n    const letter = document.createElement('span');\n    letter.className = 'letter';\n    letter.setAttribute('aria-hidden', 'true');\n    letter.textContent = character;\n    word.appendChild(letter);\n  });\n});\n\ndocument.querySelectorAll('.interactive-title').forEach(title => {\n  const words = title.textContent.trim().split(/\\s+/);\n  const fullTitle = words.join(' ');\n\n  title.setAttribute('aria-label', fullTitle);\n  title.textContent = '';\n\n  words.forEach((word, wordIndex) => {\n    const wordElement = document.createElement('span');\n    wordElement.className = 'title-word';\n    wordElement.setAttribute('aria-hidden', 'true');\n\n    [...word].forEach(character => {\n      const letter = document.createElement('span');\n      letter.className = 'letter';\n      letter.textContent = character;\n      wordElement.appendChild(letter);\n    });\n\n    title.appendChild(wordElement);\n    if (wordIndex \u003c words.length - 1) {\n      title.appendChild(document.createTextNode(' '));\n    }\n  });\n});\n\nconst musicPage = document.querySelector('.music-page');\nconst musicTitle = musicPage?.querySelector('.interactive-title');\n\nif (musicPage && musicTitle) {\n  const syncMusicMediaWidth = () => {\n    musicPage.style.setProperty(\n      '--music-title-width',\n      `${Math.ceil(musicTitle.getBoundingClientRect().width)}px`\n    );\n  };\n\n  syncMusicMediaWidth();\n  window.addEventListener('resize', syncMusicMediaWidth);\n  document.fonts?.ready.then(syncMusicMediaWidth);\n}\n\nconst aboutPage = document.querySelector('.about-page');\nconst aboutTitle = aboutPage?.querySelector('.interactive-title');\n\nif (aboutPage && aboutTitle) {\n  const syncAboutCopyWidth = () => {\n    aboutPage.style.setProperty(\n      '--about-title-width',\n      `${Math.ceil(aboutTitle.getBoundingClientRect().width)}px`\n    );\n  };\n\n  syncAboutCopyWidth();\n  window.addEventListener('resize', syncAboutCopyWidth);\n  document.fonts?.ready.then(syncAboutCopyWidth);\n}\n\nconst mainNav = document.querySelector('.main-nav');\nconst navigationEntry = performance.getEntriesByType?.('navigation')[0];\nconst isPageReload = navigationEntry\n  ? navigationEntry.type === 'reload'\n  : performance.navigation?.type === 1;\n\nif (mainNav && isPageReload) {\n  if (window.location.hash) {\n    history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);\n  }\n\n  const returnToPageTop = () => {\n    requestAnimationFrame(() => window.scrollTo(0, 0));\n  };\n\n  returnToPageTop();\n  window.addEventListener('pageshow', returnToPageTop, { once: true });\n}\n\nconst aboutNavLink = document.querySelector('.main-nav a[href=\"about.html\"]');\nconst musicNavLink = document.querySelector('.main-nav a[href=\"music.html\"]');\n\nfunction markAboutReturn() {\n  if (!aboutNavLink) {\n    return;\n  }\n\n  try {\n    if (sessionStorage.getItem('returning-from-about') === 'true') {\n      aboutNavLink.classList.add('about-returned');\n      sessionStorage.removeItem('returning-from-about');\n    }\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n}\n\nif (document.body.classList.contains('about-page')) {\n  try {\n    sessionStorage.setItem('returning-from-about', 'true');\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n} else {\n  markAboutReturn();\n  window.addEventListener('pageshow', markAboutReturn);\n}\n\nfunction markMusicReturn() {\n  if (!musicNavLink) {\n    return;\n  }\n\n  try {\n    if (sessionStorage.getItem('returning-from-music') === 'true') {\n      musicNavLink.classList.add('music-returned');\n      sessionStorage.removeItem('returning-from-music');\n    }\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n}\n\nif (document.body.classList.contains('music-page')) {\n  try {\n    sessionStorage.setItem('returning-from-music', 'true');\n  } catch (error) {\n    // The navigation still works if storage is unavailable.\n  }\n} else {\n  markMusicReturn();\n  window.addEventListener('pageshow', markMusicReturn);\n}\n\nconst micToggle = document.querySelector('.mic-toggle');\n\nif (micToggle) {\n  const micMeter = document.querySelector('.mic-meter');\n  const micWave = document.querySelector('.mic-wave');\n  const micWaveContext = micWave.getContext('2d');\n  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');\n\n  let audioContext;\n  let microphoneStream;\n  let microphoneAnimation;\n  let microphoneActive = false;\n  let displayedLevel = 0;\n  let displayedBrightness = 0.2;\n  let texturePhase = 0;\n  let lastVisualUpdate = 0;\n  const recordingHistory = [];\n\n  function clamp(value, minimum, maximum) {\n    return Math.min(Math.max(value, minimum), maximum);\n  }\n\n  function calculateBrightness(frequencyData) {\n    let magnitudeTotal = 0;\n    let weightedFrequency = 0;\n    const nyquist = audioContext.sampleRate / 2;\n\n    for (let index = 1; index \u003c frequencyData.length; index++) {\n      const magnitude = frequencyData[index];\n      const frequency = index / frequencyData.length * nyquist;\n      magnitudeTotal += magnitude;\n      weightedFrequency += frequency * magnitude;\n    }\n\n    if (magnitudeTotal === 0) {\n      return 0.15;\n    }\n\n    const centroid = weightedFrequency / magnitudeTotal;\n    return clamp((centroid - 250) / 3200, 0, 1);\n  }\n\n  function calculateSampleTexture(samples) {\n    const quarter = Math.floor(samples.length / 4);\n    const texture = (\n      samples[quarter] -\n      samples[quarter * 2] +\n      samples[quarter * 3]\n    ) * 1.5;\n\n    return clamp(texture, -1, 1);\n  }\n\n  function drawWaveSide(direction, center, height, spacing) {\n    if (recordingHistory.length === 0) {\n      return;\n    }\n\n    const points = recordingHistory.map((entry, index) => ({\n      x: index * spacing,\n      y: center + direction * entry.level * height * 0.43\n    }));\n\n    micWaveContext.beginPath();\n    micWaveContext.moveTo(points[0].x, points[0].y);\n\n    for (let index = 1; index \u003c points.length; index++) {\n      const previous = points[index - 1];\n      const current = points[index];\n      const midpointX = (previous.x + current.x) / 2;\n      const midpointY = (previous.y + current.y) / 2;\n      micWaveContext.quadraticCurveTo(previous.x, previous.y, midpointX, midpointY);\n    }\n\n    const finalPoint = points[points.length - 1];\n    micWaveContext.lineTo(finalPoint.x, finalPoint.y);\n    micWaveContext.stroke();\n  }\n\n  function drawRecordingLine() {\n    const width = micWave.clientWidth;\n    const height = micWave.clientHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    const canvasWidth = Math.round(width * pixelRatio);\n    const canvasHeight = Math.round(height * pixelRatio);\n\n    if (width === 0 || height === 0) {\n      return;\n    }\n\n    if (micWave.width !== canvasWidth || micWave.height !== canvasHeight) {\n      micWave.width = canvasWidth;\n      micWave.height = canvasHeight;\n    }\n\n    const spacing = reducedMotion.matches ? 8 : 4;\n    const maximumPoints = Math.ceil(width / spacing) + 1;\n\n    while (recordingHistory.length > maximumPoints) {\n      recordingHistory.shift();\n    }\n\n    micWaveContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    micWaveContext.clearRect(0, 0, width, height);\n    micWaveContext.lineWidth = 1.35;\n    micWaveContext.lineCap = 'round';\n    micWaveContext.lineJoin = 'round';\n    micWaveContext.strokeStyle = '#111111';\n\n    const center = height / 2;\n    drawWaveSide(-1, center, height, spacing);\n    drawWaveSide(1, center, height, spacing);\n\n    if (microphoneActive && recordingHistory.length > 0) {\n      const newestIndex = recordingHistory.length - 1;\n      const newestLevel = recordingHistory[newestIndex].level;\n      const newestX = newestIndex * spacing;\n      const upperY = center - newestLevel * height * 0.43;\n      const lowerY = center + newestLevel * height * 0.43;\n\n      micWaveContext.beginPath();\n      micWaveContext.moveTo(newestX, upperY);\n      micWaveContext.lineTo(newestX, lowerY);\n      micWaveContext.stroke();\n    }\n  }\n\n  function updateMicrophone(analyser, samples, frequencyData, timestamp) {\n    analyser.getFloatTimeDomainData(samples);\n    analyser.getByteFrequencyData(frequencyData);\n\n    let sum = 0;\n    for (const sample of samples) {\n      sum += sample * sample;\n    }\n\n    const rms = Math.sqrt(sum / samples.length);\n    const targetLevel = Math.min(1, Math.max(0, rms - 0.005) * 17);\n    const targetBrightness = rms > 0.01\n      ? calculateBrightness(frequencyData)\n      : 0.15;\n    const levelResponse = targetLevel > displayedLevel ? 0.13 : 0.04;\n\n    displayedLevel += (targetLevel - displayedLevel) * levelResponse;\n    displayedBrightness += (targetBrightness - displayedBrightness) * 0.04;\n    micMeter.setAttribute('aria-valuenow', String(Math.round(displayedLevel * 100)));\n\n    const visualInterval = reducedMotion.matches ? 180 : 40;\n    if (timestamp - lastVisualUpdate >= visualInterval) {\n      const sampleTexture = calculateSampleTexture(samples);\n      texturePhase += reducedMotion.matches\n        ? 0.06\n        : 0.12 + displayedBrightness * 0.16;\n      const frequencyTexture = Math.sin(texturePhase) * (\n        0.01 + displayedBrightness * 0.02\n      );\n      const organicTexture = sampleTexture * 0.02;\n      const texturedLevel = clamp(\n        displayedLevel * (1 + frequencyTexture + organicTexture),\n        0,\n        1\n      );\n\n      recordingHistory.push({ level: texturedLevel });\n      drawRecordingLine();\n      lastVisualUpdate = timestamp;\n    }\n\n    microphoneAnimation = requestAnimationFrame(nextTimestamp => {\n      updateMicrophone(analyser, samples, frequencyData, nextTimestamp);\n    });\n  }\n\n  async function startMicrophone() {\n    if (!navigator.mediaDevices?.getUserMedia) {\n      micToggle.textContent = 'MIC UNAVAILABLE';\n      return;\n    }\n\n    micToggle.disabled = true;\n\n    try {\n      microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n\n      if (!AudioContextClass) {\n        throw new Error('Web Audio is unavailable');\n      }\n\n      audioContext = new AudioContextClass();\n      await audioContext.resume();\n\n      const source = audioContext.createMediaStreamSource(microphoneStream);\n      const analyser = audioContext.createAnalyser();\n\n      analyser.fftSize = 2048;\n      analyser.smoothingTimeConstant = 0.88;\n      const samples = new Float32Array(analyser.fftSize);\n      const frequencyData = new Uint8Array(analyser.frequencyBinCount);\n      source.connect(analyser);\n\n      microphoneActive = true;\n      lastVisualUpdate = 0;\n      micToggle.textContent = 'SOUND OFF';\n      microphoneAnimation = requestAnimationFrame(timestamp => {\n        updateMicrophone(analyser, samples, frequencyData, timestamp);\n      });\n    } catch (error) {\n      microphoneStream?.getTracks().forEach(track => track.stop());\n      microphoneStream = undefined;\n      await audioContext?.close().catch(() => {});\n      audioContext = undefined;\n      microphoneActive = false;\n      micToggle.textContent = 'MIC DENIED';\n    } finally {\n      micToggle.disabled = false;\n    }\n  }\n\n  async function stopMicrophone() {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n    await audioContext?.close().catch(() => {});\n\n    microphoneStream = undefined;\n    audioContext = undefined;\n    microphoneActive = false;\n    displayedLevel = 0;\n    micMeter.setAttribute('aria-valuenow', '0');\n    micToggle.textContent = 'SOUND ON';\n    drawRecordingLine();\n  }\n\n  micToggle.addEventListener('click', () => {\n    if (microphoneActive) {\n      stopMicrophone();\n    } else {\n      startMicrophone();\n    }\n  });\n\n  window.addEventListener('keydown', event => {\n    const target = event.target;\n    const isEditable = target instanceof HTMLElement && (\n      target.isContentEditable ||\n      target.tagName === 'INPUT' ||\n      target.tagName === 'TEXTAREA' ||\n      target.tagName === 'SELECT'\n    );\n\n    if (event.code !== 'Space' || event.repeat || isEditable) {\n      return;\n    }\n\n    event.preventDefault();\n    if (!micToggle.disabled) {\n      micToggle.click();\n    }\n  });\n\n  window.addEventListener('resize', drawRecordingLine);\n  window.addEventListener('pagehide', () => {\n    cancelAnimationFrame(microphoneAnimation);\n    microphoneStream?.getTracks().forEach(track => track.stop());\n  });\n}\n\nconst drawingCanvas = document.querySelector('.about-drawing');\n\nconst musicCopy = document.querySelector('.music-page .subpage-copy');\n\nif (musicCopy) {\n  musicCopy.querySelectorAll('p').forEach(paragraph => {\n    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n    const textNodes = [];\n\n    while (walker.nextNode()) {\n      if (!walker.currentNode.parentElement.closest('.album-title, .band-link')) {\n        textNodes.push(walker.currentNode);\n      }\n    }\n\n    textNodes.forEach(textNode => {\n      const fragment = document.createDocumentFragment();\n      const parts = textNode.textContent.split(/(\\s+)/);\n\n      parts.forEach(part => {\n        if (!part || /^\\s+$/.test(part)) {\n          fragment.appendChild(document.createTextNode(part));\n          return;\n        }\n\n        const word = document.createElement('span');\n        word.className = 'music-word';\n        word.textContent = part;\n        fragment.appendChild(word);\n      });\n\n      textNode.replaceWith(fragment);\n    });\n  });\n\n  const discoverAlbum = event => {\n    if (event.target instanceof Element && event.target.matches('.album-title')) {\n      event.target.classList.add('is-discovered');\n    }\n  };\n\n  musicCopy.addEventListener('pointerover', discoverAlbum);\n  musicCopy.addEventListener('focusin', discoverAlbum);\n}\n\nif (drawingCanvas) {\n  document.querySelectorAll('.about-copy p').forEach(paragraph => {\n    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);\n    const textNodes = [];\n\n    while (walker.nextNode()) {\n      if (!walker.currentNode.parentElement.closest('.keyword, .future-link')) {\n        textNodes.push(walker.currentNode);\n      }\n    }\n\n    textNodes.forEach(textNode => {\n      const fragment = document.createDocumentFragment();\n      const parts = textNode.textContent.split(/(\\s+)/);\n\n      parts.forEach(part => {\n        if (!part || /^\\s+$/.test(part)) {\n          fragment.appendChild(document.createTextNode(part));\n          return;\n        }\n\n        const word = document.createElement('span');\n        word.className = 'about-word';\n        word.textContent = part;\n        fragment.appendChild(word);\n      });\n\n      textNode.replaceWith(fragment);\n    });\n  });\n\n  document.querySelector('.about-copy').addEventListener('pointerover', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  document.querySelector('.about-copy').addEventListener('focusin', event => {\n    if (event.target instanceof Element && event.target.matches('.keyword')) {\n      event.target.classList.add('is-discovered');\n    }\n\n    if (event.target instanceof Element && event.target.matches('.future-link')) {\n      event.target.classList.add('is-visited');\n    }\n  });\n\n  const drawingContext = drawingCanvas.getContext('2d');\n  const drawingToggle = document.querySelector('.drawing-toggle');\n  const drawingClear = document.querySelector('.drawing-clear');\n  const aboutPage = document.querySelector('.about-page');\n  const aboutContent = document.querySelector('.subpage');\n  const strokes = [];\n\n  let drawingEnabled = false;\n  let activePointer = null;\n  let activeStroke = null;\n  let canvasWidth = 0;\n  let canvasHeight = 0;\n  let resizeFrame;\n\n  function configureDrawingContext() {\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);\n    drawingContext.lineWidth = 5;\n    drawingContext.lineCap = 'round';\n    drawingContext.lineJoin = 'round';\n    drawingContext.strokeStyle = getComputedStyle(aboutPage)\n      .getPropertyValue('--about-accent').trim() || '#ff34b3';\n  }\n\n  function renderDrawing() {\n    drawingContext.clearRect(0, 0, canvasWidth, canvasHeight);\n    configureDrawingContext();\n\n    strokes.forEach(stroke => {\n      if (stroke.length === 0) {\n        return;\n      }\n\n      drawingContext.beginPath();\n      drawingContext.moveTo(stroke[0].x, stroke[0].y);\n\n      if (stroke.length === 1) {\n        drawingContext.lineTo(stroke[0].x + 0.01, stroke[0].y + 0.01);\n      } else {\n        stroke.slice(1).forEach(point => {\n          drawingContext.lineTo(point.x, point.y);\n        });\n      }\n\n      drawingContext.stroke();\n    });\n  }\n\n  function resizeDrawingCanvas() {\n    const nextWidth = Math.max(document.documentElement.scrollWidth, window.innerWidth);\n    const nextHeight = Math.max(document.documentElement.scrollHeight, window.innerHeight);\n\n    if (nextWidth === canvasWidth && nextHeight === canvasHeight) {\n      return;\n    }\n\n    if (canvasWidth && canvasHeight) {\n      const scaleX = nextWidth / canvasWidth;\n      const scaleY = nextHeight / canvasHeight;\n\n      strokes.forEach(stroke => {\n        stroke.forEach(point => {\n          point.x *= scaleX;\n          point.y *= scaleY;\n        });\n      });\n    }\n\n    canvasWidth = nextWidth;\n    canvasHeight = nextHeight;\n    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);\n    drawingCanvas.width = Math.round(canvasWidth * pixelRatio);\n    drawingCanvas.height = Math.round(canvasHeight * pixelRatio);\n    drawingCanvas.style.width = `${canvasWidth}px`;\n    drawingCanvas.style.height = `${canvasHeight}px`;\n    renderDrawing();\n  }\n\n  function scheduleCanvasResize() {\n    cancelAnimationFrame(resizeFrame);\n    resizeFrame = requestAnimationFrame(resizeDrawingCanvas);\n  }\n\n  function isControl(target) {\n    return target instanceof Element && Boolean(target.closest(\n      'a, button, input, textarea, select, [contenteditable=\"true\"]'\n    ));\n  }\n\n  function addDrawingPoint(event) {\n    const events = event.getCoalescedEvents?.() || [event];\n\n    events.forEach(pointerEvent => {\n      activeStroke.push({ x: pointerEvent.pageX, y: pointerEvent.pageY });\n    });\n\n    renderDrawing();\n  }\n\n  function finishStroke(event) {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    activePointer = null;\n    activeStroke = null;\n    drawingClear.disabled = strokes.length === 0;\n    drawingClear.hidden = strokes.length === 0;\n  }\n\n  drawingToggle.addEventListener('click', () => {\n    drawingEnabled = !drawingEnabled;\n    activePointer = null;\n    activeStroke = null;\n    aboutPage.classList.toggle('is-drawing', drawingEnabled);\n    drawingToggle.setAttribute('aria-pressed', String(drawingEnabled));\n    drawingToggle.textContent = drawingEnabled ? 'DRAW OFF' : 'DRAW ON';\n    drawingClear.hidden = !drawingEnabled || strokes.length === 0;\n  });\n\n  drawingClear.addEventListener('click', () => {\n    strokes.length = 0;\n    activePointer = null;\n    activeStroke = null;\n    drawingClear.disabled = true;\n    drawingClear.hidden = true;\n    renderDrawing();\n  });\n\n  document.addEventListener('pointerdown', event => {\n    if (!drawingEnabled || activePointer !== null || isControl(event.target)) {\n      return;\n    }\n\n    if (event.pointerType === 'mouse' && event.button !== 0) {\n      return;\n    }\n\n    event.preventDefault();\n    activePointer = event.pointerId;\n    activeStroke = [];\n    strokes.push(activeStroke);\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointermove', event => {\n    if (event.pointerId !== activePointer) {\n      return;\n    }\n\n    event.preventDefault();\n    addDrawingPoint(event);\n  }, { capture: true });\n\n  document.addEventListener('pointerup', finishStroke, { capture: true });\n  document.addEventListener('pointercancel', finishStroke, { capture: true });\n  window.addEventListener('resize', scheduleCanvasResize);\n\n  if ('ResizeObserver' in window && aboutContent) {\n    new ResizeObserver(scheduleCanvasResize).observe(aboutContent);\n  }\n\n  document.fonts?.ready.then(scheduleCanvasResize);\n  resizeDrawingCanvas();\n}\n","explanation":"I wanted to add something interactive. After seeing the result, though, I did not like the colour inversion."},{"id":"023","sourceId":"023","focus":"","prompt":"Remove the inversion. Apply a blue filter when the pointer hovers over a photo.","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"de\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>Bands &amp; Live — Nicoline Andrea\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody class=\"music-page\">\n  \u003cmain class=\"subpage\">\n    \u003ch1 class=\"interactive-title\">Bands &amp; Live\u003c/h1>\n\n    \u003cdiv class=\"band-gallery music-media\">\n      \u003cdiv class=\"band-image-wrap\" tabindex=\"0\">\n        \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-62-_K5A0140-Bearbeitet.jpg.jpg\" alt=\"AANIM band photograph\">\n      \u003c/div>\n      \u003cdiv class=\"band-image-wrap\" tabindex=\"0\">\n        \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-520-_K5A0215.jpg.jpg\" alt=\"AANIM band photograph\">\n      \u003c/div>\n      \u003cdiv class=\"band-image-wrap\" tabindex=\"0\">\n        \u003cimg class=\"band-image\" src=\"../../shared/historical-previews/019f43a2-290-_K5A0477-Bearbeitet-2.jpg.jpg\" alt=\"AANIM band photograph\">\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"subpage-copy\">\n      \u003cp>\u003ca class=\"band-link\" href=\"https://www.aanim.net/\" target=\"_blank\" rel=\"noopener noreferrer\">AANIM\u003c/a> is my band. We have already released two albums: \u003ccite class=\"album-title\" tabindex=\"0\">Contemplation / Remedy\u003c/cite> and \u003ccite class=\"album-title\" tabindex=\"0\">Fuormas Neras\u003c/cite>.\u003c/p>\n\n      \u003cp>Orange-red sky on an icy afternoon, trying to escape the darkness of time—like a deep diver surrounded by a glowing blur, like a sunny Sunday driven by a heavy hangover. It’s chaotic but beautiful: a mix of intensity and calm, with a style that brings to mind bands like Radiohead, Kush K, and elements of Parcels.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"video-embed music-media\">\n      \u003ciframe\n        src=\"https://www.youtube-nocookie.com/embed/ehqON-5_tG4?start=8\"\n        title=\"AANIM video\"\n        loading=\"lazy\"\n        referrerpolicy=\"strict-origin-when-cross-origin\"\n        allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\"\n        allowfullscreen>\n      \u003c/iframe>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cdiv class=\"about-frame-actions\">\n    \u003ca class=\"subpage-back\" href=\"../../index.html\" target=\"_top\" aria-label=\"Zurück zu den Themen\">←\u003c/a>\n  \u003c/div>\n  \u003cscript src=\"script.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","styles":"* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  background: #ffffff;\n  color: #111111;\n  font-family: Arial, Helvetica, sans-serif;\n}\n\nheader {\n  position: relative;\n  min-height: 100vh;\n  min-height: 100svh;\n  padding: 32px;\n  overflow: hidden;\n}\n\nh1 {\n  margin: 0;\n  font-size: clamp(56px, 13vw, 180px);\n  font-weight: 900;\n  line-height: 0.74;\n  letter-spacing: -0.06em;\n}\n\nh1 > .word {\n  display: block;\n  white-space: nowrap;\n}\n\n.letter {\n  display: inline-block;\n  transition: opacity 100ms ease;\n}\n\n.letter:hover {\n  opacity: 0;\n}\n\n.title-word {\n  display: inline-block;\n  white-space: nowrap;\n}\n\n.mic-control {\n  position: absolute;\n  right: 32px;\n  bottom: 32px;\n  left: 32px;\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n  gap: 10px;\n}\n\n.mic-toggle {\n  align-self: flex-start;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 2vw, 28px);\n  font-weight: 900;\n  cursor: pointer;\n}\n\n.mic-toggle:disabled {\n  cursor: wait;\n  opacity: 0.45;\n}\n\n.mic-meter {\n  position: relative;\n  height: clamp(72px, 9vw, 120px);\n  overflow: hidden;\n}\n\n.mic-wave {\n  position: absolute;\n  inset: 0;\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n\n.main-nav {\n  min-height: 100vh;\n  min-height: 100svh;\n  padding: 32px 32px 48px;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  gap: clamp(12px, 2vh, 28px);\n}\n\n.main-nav a {\n  display: block;\n  color: #111111;\n  font-size: clamp(34px, 6vw, 92px);\n  font-weight: 900;\n  line-height: 0.88;\n  letter-spacing: -0.055em;\n  text-decoration: none;\n  transition: opacity 120ms ease;\n}\n\n.main-nav a:hover {\n  opacity: 0;\n}\n\n.main-nav a.about-returned {\n  color: transparent;\n}\n\n.main-nav a.music-returned {\n  color: #0000ff;\n}\n\n.subpage {\n  min-height: 100vh;\n  padding: 32px;\n}\n\n.subpage-back {\n  position: fixed;\n  right: 32px;\n  bottom: 24px;\n  z-index: 10;\n  display: block;\n  width: clamp(72px, 9vw, 130px);\n  height: clamp(44px, 5.5vw, 80px);\n  color: #111111;\n  font-size: 0;\n  text-decoration: none;\n  transition: opacity 100ms ease;\n}\n\n.subpage-back:hover {\n  opacity: 0;\n}\n\n.subpage-back::before {\n  content: \"\";\n  display: block;\n  width: 100%;\n  height: 100%;\n  background: currentColor;\n  clip-path: polygon(\n    0 50%,\n    36% 0,\n    36% 33%,\n    100% 33%,\n    100% 67%,\n    36% 67%,\n    36% 100%\n  );\n}\n\n.subpage h1 {\n  max-width: 1400px;\n  font-size: clamp(46px, 8.5vw, 136px);\n  line-height: 0.82;\n}\n\n.about-copy,\n.subpage-copy {\n  max-width: 1050px;\n  margin-top: clamp(20px, 3vw, 40px);\n  padding-bottom: clamp(180px, 20vw, 260px);\n  font-size: clamp(18px, 1.8vw, 27px);\n  line-height: 1.24;\n}\n\n.about-copy p,\n.subpage-copy p {\n  margin: 0 0 1em;\n  text-align: justify;\n  text-align-last: left;\n  text-justify: inter-word;\n}\n\n.band-gallery {\n  display: grid;\n  gap: clamp(16px, 2.5vw, 36px);\n  margin-top: clamp(20px, 3vw, 40px);\n  margin-bottom: clamp(24px, 3vw, 44px);\n}\n\n.band-image {\n  display: block;\n  width: 100%;\n  height: auto;\n  transition: filter 160ms ease;\n}\n\n.music-page .band-image-wrap {\n  position: relative;\n  overflow: hidden;\n}\n\n.music-page .band-image-wrap::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: #0000ff;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 160ms ease;\n}\n\n.music-page .band-image-wrap:hover .band-image,\n.music-page .band-image-wrap:focus-visible .band-image {\n  filter: contrast(1.18);\n}\n\n.music-page .band-image-wrap:hover::after,\n.music-page .band-image-wrap:focus-visible::after {\n  opacity: 0.38;\n}\n\n.music-page .band-image-wrap:focus-visible {\n  outline: 2px solid #0000ff;\n  outline-offset: 3px;\n}\n\n.video-embed {\n  width: 100%;\n  margin-top: clamp(28px, 4vw, 56px);\n  aspect-ratio: 16 / 9;\n}\n\n.video-embed iframe {\n  display: block;\n  width: 100%;\n  height: 100%;\n  border: 0;\n}\n\n.about-page,\n.music-page {\n  --about-accent: transparent;\n  --about-frame-gutter: clamp(20px, 3.2vw, 48px);\n  --about-frame-max: 1400px;\n}\n\n.about-page .subpage,\n.music-page .subpage,\n.about-frame-actions {\n  width: min(\n    calc(100% - var(--about-frame-gutter) - var(--about-frame-gutter)),\n    var(--about-frame-max)\n  );\n  margin-inline: auto;\n}\n\n.about-page .subpage,\n.music-page .subpage {\n  padding: var(--about-frame-gutter) 0;\n}\n\n.about-page .subpage h1,\n.music-page .subpage h1 {\n  width: fit-content;\n  max-width: 100%;\n}\n\n.about-page .about-copy {\n  width: min(100%, var(--about-title-width, 1050px));\n  max-width: none;\n}\n\n.music-page .subpage-copy {\n  width: min(100%, var(--music-title-width, 1050px));\n  max-width: none;\n  margin-top: 0;\n  padding-bottom: 0;\n}\n\n.music-media {\n  width: min(100%, var(--music-title-width, 1050px));\n}\n\n.music-page .video-embed {\n  margin-bottom: clamp(120px, 14vw, 190px);\n}\n\n.about-frame-actions {\n  position: fixed;\n  right: 0;\n  bottom: clamp(16px, 2vw, 32px);\n  left: 0;\n  z-index: 12;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  justify-content: flex-start;\n  gap: clamp(10px, 1vw, 16px);\n  pointer-events: none;\n}\n\n.about-page .subpage-back,\n.music-page .subpage-back,\n.about-page .drawing-controls {\n  position: static;\n  pointer-events: auto;\n}\n\n.about-page .subpage-back,\n.music-page .subpage-back {\n  width: clamp(36px, 4.5vw, 65px);\n  height: clamp(22px, 2.75vw, 40px);\n  margin-top: 0;\n}\n\n.about-page .drawing-controls {\n  flex: 0 1 auto;\n}\n\n.about-word,\n.keyword {\n  color: #111111;\n  transition: color 100ms ease;\n}\n\n.music-word,\n.album-title {\n  color: #111111;\n  transition: color 100ms ease;\n}\n\n.album-title {\n  font-style: normal;\n}\n\n.band-link {\n  color: #111111;\n  text-decoration: none;\n  transition: color 100ms ease;\n}\n\n.music-word:hover,\n.band-link:hover,\n.band-link:focus-visible,\n.album-title:hover,\n.album-title:focus-visible,\n.album-title.is-discovered {\n  color: #0000ff;\n}\n\n.album-title:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.band-link:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-copy .keyword {\n  text-decoration: none;\n}\n\n.future-link {\n  color: #111111;\n  text-decoration-line: none;\n  text-decoration-color: #111111;\n  text-decoration-thickness: 0.08em;\n  text-underline-offset: 0.14em;\n  transition: color 100ms ease;\n}\n\n.future-link.is-visited {\n  text-decoration-line: underline;\n  text-decoration-color: #111111;\n}\n\n.future-link:hover,\n.future-link:focus-visible {\n  color: var(--about-accent);\n  text-decoration-line: underline;\n  text-decoration-color: var(--about-accent);\n}\n\n.future-link:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-word:hover,\n.keyword:hover,\n.keyword.is-discovered,\n.keyword:focus-visible {\n  color: var(--about-accent);\n}\n\n.keyword:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.about-drawing {\n  position: absolute;\n  top: 0;\n  left: 0;\n  z-index: 0;\n  display: block;\n  pointer-events: none;\n}\n\n.about-page .subpage {\n  position: relative;\n  z-index: 1;\n}\n\n.drawing-controls {\n  position: fixed;\n  bottom: 32px;\n  left: 32px;\n  z-index: 12;\n  display: flex;\n  align-items: center;\n  gap: 18px;\n}\n\n.drawing-controls button {\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #111111;\n  font: inherit;\n  font-size: clamp(18px, 2vw, 28px);\n  font-weight: 900;\n  cursor: pointer;\n  transition: color 100ms ease;\n}\n\n.drawing-controls button[hidden] {\n  display: none;\n}\n\n.drawing-controls button:hover,\n.drawing-controls button:focus-visible,\n.drawing-toggle[aria-pressed=\"true\"] {\n  color: var(--about-accent);\n}\n\n.drawing-controls button:focus-visible {\n  outline: 1px dotted currentColor;\n  outline-offset: 3px;\n}\n\n.drawing-controls button:disabled {\n  color: #aaaaaa;\n  cursor: default;\n}\n\n.about-page.is-drawing,\n.about-page.is-drawing * {\n  cursor: crosshair;\n  user-select: none;\n}\n\n.about-page.is-drawing {\n  touch-action: none;\n}\n\n.about-page.is-drawing a,\n.about-page.is-drawing button {\n  cursor: pointer;\n}\n\n@media (max-width: 600px) {\n  header {\n    padding: 20px;\n  }\n\n  .mic-control {\n    right: 20px;\n    bottom: 20px;\n    left: 20px;\n    gap: 10px;\n  }\n\n  .main-nav {\n    padding: 20px;\n  }\n\n  .subpage {\n    padding: 20px;\n  }\n\n  .subpage-back {\n    right: 20px;\n    bottom: 16px;\n  }\n\n  .drawing-controls {\n    bottom: 20px;\n    left: 20px;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .letter,\n  .main-nav a,\n  .subpage-back,\n  .about-word,\n  .music-word,\n  .album-title,\n  .band-link,\n  .band-image,\n  .band-image-wrap::after,\n  .keyword,\n  .future-link,\n  .drawing-controls button {\n    transition: none;\n  }\n\n}\n\nmain > h1 { display:none !important } .music-page .subpage { --music-title-width:1050px !important } .band-gallery { margin-top:0 } main.subpage > :not(.band-gallery), body.music-page .subpage-back { display:none !important }h1 .letter, h2 .letter { pointer-events:none }","script":"document.querySelectorAll('h1 .word').forEach(word => {\n  const text = word.textContent;\n  word.setAttribute('aria-label', text);\n  word.textContent = '';\n\n  [...text].forEach(character => {\n    const letter = document.createElement('span');\n    letter.className = 'letter';\n    letter.setAttribute('aria-hidden', 'true');\n    letter.textContent = character;\n    word.appendChild(letter);\n  });\n});\n\ndocument.querySelectorAll('.interactive-title').forEach(title => {\n  const words = title.textContent.trim().split(/\\s+/);\n  const fullTitle = words.join(' ');\n\n  title.setAttribute('aria-label', fullTitle);\n  title.textContent = '';\n\n  words.forEach((word, wordIndex) => {\n    const wordElement = document.createElement('span');\n    wordElement.className = 'title-word';\n    wordElement.setAttribute('aria-hidden', 'true');\n\n    [...word].forEach(character => {\n      const letter = document.createElement('span');\n      letter.className = 'letter';\n      letter.textContent = character;\n      wordElement.appendChild(letter);\n    });\n\n    title.appendChild(wordElement);\n    if (wordIndex \u003c words.length - 1) {\n      title.appendChild(document.createTextNode(' '));\n    }\n  });\n});\n\nconst musicPage = document.querySelector('.music-page');\nconst musicTitle = musicPage?.querySelector('.interactive-title');\n\nif (musicPage && musicTitle) {\n  const syncMusicMediaWidth = () => {\n    musicPage.style.setProperty(\n      '--music-title-width',\n      `${Math.ceil(musicTitle.getBoundingClientRect().width)}px`\n    );\n  };\n\n  syncMusicMediaWidth();\n  window.addEventListener('resize', syncMusicMediaWidth);\n  document.fonts?.ready.then(syncMusicMediaWidth);\n}\n\nconst aboutPage = document.querySelector('.about-page');\nconst aboutTitle = aboutPage?.querySelector('.interactive-title');\n\nif (aboutPage && aboutTitle) {\n  const syncAboutCopyWidth = () => {\n    aboutPage.style.setProperty(\n      '--about-title-width',\n      `${Math.ceil(aboutTitle.getBoundingClientRect().width)}px`\n    );\n  };\n\n  syncAboutCopyWidth();\n  window.addEventListener('resize', syncAboutCopyWidth);\n  document.fonts?.ready.then(syncAboutCopyWidth);\n}\n\nconst mainNav = document.querySelector('.main-nav');\nconst navigationEntry = performance.getEntriesByType?.('navigation')[0];\nconst isPageReload = navigationEntry\n  ? navigationEntry.type === 'reload'\n  : performance.navigation?.type === 1;\n\nif (mainNav && isPageReload) {\n  if (window.location.hash) {\n    history.replaceState(null, '', `${window.location.
